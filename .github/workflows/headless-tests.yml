name: headless-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7-stable"

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import project
        run: '"$GODOT" --headless --path ydgodot --import'

      - name: Headless regression
        run: ./ydgodot/tools/run_tests.sh

      - name: Audit palette
        run: python3 ydgodot/tools/mono_audit.py --check

      - name: Audit test private access
        run: python3 ydgodot/tools/test_audit.py --check
