function assignClue(clueKey, sense){
  const n = G.nodes[clueKey];
  if (!n || n.kind !== "clue") return false;
  const c = CLUES[n.id];
  if (!c || c.type !== sense){ toast("「" + esc(n.label) + "」的感官类型不是" + SENSES[sense], true); return false; }
  if (G.matrix[sense].indexOf(n.id) >= 0) return false;
  pushHistory();
  G.matrix[sense].push(n.id);
  log("「" + esc(n.label) + "」归入" + SENSES[sense] + "槽位", "sys");
  render(); refreshInferWin();
  return true;
}
function executeInference(){
  const inMatrix = new Set();
  Object.keys(G.matrix).forEach(s => G.matrix[s].forEach(id => inMatrix.add(id)));
  const hit = ENDINGS.find(e => {
    const r = e.recipe || [];
    return r.length === inMatrix.size && r.every(id => inMatrix.has(id));
  });
  if (hit){ refreshInferWin(); triggerEnding(hit); }
  else { toast("配方不匹配，再想想", true); log("推演失败：当前阵列不匹配任何结局配方", "warn"); }
}

/* ============ 结局演出（步进状态机：setTimeout 自动推进 / 点击跳过 / 钩子手动推进） ============ */
let endingState = null;
function triggerEnding(ending){
  G.endings.add(ending.id);
  log("<b>结局达成：" + esc(ending.name) + "</b>", "cap");
  endingState = { ending, step: 0, stages: buildStages(ending) };
  playEndingStage();
}
function buildStages(e){
  const st = [];
  (e.lines || []).forEach(l => st.push({ html: esc(l.text), delay: l.delay || 1200 }));
  if (e.isTrueCapture && e.truename) st.push({ html: "<div class='truename'>真名已识别<br>『" + esc(e.truename) + "』</div>", delay: 2000 });
  st.push({ html: esc(e.message || ""), delay: 1600 });
  st.push({ html: "<div style='text-align:center'><span class='ebtn'>" + (e.isTrueCapture ? "确认捕获" : "收下这份记录") + "</span></div>", final: true });
  return st;
}
function playEndingStage(){
  const st = endingState; if (!st) return;
  const overlay = document.getElementById("ending-overlay");
  if (st.step >= st.stages.length){ closeEnding(); return; }
  const stage = st.stages[st.step];
  const eol = overlay.querySelector(".eol") || (function(){ const d = document.createElement("div"); d.className = "eol"; overlay.appendChild(d); return d; })();
  const div = document.createElement("div");
  div.innerHTML = stage.html;
  eol.appendChild(div);
  overlay.style.display = "block";
  st.step++;
  if (!stage.final) st.timer = setTimeout(playEndingStage, stage.delay);
}
function closeEnding(){
  const overlay = document.getElementById("ending-overlay");
  overlay.style.display = "none";
  overlay.innerHTML = "";
  endingState = null;
  updateCrumbs();
}

/* ============ 详情面板 ============ */
function selectNode(key){
  const n = G.nodes[key];
  if (!n) { detailBody.innerHTML = "<div class='empty'>节点已不存在。</div>"; return; }
  nodeLayer.querySelectorAll(".node.sel").forEach(e => e.classList.remove("sel"));
  if (n.el) n.el.classList.add("sel");
  sel = key;
  if (!detailWinOpen) setDetailWin(true);   /* 选中节点时自动弹出详情窗 */

  let html = "<div class='dt'>" + esc(n.label) + "</div>";
  html += "<div class='dmeta'>" + (n.isScene ? "场景" : kindName(n.kind)) + " · " + n.key + "</div>";

  if (n.isScene){
    const s = SCENES[n.id] || {};
    const ins = Object.keys(SCENES).filter(x => sceneLocs(x).indexOf(n.id) >= 0).map(x => SCENES[x].title);
    html += "<div class='drow'>文本入口：" + (ins.length ? esc(ins.join("、")) : "<span style='color:#2b2b26'>无</span>") + "</div>";
    html += "<div class='drow'>出口：" + (sceneLocs(n.id).length ? esc(sceneLocs(n.id).map(x => SCENES[x].title).join("、")) : "无") + "</div>";
    html += "<div class='drow'>状态：" + (G.explored.has(n.id) ? "已展开" : "未展开") + "</div>";
    const storedLabels = Object.values(G.nodes).filter(x => x.stored && x.storedIn === n.id).map(x => x.label);
    html += "<div class='drow'>现场存放：" + (storedLabels.length ? esc(storedLabels.join("、")) + "（展开场景取回）" : "无") + "</div>";
    /* 正文只在叙事卡里出现一次；详情窗只给结构信息 + 回看入口（去重） */
    if (G.explored.has(n.id)) html += "<div class='drow'><button id='dt-renarr'>[ 重看场景叙事 ]</button></div>";
    detailBody.innerHTML = html;
    const rb = document.getElementById("dt-renarr");
    if (rb) rb.addEventListener("click", () => renarrScene(n.id));
    applyFocus();
    return;
  }

  if (n.kind === "clue"){
    const c = CLUES[n.id] || {};
    html += "<div class='ddesc'>" + esc(plain(c.desc || "（无描述）")) + "</div>";
    html += "<div class='drow'>感官类型：" + (SENSES[c.type] || c.type || "未知") + "</div>";
    html += "<div class='drow'>状态：" + (G.captured.has(n.id) ? "已捕获" : "未捕获") + "</div>";
    detailBody.innerHTML = html;
    applyFocus();
    return;
  }
  if (n.kind === "char"){
    const c = CHARS[n.id] || {};
    html += "<div class='ddesc'>" + esc(plain(c.desc || "（无描述）")) + "</div>";
    html += "<div class='drow'>对话进度：" + (G.talkProg[n.key] || 0) + "/" + charTalkQueue(n).length + "</div>";
    const seen = new Set();
    ["presentReactions","itemReactions","reactions"].forEach(f => Object.keys(c[f] || {}).forEach(k => seen.add(k)));
    if (seen.size){
      const names = [...seen].map(k => labelOf("item", k) || labelOf("clue", k) || k);
      html += "<div class='drow'>对这些东西有反应：" + esc(names.join("、")) + "</div>";
    }
    detailBody.innerHTML = html;
    applyFocus();
    return;
  }

  /* 物品 */
  const it = ITEMS[n.id] || {};
  /* 无命令的物品：描述已由「双击 → 提示条」呈现，详情窗不再复读；
     有命令的物品：双击跑的是命令，描述没有别的出口，保留在此（去重但不丢内容） */
  if ((it.commands || []).length) html += "<div class='ddesc'>" + esc(plain(it.desc || "（无描述）")) + "</div>";
  if (n.homeScene && SCENES[n.homeScene]) html += "<div class='drow'>来源：" + esc(SCENES[n.homeScene].title) + "</div>";
  const outs = [];
  for (const f in (it.presentReactions || {})) outs.push({ tool:f, r:it.presentReactions[f] });
  if (outs.length){
    html += "<div class='drow'>与这些东西存在反应：" +
      esc(outs.map(o => labelOf("item", o.tool) || labelOf("clue", o.tool) || o.tool).join("、")) + "</div>";
  }
  const cond = condRoutes[n.id];
  if (cond) html += "<div class='drow'>参与条件跳转</div>";
  detailBody.innerHTML = html;
  applyFocus();
}

/* ============ 画布平移 / 缩放 ============ */
(function(){
  let panning = false, sx = 0, sy = 0, ox = 0, oy = 0;
  stage.addEventListener("pointerdown", e => {
    /* 窗口/浮层/图标上不触发平移与清除选中（操作不穿透） */
    if (e.target.closest(".node") || e.target.closest(".syswin, #toast, #verdict, .desk-icon")) return;
    /* 点空白不再收浮窗（文本框用 × 关闭），只清除选中/聚焦 */
    clearSelection();
    panning = true; sx = e.clientX; sy = e.clientY; ox = view.x; oy = view.y;
    stage.classList.add("grabbing");
  });
  stage.addEventListener("pointermove", e => {
    if (!panning) return;
    view.x = ox + (e.clientX - sx); view.y = oy + (e.clientY - sy); applyView();
  });
  window.addEventListener("pointerup", () => { panning = false; stage.classList.remove("grabbing"); });
  stage.addEventListener("wheel", e => {
    /* 光标在窗口/浮层上时滚轮交给窗口自己的滚动条，不触发画布缩放 */
    const t = e.target;
    if (t && t.closest && t.closest(".syswin, #toast, #verdict")) return;
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const k2 = Math.max(.35, Math.min(1.8, view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    view.x = mx - (mx - view.x) * (k2 / view.k);
    view.y = my - (my - view.y) * (k2 / view.k);
    view.k = k2; applyView();
  }, { passive: false });
})();

function fit(){
  const keys = Object.keys(G.nodes).filter(k => !G.nodes[k].hidden && !G.nodes[k].stored);
  if (!keys.length) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  keys.forEach(k => {
    const n = G.nodes[k];
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x + NODE_W[n.kind]); y1 = Math.max(y1, n.y + NODE_H[n.kind]);
  });
  const r = stage.getBoundingClientRect();
  const pad = 60;
  const k = Math.max(.35, Math.min(1.3, Math.min((r.width - pad * 2) / (x1 - x0), (r.height - pad * 2) / (y1 - y0))));
  view.k = k;
  view.x = (r.width - (x1 - x0) * k) / 2 - x0 * k;
  view.y = (r.height - (y1 - y0) * k) / 2 - y0 * k;
  applyView();
}

function openApp(app){

  else if (app === "goto") toggleGotoWin();

function selectIcon(el){
  document.querySelectorAll(".desk-icon.sel").forEach(x => x.classList.remove("sel"));
  el.classList.add("sel");
}
function attachIcon(el, app){
  app = app || el.dataset.app;
  let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(el.style.left) || 0; oy = parseFloat(el.style.top) || 0;
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    e.stopPropagation();
  });
  el.addEventListener("pointermove", e => {
    if (!dragging) return;
    if (!moved && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) < 5) return;
    moved = true;
    const r = stage.getBoundingClientRect();
    el.style.left = Math.max(0, Math.min((r.width || 1200) - 64, ox + e.clientX - sx)) + "px";
    el.style.top  = Math.max(0, Math.min((r.height || 800) - 64, oy + e.clientY - sy)) + "px";
  });
  el.addEventListener("pointerup", e => {
    if (!dragging) return;
    dragging = false;
    if (!moved) selectIcon(el);
  });
  el.addEventListener("dblclick", () => openApp(app));
}

  if (!introState) return;

function answerQuestion(i){
  if (!introState || typeof introState.step !== "number") return;
  const q = QUIZ[introState.step];
  const opt = q && q.opts[i];
  if (!opt) return;
  introState.answers.push(opt[0]);
  if (introState.step < QUIZ.length - 1){ introState.step++; renderIntro(); }
  else finishQuiz();
}
function finishQuiz(){
  const counts = {};
  let best = null, bestN = 0;
  introState.answers.forEach(s => {   /* 平局取先达到的（按答题顺序） */
    counts[s] = (counts[s] || 0) + 1;
    if (counts[s] > bestN){ bestN = counts[s]; best = s; }
  });
  introState.card = { name: introState.name, id: genInvId(), sense: best,
    date: new Date().toISOString().slice(0, 10) };
  introState.step = "card";
  const t = introWinEl.querySelector(".syswin-title");
  if (t) t.textContent = "INVESTIGATOR // 调查员证";

/* 由编号确定性生成的 5×5 镜像像素识别图（div 网格，不用 canvas；cell 为每格边长 px） */
function genAvatar(id, cell){
  const px = cell || 18;
  let h = 0;
  const s = String(id || "");
  for (let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  const grid = [];
  for (let y = 0; y < 5; y++){
    for (let x = 0; x < 3; x++){
      h = (h * 1103515245 + 12345) >>> 0;
      grid[y * 5 + x] = grid[y * 5 + (4 - x)] = (h >>> 16) & 1;
    }
  }
  const box = document.createElement("div");
  box.className = "cert-photo";
  box.style.gridTemplateColumns = "repeat(5, " + px + "px)";
  box.style.gridTemplateRows = "repeat(5, " + px + "px)";
  grid.forEach(on => {
    const d = document.createElement("div");
    d.className = "px" + (on ? " on" : "");
    d.style.width = px + "px"; d.style.height = px + "px";
    box.appendChild(d);
  });
  return box;
}

  const actions = document.createElement("div");
  actions.className = "cert-actions";
  actions.appendChild(btn);
  w.body.appendChild(actions);
  stage.appendChild(w.el);
  makeFloatDraggable(w.el, false);
  invReviewEl = w.el;
}

/* ============ 启动 ============ */
function boot(){
  G = blankGraph();
  closePwPop();
  closeBubble();
  closeNarr();
  closeTecWin();
  closeBagWin();
  closeGotoWin();
  closeInferWin();
  view = { x: 40, y: 20, k: 1 };
  applyView();
  logBox.innerHTML = "";
  setDetailWin(false);
  detailBody.innerHTML = "<div class='empty'>点选任意节点查看信息。</div>";
  const sn = ensureNode("loc", START, { label: SCENES[START].title || START, x: 1000, y: 620 });
  revealScene(START, true);
  layout();
  render();
  fit();
  mountInvChip();
  if (investigator) showNarrCard(sn, SCENES[START]);
  else openIntro();
  log("已载入案件 A-001：双击 <b>场景节点</b> 展开里面的东西，把节点 <b>拖到另一个节点上</b> 组合使用。", "sys");
  log("提示：起始场景就是「植物学家的花园」。双击「书桌」等场景节点继续展开，拖动手电筒到黑影上试试。", "sys");
}

/* 测试钩子（供 verify.js 无头驱动） */
window.__combo = (a, b) => attemptCombo(a, b);
window.__talk = key => { const n = G.nodes[key]; if (n) runPrimary(n); };
window.__tec = key => tecConsult(key);
window.__tecTalk = () => tecTalk();
window.__collapse = sid => toggleCollapse(sid);
window.__store = (key, sid) => storeNode(key, sid);
window.__storeAll = sid => storeAll(sid);
window.__bag = key => bagStore(key);
window.__bagTake = key => bagTake(key);
window.__bagToggle = () => toggleBagWin();
window.__cap = key => attemptCapture(key);
window.__noteSeen = t => noteSeen(t);
window.__goto = sid => gotoScene(sid);
window.__gotoList = () => heardScenes();
window.__mxAssign = (k, s) => assignClue(k, s);
window.__infer = () => executeInference();
window.__playStep = () => { if (memoryPlay) playMemoryLine(); else if (endingState) playEndingStage(); };
window.__intro = {
  step: () => introState && introState.step,
  name: v => setIntroName(v),
  begin: () => beginQuiz(),
  answer: i => answerQuestion(i),
  confirm: () => confirmCard(),
  finish: () => finishIntro()
};
window.__select = key => key ? selectNode(key) : clearSelection();
window.__closeFloats = () => { closeBubble(); closeNarr(); closePwPop(); };
window.__renarr = sid => renarrScene(sid);
window.__hit   = (cx, cy) => { const e = hitTest(cx, cy, null); return e ? e.dataset.key : null; };
window.__dump  = () => ({
  nodes: Object.keys(G.nodes),
  lit: Object.keys(G.nodes).filter(k => G.nodes[k].lit),
  talk: Object.assign({}, G.talkProg),
  tec: { prog: Object.assign({}, G.tecProg), lastScene: G.lastScene },
  hidden: Object.keys(G.nodes).filter(k => G.nodes[k].hidden),
  stored: Object.keys(G.nodes).filter(k => G.nodes[k].stored),
  bag: bagItems().map(n => n.key),
  collapsed: [...G.collapsed],
  dim: G._dimKeys || [],
  sel: sel,
  floats: { bubble: !!bubbleEl, narr: !!narrEl, pw: !!pwPop, bag: !!bagWinEl, goto: !!gotoWinEl, matrix: !!inferWinEl, tec: !!tecWinEl, detail: detailWinOpen, logs: logWinOpen },
  matrix: JSON.parse(JSON.stringify(G.matrix)),
  endings: [...G.endings],
  endingOverlay: !!endingState,
  investigator: investigator ? { name: investigator.name, id: investigator.id, sense: investigator.sense } : null,
  intro: !!introWinEl,
  edges: G.edges.map(e => e.kind + ":" + e.a + ">" + e.b),
  explored: [...G.explored], captured: [...G.captured], tried: [...G.tried],
  history: history.length,
  pos: (() => { const o = {}; for (const k in G.nodes){
    o[k] = { x: Math.round(G.nodes[k].x), y: Math.round(G.nodes[k].y), pinned: !!G.nodes[k].pinned }; } return o; })()
});

boot();
</script>
