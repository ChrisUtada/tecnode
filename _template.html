document.getElementById("btn-fit").addEventListener("click", fit);
document.getElementById("ending-overlay").addEventListener("click", () => {
  if (!endingState) return;
  const cur = endingState.stages[endingState.step - 1];
  if (cur && cur.final){ closeEnding(); return; }
  clearTimeout(endingState.timer);
  playEndingStage();
});
tgFocus.addEventListener("change", applyFocus);
document.getElementById("btn-relayout").addEventListener("click", () => {
  Object.values(G.nodes).forEach(n => { n.pinned = false; });
  layout(); render();
  log("已重新自动布局（手动摆过的位置被清除）", "sys");
});
document.getElementById("btn-undo").addEventListener("click", () => {
  if (!history.length){ log("没有可撤销的操作", "warn"); return; }
  restore(history.pop());
  layout(); render();
  log("已撤销上一步", "sys");
});
document.getElementById("btn-reset").addEventListener("click", () => {
  history = []; boot();
  log("已重置为初始状态", "sys");
});
document.getElementById("btn-reach").addEventListener("click", () => {
  const total = Object.keys(SCENES).length;
  const adj = {};
  Object.keys(SCENES).forEach(s => sceneLocs(s).forEach(t => (adj[s] = adj[s] || []).push(t)));
  const seen = new Set([START]), q = [START];
  while (q.length){ const c = q.shift(); (adj[c] || []).forEach(n => { if (!seen.has(n)){ seen.add(n); q.push(n); } }); }
  const extra = new Set(Object.keys(condRoutes));
  const bad = Object.keys(SCENES).filter(s => !seen.has(s) && !extra.has(s));

  let html = "<span class='close' onclick=\"document.getElementById('verdict').style.display='none'\">×</span>";
  html += "<h4>可达性检查 · " + total + " 个场景</h4>";
  html += "<div class='vrow'><span class='dot' style='background:#2b2b26'></span><div>沿文本链接可达 <b>" + seen.size + "</b> 个</div></div>";
  html += "<div class='vrow'><span class='dot' style='background:#5c584a'></span><div>需条件触发才能进 <b>" + extra.size + "</b> 个</div></div>";
  html += "<div class='vrow'><span class='dot' style='background:#8a8672'></span><div>只能靠「前往」命令进 <b>" + bad.length + "</b> 个</div></div>";
  if (bad.length){
    html += "<div style='margin-top:8px;padding-top:8px;border-top:1px solid #e8eaed'>";
    bad.forEach(s => { html += "<div style='margin:2px 0'>· " + esc(SCENES[s].title) + " <code>" + s + "</code></div>"; });
    html += "</div>";
  }
  verdict.innerHTML = html;
  verdict.style.display = "block";
  log("可达性：文本可达 " + seen.size + " / 条件 " + extra.size + " / 孤岛 " + bad.length +
      (bad.length ? " → " + bad.map(s => SCENES[s].title).join("、") : ""), bad.length ? "err" : "sys");
});

/* ============ 适性测试 + 调查员证（开场流程） ============ */
const store = (typeof localStorage !== "undefined") ? localStorage : null;
let investigator = null;
try { if (store){ const raw = store.getItem("tec_investigator"); if (raw) investigator = JSON.parse(raw); } } catch(_){}

const SENSE_FLAVOR = {
  vision:  "你习惯先看清，再行动。",
  hearing: "世界的背面，总有声音先抵达你。",
  touch:   "你相信手的判断，胜过眼睛。",
  smell:   "气味是不会说谎的证人。",
  taste:   "真相的味道，你尝一口就知道。"
};
const QUIZ = [
  { q: "进入一片漆黑的异动区域，你首先依靠什么？", opts: [
    ["vision","眯起眼睛寻找微光"],["hearing","屏息聆听最细微的声响"],["touch","伸出手触摸前方的空气"],
    ["smell","分辨空气中气味的变化"],["taste","舌尖抵住上颚，尝一尝空气的味道"] ]},
  { q: "一份被水浸透的档案，你最先注意到什么？", opts: [
    ["vision","字迹晕染开的形状"],["hearing","纸页翻动时的脆响"],["touch","纸张潮湿的重量"],
    ["smell","霉菌与墨水的气味"],["taste","墨水淡淡的苦涩（别想歪，是用鼻子旁边的那点想象力）"] ]},
  { q: "以下哪种异常最让你不安？", opts: [
    ["vision","镜子里慢半拍的自己"],["hearing","反复倒放的人声"],["touch","没有来源的冰冷触碰"],
    ["smell","凭空出现的花香"],["taste","嘴里突然泛起的铁锈味"] ]}
];
function genInvId(){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let a = "", n = "";
  for (let i = 0; i < 2; i++) a += chars[Math.floor(Math.random() * chars.length)];
  for (let i = 0; i < 4; i++) n += Math.floor(Math.random() * 10);
  return "TEC-" + a + "-" + n;
}

let introWinEl = null, introState = null, introBackdropEl = null;
function closeIntroLight(){
  if (introWinEl){ introWinEl.remove(); introWinEl = null; }
  if (introBackdropEl){ introBackdropEl.remove(); introBackdropEl = null; }
  introState = null;
}
function openIntro(){
  closeIntroLight();
  const bd = document.createElement("div");
  bd.id = "intro-backdrop";
  (document.body || stage).appendChild(bd);
  introBackdropEl = bd;
  const w = makeWindow("APTITUDE // 调查员适性测试", () => {});
  w.el.classList.add("intro-win");
  const x = w.bar.querySelector(".syswin-x");
  if (x) x.style.display = "none";   /* 开场测试必须完成，不允许关闭 */
  bd.appendChild(w.el);
  introWinEl = w.el;
  introState = { step: "name", name: "", nameInput: null, answers: [], card: null };
  renderIntro();
}
function renderIntro(){
  if (!introWinEl || !introState) return;
  const body = introWinEl.querySelector(".syswin-body");
  if (!body) return;
  body.innerHTML = "";
  const st = introState;
  if (st.step === "name"){
    const p = document.createElement("div");
    p.textContent = "在接入异动区域之前，T.E.C-OS 需要登记你的信息，并完成一次简短的适性测试。";
    body.appendChild(p);
    const input = document.createElement("input");
    input.className = "intro-name";
    input.placeholder = "请输入姓名";
    input.maxLength = 12;
    input.value = st.name || "";
    input.addEventListener("input", e => { st.name = e.target.value; });
    body.appendChild(input);
    st.nameInput = input;
    const btn = document.createElement("button");
    btn.className = "primary";
    btn.textContent = "[ 开始测试 ]";
    btn.addEventListener("click", beginQuiz);
    body.appendChild(btn);
    return;
  }
  if (st.step === "card"){
    body.appendChild(buildCert(st.card));
    const btn = document.createElement("button");
    btn.className = "primary mx-sync";
    btn.textContent = "[ 确认领证 ]";
    btn.addEventListener("click", confirmCard);
    body.appendChild(btn);
    return;
  }
  const qi = st.step, q = QUIZ[qi];
  const prog = document.createElement("div");
  prog.className = "quiz-prog";
  prog.textContent = "第 " + (qi + 1) + " / " + QUIZ.length + " 问";
  body.appendChild(prog);
  const qt = document.createElement("div");
  qt.className = "quiz-q";
  qt.textContent = q.q;
  body.appendChild(qt);
  q.opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "quiz-opt";
    b.textContent = o[1];
    b.addEventListener("click", () => answerQuestion(i));
    body.appendChild(b);
  });
}
function setIntroName(v){
  if (!introState) return;
  introState.name = v;
  if (introState.nameInput) introState.nameInput.value = v;
}
function beginQuiz(){
  if (!introState) return;
  const v = String((introState.nameInput && introState.nameInput.value) || introState.name || "").trim();
  if (!v){
    if (introWinEl){ introWinEl.classList.remove("shake"); void introWinEl.offsetWidth; introWinEl.classList.add("shake"); }
    return;
  }
  introState.name = v;
  introState.step = 0;
  renderIntro();
}
function answerQuestion(i){
  if (!introState || typeof introState.step !== "number") return;
  const q = QUIZ[introState.step];
  const opt = q && q.opts[i];
  if (!opt) return;
  introState.answers.push(opt[0]);
  if (introState.step < QUIZ.length - 1){ introState.step++; renderIntro(); }
  else finishQuiz();
}
function finishQuiz(){
  const counts = {};
  let best = null, bestN = 0;
  introState.answers.forEach(s => {   /* 平局取先达到的（按答题顺序） */
    counts[s] = (counts[s] || 0) + 1;
    if (counts[s] > bestN){ bestN = counts[s]; best = s; }
  });
  introState.card = { name: introState.name, id: genInvId(), sense: best,
    date: new Date().toISOString().slice(0, 10) };
  introState.step = "card";
  const t = introWinEl.querySelector(".syswin-title");
  if (t) t.textContent = "INVESTIGATOR // 调查员证";
  renderIntro();
}
function confirmCard(){
  if (!introState || !introState.card) return;
  investigator = introState.card;
  try { if (store) store.setItem("tec_investigator", JSON.stringify(investigator)); } catch(_){}
  if (introWinEl) introWinEl.classList.add("shrink");
  setTimeout(finishIntro, 420);   /* stub 的 setTimeout 是 noop：测试用 __intro.finish() 收尾 */
}
function finishIntro(){
  if (!introState) return;
  closeIntroLight();
  mountInvChip();
  const sn = G.nodes["loc:" + START];
  if (sn) showNarrCard(sn, SCENES[START]);
  log("调查员 <b>" + esc(investigator.name) + "</b>（" + esc(investigator.id) + "）已接入 T.E.C-OS", "sys");
}

/* 由编号确定性生成的 5×5 镜像像素识别图（div 网格，不用 canvas；cell 为每格边长 px） */
function genAvatar(id, cell){
  const px = cell || 18;
  let h = 0;
  const s = String(id || "");
  for (let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  const grid = [];
  for (let y = 0; y < 5; y++){
    for (let x = 0; x < 3; x++){
      h = (h * 1103515245 + 12345) >>> 0;
      grid[y * 5 + x] = grid[y * 5 + (4 - x)] = (h >>> 16) & 1;
    }
  }
  const box = document.createElement("div");
  box.className = "cert-photo";
  box.style.gridTemplateColumns = "repeat(5, " + px + "px)";
  box.style.gridTemplateRows = "repeat(5, " + px + "px)";
  grid.forEach(on => {
    const d = document.createElement("div");
    d.className = "px" + (on ? " on" : "");
    d.style.width = px + "px"; d.style.height = px + "px";
    box.appendChild(d);
  });
  return box;
}

/* 调查员证（发证 / 回看共用）：头部色带 + 身份区（头像+字段）+ 倾向区 + 签发区 */
function buildCert(c){
  const wrap = document.createElement("div");
  wrap.className = "inv-cert";
  const head = document.createElement("div");
  head.className = "cert-head"; head.textContent = "T.E.C-OS 调查员证";
  wrap.appendChild(head);

  const sec1 = document.createElement("div");
  sec1.className = "cert-sec cert-id";
  sec1.appendChild(genAvatar(c.id, 20));
  const fields = document.createElement("div");
  fields.className = "cert-fields";
  const nm = document.createElement("div"); nm.className = "cert-name"; nm.textContent = c.name;
  const idn = document.createElement("div"); idn.className = "cert-idno"; idn.textContent = c.id;
  const lv = document.createElement("div"); lv.className = "cert-frow"; lv.textContent = "等级：初级调查员";
  fields.appendChild(nm); fields.appendChild(idn); fields.appendChild(lv);
  sec1.appendChild(fields);
  wrap.appendChild(sec1);

  const sec2 = document.createElement("div");
  sec2.className = "cert-sec dashed";
  const sn = document.createElement("div"); sn.className = "cert-sense";
  sn.textContent = (SENSES[c.sense] || c.sense) + "主导型";
  const fl = document.createElement("div"); fl.className = "cert-flavor";
  fl.textContent = SENSE_FLAVOR[c.sense] || "";
  sec2.appendChild(sn); sec2.appendChild(fl);
  wrap.appendChild(sec2);

  const sec3 = document.createElement("div");
  sec3.className = "cert-sec dashed cert-issue";
  const dt = document.createElement("div"); dt.textContent = "签发日期：" + c.date;
  const stamp = document.createElement("div"); stamp.className = "cert-stamp";
  stamp.innerHTML = "T.E.C<br>核准";
  sec3.appendChild(dt); sec3.appendChild(stamp);
  wrap.appendChild(sec3);
  return wrap;
}

/* 顶栏徽标 + 证件回看 */
let invChipEl = null, invReviewEl = null;
function mountInvChip(){
  if (!investigator) return;
  if (!invChipEl){
    invChipEl = document.createElement("span");
    invChipEl.id = "inv-chip";
    invChipEl.addEventListener("click", openCardReview);
    const brand = document.querySelector(".brand");
    if (brand && brand.parentNode && brand.parentNode.insertBefore) brand.parentNode.insertBefore(invChipEl, brand.nextSibling);
    else stage.appendChild(invChipEl);
  }
  invChipEl.textContent = "▣ " + investigator.name + " · " + investigator.id;
}
function closeInvReview(){ if (invReviewEl){ invReviewEl.remove(); invReviewEl = null; } }
function openCardReview(){
  if (!investigator) return;
  closeInvReview();
  const w = makeWindow("INVESTIGATOR // 调查员证", closeInvReview);
  w.el.classList.add("cert-win");
  w.body.appendChild(buildCert(investigator));
  const btn = document.createElement("button");
  btn.textContent = "[ 重新测试 ]";
  btn.addEventListener("click", () => {
    try { if (store) store.removeItem("tec_investigator"); } catch(_){}
    investigator = null;
    if (invChipEl){ invChipEl.remove(); invChipEl = null; }
    closeInvReview();
    openIntro();
  });
  const actions = document.createElement("div");
  actions.className = "cert-actions";
  actions.appendChild(btn);
  w.body.appendChild(actions);
  stage.appendChild(w.el);
  makeFloatDraggable(w.el, false);
  invReviewEl = w.el;
}

/* ============ 启动 ============ */
function boot(){
  G = blankGraph();
  closePwPop();
  closeBubble();
  closeNarr();
  closeTecWin();
  closeBagWin();
  closeGotoWin();
  closeInferWin();
  view = { x: 40, y: 20, k: 1 };
  applyView();
  logBox.innerHTML = "";
  setDetailWin(false);
  detailBody.innerHTML = "<div class='empty'>点选任意节点查看信息。</div>";
  const sn = ensureNode("loc", START, { label: SCENES[START].title || START, x: 1000, y: 620 });
  revealScene(START, true);
  layout();
  render();
  fit();
  mountInvChip();
  if (investigator) showNarrCard(sn, SCENES[START]);
  else openIntro();
  log("已载入案件 A-001：双击 <b>场景节点</b> 展开里面的东西，把节点 <b>拖到另一个节点上</b> 组合使用。", "sys");
  log("提示：起始场景就是「植物学家的花园」。双击「书桌」等场景节点继续展开，拖动手电筒到黑影上试试。", "sys");
}

/* 测试钩子（供 verify.js 无头驱动） */
window.__combo = (a, b) => attemptCombo(a, b);
window.__talk = key => { const n = G.nodes[key]; if (n) runPrimary(n); };
window.__tec = key => tecConsult(key);
window.__tecTalk = () => tecTalk();
window.__collapse = sid => toggleCollapse(sid);
window.__store = (key, sid) => storeNode(key, sid);
window.__storeAll = sid => storeAll(sid);
window.__bag = key => bagStore(key);
window.__bagTake = key => bagTake(key);
window.__bagToggle = () => toggleBagWin();
window.__cap = key => attemptCapture(key);
window.__noteSeen = t => noteSeen(t);
window.__goto = sid => gotoScene(sid);
window.__gotoList = () => heardScenes();
window.__mxAssign = (k, s) => assignClue(k, s);
window.__infer = () => executeInference();
window.__playStep = () => { if (memoryPlay) playMemoryLine(); else if (endingState) playEndingStage(); };
window.__intro = {
  step: () => introState && introState.step,
  name: v => setIntroName(v),
  begin: () => beginQuiz(),
  answer: i => answerQuestion(i),
  confirm: () => confirmCard(),
  finish: () => finishIntro()
};
window.__select = key => key ? selectNode(key) : clearSelection();
window.__closeFloats = () => { closeBubble(); closeNarr(); closePwPop(); };
window.__renarr = sid => renarrScene(sid);
window.__hit   = (cx, cy) => { const e = hitTest(cx, cy, null); return e ? e.dataset.key : null; };
window.__dump  = () => ({
  nodes: Object.keys(G.nodes),
  lit: Object.keys(G.nodes).filter(k => G.nodes[k].lit),
  talk: Object.assign({}, G.talkProg),
  tec: { prog: Object.assign({}, G.tecProg), lastScene: G.lastScene },
  hidden: Object.keys(G.nodes).filter(k => G.nodes[k].hidden),
  stored: Object.keys(G.nodes).filter(k => G.nodes[k].stored),
  bag: bagItems().map(n => n.key),
  collapsed: [...G.collapsed],
  dim: G._dimKeys || [],
  sel: sel,
  floats: { bubble: !!bubbleEl, narr: !!narrEl, pw: !!pwPop, bag: !!bagWinEl, goto: !!gotoWinEl, matrix: !!inferWinEl, tec: !!tecWinEl, detail: detailWinOpen, logs: logWinOpen },
  matrix: JSON.parse(JSON.stringify(G.matrix)),
  endings: [...G.endings],
  endingOverlay: !!endingState,
  investigator: investigator ? { name: investigator.name, id: investigator.id, sense: investigator.sense } : null,
  intro: !!introWinEl,
  edges: G.edges.map(e => e.kind + ":" + e.a + ">" + e.b),
  explored: [...G.explored], captured: [...G.captured], tried: [...G.tried],
  history: history.length,
  pos: (() => { const o = {}; for (const k in G.nodes){
    o[k] = { x: Math.round(G.nodes[k].x), y: Math.round(G.nodes[k].y), pinned: !!G.nodes[k].pinned }; } return o; })()
});

boot();
