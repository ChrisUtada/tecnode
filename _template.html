/* ============ 布局：力导向（拖拽不改变位置） ============ */
let layoutTimer = null, edgeTimer = null;
function layout(){
  const list = Object.values(G.nodes).filter(n => !n.hidden && !n.stored);
  if (!list.length) return;
  const W = 2000, H = 1300;

  const seed = n => {
    if (n.x != null) return;
    if (isContainerNode(n)){                       /* 容器（场景 + 书桌这类物品）按网格落位 */
      const i = Object.keys(G.nodes).filter(k => isContainerNode(G.nodes[k])).indexOf(n.key);
      n.x = 200 + (i % 5) * 380;
      n.y = 160 + Math.floor(i / 5) * 300;
    } else {
      n.x = 700 + (Math.random() - .5) * 420;
      n.y = 560 + (Math.random() - .5) * 420;
    }
  };
  list.forEach(seed);

  const R = n => isContainerNode(n) ? 80 : 68;
  const free = n => !n.pinned;
  for (let it = 0; it < 260; it++){
    for (let i = 0; i < list.length; i++){
      const a = list[i];
      for (let j = i + 1; j < list.length; j++){
        const b = list[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1){ dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
        const d = Math.sqrt(d2), ux = dx / d, uy = dy / d;
        const rep = 30000 / d2;
        if (free(a)){ a.x -= ux * rep; a.y -= uy * rep; }
        if (free(b)){ b.x += ux * rep; b.y += uy * rep; }
        const min = R(a) + R(b) + 14;
        if (d < min){
          const push = (min - d) / 2;
          if (free(a)){ a.x -= ux * push; a.y -= uy * push; }
          if (free(b)){ b.x += ux * push; b.y += uy * push; }
        }
      }
    }
    G.edges.forEach(e => {
      const a = G.nodes[e.a], b = G.nodes[e.b];
      if (!a || !b) return;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
      const rest = e.kind === "entity" ? 185 : e.kind === "move" ? 300 : 150;
      const f = (d - rest) * 0.014;
      if (free(a)){ a.x += ux * f; a.y += uy * f; }
      if (free(b)){ b.x -= ux * f; b.y -= uy * f; }
    });
    list.forEach(n => { if (free(n)){ n.x += (W / 2 - n.x) * 0.0022; n.y += (H / 2 - n.y) * 0.0022; } });
  }
  list.forEach(n => {
    if (n.pinned) return;                  /* 右键钉住的节点不再动 */
    n.x = Math.max(60, Math.min(W - 220, n.x));
    n.y = Math.max(50, Math.min(H - 120, n.y));
  });
}

/* ============ 渲染 ============ */
const NODE_W = { loc:152, item:130, char:130, clue:130 };
const NODE_H = { loc:54, item:46, char:46, clue:46 };

/* ============ 拖动收尾登记表 ============
   任何「拖到一半可能被 render() 打断」的手势都在这里登记一个 abort 回调。
   为什么必须收尾：render() 会 nodeLayer.innerHTML = "" 重建**全部**节点 DOM。被拖的那个元素
   一旦离树，指针捕获被隐式释放，pointerup / pointercancel 就再也不会派发过来 —— 收尾逻辑跑不到，
   镜像就永久留在 #drag-layer（画布上多出一个点不动也拖不动的节点），同时这次拖放的落点动作丢失。
   真实触发路径：TEC 分析是 setTimeout（11-dialog.js），玩家一边拖节点一边等分析，
   分析完成且**本次真产出新线索**时 settle() → render() —— 正是「拖着拖着线索掉下来」那一刻。
   在重建之前统一收尾：把位移写回 n.x/n.y、摘掉镜像与幽灵线、清掉落点高亮。 */
const dragAborters = new Set();
function abortActiveDrags(){
  if (!dragAborters.size) return;
  Array.from(dragAborters).forEach(fn => { try { fn(); } catch(_){} });
  dragAborters.clear();
}
function registerDrag(fn){ dragAborters.add(fn); return fn; }
function unregisterDrag(fn){ dragAborters.delete(fn); }
/* 兜底：重建时清空镜像层。走到这里时各手势自己的 abort 已经摘掉各自那一片，
   这句只为「万一还有没登记的镜像」收尾，保证 #drag-layer 绝不带着旧镜像跨过一次重建。 */
function clearDragLayer(){
  const l = document.getElementById("drag-layer");
  if (l) l.innerHTML = "";
}

function render(){
  abortActiveDrags();     /* 先给拖动中的手势收尾，再动 DOM（见上） */
  clearDragLayer();
  nodeLayer.innerHTML = "";
  svg.innerHTML = "";

  Object.values(G.nodes).forEach(n => {
    if (n.hidden || n.stored){ n.el = null; return; }
    const el = document.createElement("div");
    /* 画布上的长相只看 kind：场景是宽节点（■），书桌 / 垃圾桶是普通物品节点（□）。
       「能不能展开」是容器的事 —— 由 unexplored / collapsed 两个类表达，与 kind 无关。 */
    const kindCls = n.kind === "loc" ? "scene-node" : "ent-node ent-" + n.kind;
    let cls = "node " + kindCls;
    if (isContainerNode(n) && !G.explored.has(n.id)) cls += " unexplored";
    if (isContainerNode(n) && G.collapsed.has(n.id)) cls += " collapsed";
    if (n.kind === "loc" && isHub(n.id)) cls += " hub";
    if (n.kind === "clue" && G.captured.has(n.id)) cls += " got";
    if (n.fresh) cls += " pop";
    if (n.lit) cls += " lit";
    el.className = cls;
    if (!isFinite(n.x)) n.x = 200 + Math.random() * 1600;
    if (!isFinite(n.y)) n.y = 120 + Math.random() * 1000;
    el.style.left = n.x + "px";
    el.style.top  = n.y + "px";
    el.dataset.key = n.key;

    let sub = isContainerNode(n) ? (G.collapsed.has(n.id) ? "已折叠 · 双击展开" : (G.explored.has(n.id) ? "已探索" : "未探索 · 双击展开")) : kindName(n.kind);
    if (n.kind === "clue" && G.captured.has(n.id)) sub = "线索 · 已捕获";
    el.innerHTML = "<div class='n-title'>" + esc(n.label) + "</div><div class='n-sub'>" + esc(sub) + "</div>";

    /* 「条件进入」角标已撤（2026-10-14，用户要求）。它是一枚**实心**药丸，和「新 / 对话 N」
       挤在右上角同一排；而它想说的那件事别处已经说过两遍 —— 详情窗有「参与条件跳转」行，
       可达性统计里有「需条件触发才能进 N 个」。节点上只该留「真的没路走」这一种警告。
       注意 `!condRoutes[n.id]`：条件场景**本来就不该**掉进下面这条（旧代码靠 else-if 达到同一效果），
       否则撤掉一枚角标的当天就会在同一个位置冒出另一枚，玩家只会以为"角标换了个字"。
       condRoutes 本身保留 —— 上面说的那两处还在用它。 */
    if (n.kind === "loc" && !G.explored.has(n.id) && inbound[n.id] === 0 &&
        !condRoutes[n.id] && !sceneLocs(n.id).length){
      const b = document.createElement("span"); b.className = "badge warn"; b.textContent = "无文本入口"; el.appendChild(b);
    }
    /* 已固定：右键钉住的节点。必须看得见——它同时意味着「自动布局不挪它」
       与「折叠不收它」，不标出来玩家只会看到"有的收有的不收"而判定成 bug */
    if (n.pinned){
      const b = document.createElement("span"); b.className = "badge pin"; b.textContent = "已固定"; el.appendChild(b);
    }
    /* 「新」角标认 n.unread（不是 n.fresh）：unread 一直挂着，**只有玩家点过这个节点才会被
       clearFresh() 摘掉**。旧版拿 n.fresh 当条件，而 fresh 是「本轮镜头聚焦」的一次性标记 ——
       render() 末尾就会擦掉它，于是任何一次重绘（右键钉住 / 自动布局 / 撤销 / 折叠…）
       都会把全场「新」角标一起洗掉，看着就像"钉一下所有新都没了"。 */
    if (n.unread){
      const b = document.createElement("span"); b.className = "badge new"; b.textContent = "新"; el.appendChild(b);
    }
    /* 「对话 N」角标已撤（2026-10-15，用户要求节点上不显示条数）：能不能继续聊，
       详情窗状态行与名册行都有状态词，对话呈现统一走 TEC 式对话窗（11-dialog.js）。 */
    attachInteractions(el, n);
    nodeLayer.appendChild(el);
    n.el = el;
    n.fresh = false;   /* 只擦「聚焦用」的一次性标记；n.unread（角标）留着等玩家来点 */
  });

  paintEdgesFor(420);
  updateCrumbs();
  updateTecBadge();
  updateBagBadge();
  updateLedgerBadge();
  updateInferBadge();
  refreshClueWin();     /* 开着的索引窗跟着图刷新（关着时是空操作） */
  refreshPeopleWin();
  refreshInferWin();    /* 推演窗同理：阵列与执行者头顶的种子对话框都是状态驱动的，
                           撤销 / 续档把 G 滚回去之后，开着的窗不能留着旧 DOM */
  /* 重建 DOM 后恢复选中态并重挂聚焦淡化 */
  if (sel && G.nodes[sel] && G.nodes[sel].el) G.nodes[sel].el.classList.add("sel"); else sel = null;
  applyFocus();
  paintDetail();     /* 详情窗「状态」跟着图一起刷新（点亮 / 捕获 / 展开 / 对话进度都会变） */
}
function paintEdges(){
  svg.innerHTML = "";
  const focusSel = (tgFocus.checked && sel && G.nodes[sel]) ? sel : null;
  G.edges.forEach(e => {
    const a = G.nodes[e.a], b = G.nodes[e.b];
    if (!a || !b || !a.el || !b.el || a.hidden || b.hidden || a.stored || b.stored) return;
    const A = center(a.el), B = center(b.el);
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2 - Math.min(70, Math.abs(B.x - A.x) * 0.16);
    p.setAttribute("d", "M" + A.x + " " + A.y + " Q" + mx + " " + my + " " + B.x + " " + B.y);
    p.setAttribute("fill", "none");
    if (e.kind === "tried"){ p.setAttribute("stroke", "#b8b49e"); p.setAttribute("stroke-width", 1);
      p.setAttribute("stroke-dasharray", "3 4"); p.setAttribute("opacity", .55); }
    else if (e.kind === "move"){ p.setAttribute("stroke", "#2b2b26"); p.setAttribute("stroke-width", 1.6); }
    else if (e.kind === "cond"){ p.setAttribute("stroke", "#2b2b26"); p.setAttribute("stroke-width", 1.6);
      p.setAttribute("stroke-dasharray", "5 4"); }
    else { p.setAttribute("stroke", "#8a8672"); p.setAttribute("stroke-width", 1.3); }
    if (focusSel && e.a !== focusSel && e.b !== focusSel) p.setAttribute("opacity", .12);
    svg.appendChild(p);
  });
  paintGlow();
}
/* 让连线在一段动画期间持续跟随节点：节点回弹 / 自动布局时 left/top 有 .34s 过渡，
   只画一次会在动画期间"脱线"。这里按帧重画，center() 读的是动画中的当前值。 */
function paintEdgesFor(ms){
  paintEdges();
  clearInterval(edgeTimer);
  const t0 = Date.now();
  edgeTimer = setInterval(() => { paintEdges(); if (Date.now() - t0 > ms) clearInterval(edgeTimer); }, 40);
}
/* 弹回原位：用 JS 每帧同时推进「节点位置 + 连线」。
   不能只改 left/top 交给 CSS 过渡去跑——过渡期间节点在动、连线只在别处按 40ms 补画，
   两者必然错开（实测最多差 ~130px），视觉上就是"线断了"。这里在同一次回调里一起更新，永远同步。 */
function springBack(el, ox, oy){
  if (el.__springTimer){ clearTimeout(el.__springTimer); el.__springTimer = null; }
  const sx = parseFloat(el.style.left) || 0, sy = parseFloat(el.style.top) || 0;
  el.style.transition = "none";            /* 交给 JS 接管，别让 CSS 过渡掺一脚 */
  const now = () => (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
  const t0 = now(), DUR = 300, ease = p => 1 - Math.pow(1 - p, 3);
  const finish = () => {
    el.__springTimer = null;
    el.style.left = ox + "px"; el.style.top = oy + "px";
    el.style.transition = "";              /* 还原 CSS 过渡 */
    paintEdges();
  };
  const step = () => {
    const p = Math.min(1, (now() - t0) / DUR), e = ease(p);
    el.style.left = (sx + (ox - sx) * e) + "px";
    el.style.top  = (sy + (oy - sy) * e) + "px";
    paintEdges();
    if (p < 1){
      el.__springTimer = setTimeout(step, 16);
      if (!el.__springTimer) finish();     /* 无定时器环境（无头 stub）：同步收尾 */
    } else finish();
  };
  step();
}
function center(el){
  /* 优先读「当前渲染值」：节点 left/top 带 .34s 过渡，弹回时内联样式已经写成终点值，
     只有 getComputedStyle 才拿得到动画进行中的当前位置，否则连线会在回弹期间与节点脱开。 */
  let l = parseFloat(el.style.left), t = parseFloat(el.style.top);
  if (typeof getComputedStyle === "function"){
    const cs = getComputedStyle(el);
    const cl = parseFloat(cs.left), ct = parseFloat(cs.top);
    if (isFinite(cl)) l = cl;
    if (isFinite(ct)) t = ct;
  }
  return { x: (isFinite(l) ? l : 0) + el.offsetWidth / 2,
           y: (isFinite(t) ? t : 0) + el.offsetHeight / 2 };
}
function updateCrumbs(){
  const total = Object.keys(G.nodes).length;
  const visible = Object.values(G.nodes).filter(n => !n.hidden && !n.stored).length;
  crumbs.innerHTML = "节点 <b>" + visible + "/" + total + "</b> · 已探索场景 <b>" +
    G.explored.size + "/" + Object.keys(SCENES).length + "</b> · 已试组合 <b>" + G.tried.size +
    "</b> · 捕获线索 <b>" + G.captured.size + "</b> · 结局 <b>" + G.endings.size + "/" + ENDINGS.length + "</b>";
}

/* 顶层拖拽镜像：复制一份被拖节点放到 #drag-layer（z 高于窗口/图标），原节点暂时隐藏。
   否则往右下角拖（TEC 窗所在地）时，节点会被 #case-win 的层叠上下文压在窗口下层。 */
/* 定位改用「布局坐标(left/top)」而不是 transform:translate。
   原因：新插入的元素若用 transform 平移来定位，真实 GPU 合成器可能先提交一帧
   「还没加上平移、停在层原点 (0,0)＝桌面左上角」的画面，表现为拖动时左上角闪一下。
   布局坐标（left/top）在绘制前必定生效，不会出现这种半成品帧。
   缩放仍用 transform（transform-origin:0 0，只缩放不移位）。 */
function positionDragMirror(m, el){
  const r = el.getBoundingClientRect(), sr = desktopEl.getBoundingClientRect();
  const k = view.k || 1;
  m.style.left = (r.left - sr.left) + "px";
  m.style.top  = (r.top  - sr.top ) + "px";
  m.style.transform = "scale(" + k + ")";
}
function makeDragMirror(el){
  const layer = document.getElementById("drag-layer");
  if (!layer || !el.cloneNode) return null;
  const m = el.cloneNode(true);
  m.classList.add("drag-mirror");
  m.style.transformOrigin = "0 0";
  positionDragMirror(m, el);      /* 入 DOM 前就把 left/top/scale 写好，首帧即正确位置 */
  m.style.visibility = "hidden";
  layer.appendChild(m);
  el.style.visibility = "hidden";
  void m.offsetWidth;             /* 强制一次布局，确保显示时位置已落定 */
  m.style.visibility = "visible";
  return m;
}
function syncDragMirror(m, el){ if (m) positionDragMirror(m, el); }

/* ============ 节点交互 ============ */
function attachInteractions(el, n){
  let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0, ghost = null, overEl = null, mirror = null;

  /* 摘掉本次拖动留下的一切痕迹（镜像 / 幽灵线 / 各类落点高亮） */
  const teardownDrag = () => {
    if (mirror){ mirror.remove(); mirror = null; }
    el.classList.remove("dragging");
    el.style.visibility = "";
    if (ghost){ ghost.remove(); ghost = null; }
    if (overEl){ if (overEl.classList) overEl.classList.remove("over"); overEl = null; }
    nodeDropTargets().forEach(id => {
      const ic = dropTargetEl(id);
      if (ic && ic.classList) ic.classList.remove("over");
    });
    const mxBd = inferWinEl ? inferWinEl.querySelector(".mx-board") : null;
    if (mxBd && mxBd.classList) mxBd.classList.remove("over");
  };
  /* 被 render() 打断时的收尾：把当前位移写回 n.x/n.y（夹回界内），别让节点跳回拖动前的起点。
     只写位置、**不做落点判定** —— 此刻落点（组合对象 / 收纳窗）可能已经被重建，
     按旧引用判了也是错的；玩家的意图是「停在这里」，落点动作留给下一次拖动。 */
  const abortDrag = () => {
    if (!dragging) return;
    dragging = false;
    const x = parseFloat(el.style.left), y = parseFloat(el.style.top);
    teardownDrag();
    if (moved){
      n.x = Math.max(60, Math.min(2000 - 220, isFinite(x) ? x : n.x));
      n.y = Math.max(50, Math.min(1300 - 120, isFinite(y) ? y : n.y));
    }
  };

  el.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    cancelViewAnim();   /* 抓住节点即接管镜头：正在跑的自动聚焦立刻停住（"拖动即可打断"） */
    if (mirror){ mirror.remove(); mirror = null; }   /* 兜底：清掉可能残留的镜像 */
    if (el.__springTimer){ clearTimeout(el.__springTimer); el.__springTimer = null; el.style.transition = ""; }   /* 打断正在进行的弹回动画 */
    el.style.visibility = "";
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(el.style.left) || 0;
    oy = parseFloat(el.style.top)  || 0;
    registerDrag(abortDrag);   /* 拖到一半若被 render() 打断，由它收尾（见 07-render.js 的登记表） */
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    e.stopPropagation();
  });

  el.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    moved = true;
    el.classList.add("dragging");

    /* 节点跟手移动 */
    el.style.left = (ox + dx / view.k) + "px";
    el.style.top  = (oy + dy / view.k) + "px";

    /* 顶层镜像：让被拖的节点浮在窗口/图标之上 */
    if (!mirror) mirror = makeDragMirror(el);
    syncDragMirror(mirror, el);

    if (!ghost){
      ghost = document.createElementNS("http://www.w3.org/2000/svg", "path");
      ghost.setAttribute("stroke", "#2b2b26");
      ghost.setAttribute("stroke-width", 2);
      ghost.setAttribute("stroke-dasharray", "6 5");
      ghost.setAttribute("fill", "none");
      ghost.setAttribute("opacity", .85);
      svg.appendChild(ghost);
    }
    const A = center(el);
    const P = toWorld(e.clientX, e.clientY);
    ghost.setAttribute("d", "M" + A.x + " " + A.y + " L" + P.x + " " + P.y);
    paintEdges();

    /* 命中测试不用 elementFromPoint，免得被正在拖的节点自己挡住 */
    const hit = hitTest(e.clientX, e.clientY, el);
    if (hit !== overEl){
      if (overEl) overEl.classList.remove("over");
      overEl = hit;
      if (overEl) overEl.classList.add("over");
    }

    /* 桌面图标命中高亮（固定优先级 bag > tec > infer > goto） */
    nodeDropTargets().forEach(id => {
      const ic = dropTargetEl(id);
      if (!ic) return;
      const r = ic.getBoundingClientRect();
      ic.classList.toggle("over",
        e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom);
    });
    /* 阵列桌布命中高亮（窗口开着时整块桌布都是线索落点） */
    const mxBd = inferWinEl ? inferWinEl.querySelector(".mx-board") : null;
    if (mxBd){
      const r = mxBd.getBoundingClientRect();
      mxBd.classList.toggle("over", !!(n.kind === "clue" &&
        e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom));
    }
  });

  /* 拖动被系统中断（如指针被抢占）时也要收尾，否则镜像残留 / 节点被永久隐藏 */
  el.addEventListener("pointercancel", () => {
    if (!dragging) return;
    dragging = false;
    unregisterDrag(abortDrag);
    teardownDrag();
  });

  el.addEventListener("pointerup", e => {
    if (!dragging) return;
    dragging = false;
    unregisterDrag(abortDrag);
    const target = overEl;      /* teardownDrag 会清掉 overEl，先留住松手命中的那一个 */
    teardownDrag();

    /* 桌面图标命中判定（固定优先级 bag > clue > tec > infer > goto；任何路径清掉 over 高亮） */
    let iconHit = null;
    nodeDropTargets().forEach(id => {
      const ic = dropTargetEl(id);
      if (!ic) return;
      const r = ic.getBoundingClientRect();
      const inside = moved && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      if (inside && !iconHit) iconHit = id;
      ic.classList.remove("over");
    });

    if (!moved){ clearFresh(n); selectNode(n.key); return; }   /* 点一下 = 不再是「新」 */

    if (iconHit){
      /* 松手落在桌面图标上 → 对应功能，自己弹回原位 */
      springBack(el, ox, oy);
      if (iconHit === "bag-dock" || iconHit === "bag-win") bagStore(n.key);
      else if (iconHit === "clue-icon" || iconHit === "clue-win") ledgerStore(n.key);
      else if (iconHit === "tec-dock" || iconHit === "tec-avatar" || iconHit === "tec-chip") tecAnalyze(n.key);
      else if (iconHit === "infer-icon"){
        if (n.kind === "clue") assignClue(n.key, (CLUES[n.id] || {}).type);
        else toast("只有线索能进推演器", true);
      } else if (iconHit === "goto-icon"){
        if (n.kind === "loc") gotoScene(n.id);   /* 档案里列的是场景；容器物品（书桌）不在此列 */
        else toast("只有场景能进档案", true);
      }
      return;
    }

    /* 松手落在阵列桌布上 → 线索归位（归入它自己的感官），自己弹回原位 */
    const mxBdUp = inferWinEl ? inferWinEl.querySelector(".mx-board") : null;
    if (mxBdUp){
      mxBdUp.classList.remove("over");
      const r = mxBdUp.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom){
        springBack(el, ox, oy);
        if (n.kind === "clue") assignClue(n.key, (CLUES[n.id] || {}).type);
        else toast("只有线索能上桌布", true);
        return;
      }
    }

    if (target && target.dataset.key){
      /* 松手落在别的节点上 → 组合，自己被弹回原位 */
      const tn = G.nodes[target.dataset.key];
      springBack(el, ox, oy);
      /* 折叠的容器节点（场景 / 书桌 / 垃圾桶）：既不收纳也不组合。原来这里会把节点
         「放回现场」（storeNode），但那与证物袋 / 线索册重叠（还没有清单、只能整场展开才能取回），
         入口已移除。组合也不放行：折叠后里面的东西看不见，隔空命中的结果没有着力点。 */
      if (tn && isContainerNode(tn) && G.collapsed.has(tn.id)){
        toast("<b>" + esc(tn.label) + "</b><br>" + (tn.kind === "loc" ? "场景已折叠" : "已折叠") +
              "：先双击展开，或把节点拖到证物袋", true);
        return;
      }
      attemptCombo(n.key, target.dataset.key);
      return;
    }
    /* 松手落在空白处 → 就停在这里。**不再自动钉住**（钉住只由右键控制，见 togglePin）：
       这里只改位置，所以下一次自动布局仍可能把它重排走 —— 想留住这一摆位就右键钉住它。 */
    const rawX = parseFloat(el.style.left) || n.x, rawY = parseFloat(el.style.top) || n.y;
    n.x = Math.max(60, Math.min(2000 - 220, rawX));
    n.y = Math.max(50, Math.min(1300 - 120, rawY));
    if (n.x !== rawX || n.y !== rawY){
      /* 拖到画布「框边」→ 越界被夹回：必须用 springBack 让节点与连线同帧走完，
         不能只写一次 left/top（CSS 过渡期间节点在滑、连线已跳到终点 → 看着就是"断线"）。 */
      springBack(el, n.x, n.y);
    } else {
      el.style.left = n.x + "px";
      el.style.top  = n.y + "px";
      paintEdges();
    }
    updateCrumbs();
  });

  el.addEventListener("dblclick", () => {
    clearFresh(n);          /* 双击也算「点过」：角标立刻摘掉 */
    if (isContainerNode(n)){   /* 容器一律双击展开 / 折叠（书桌、垃圾桶也一样） */
      if (G.collapsed.has(n.id) || G.explored.has(n.id)){ toggleCollapse(n.id); selectNode(n.key); return; }
      revealScene(n.id); selectNode(n.key); return;
    }
    runPrimary(n);
  });

  /* 右键 = 钉住 / 取消钉住（不弹提示：状态由节点左上角的「已固定」角标表达）。
     这是**唯一**的钉住入口：拖动只改位置，不再顺手钉住（旧版拖到空白即锁定，容易被当成 bug）。 */
  el.addEventListener("contextmenu", e => {
    e.preventDefault();
    e.stopPropagation();
    togglePin(n);
  });
}
/* 钉住 = 位置锁定（自动布局不再挪它）+ 折叠时不被收回。**只能由右键进入**（拖动不再自动钉住）。
   两个后果都不需要玩家记，看见角标就够 */
function togglePin(n){
  if (!requireCase()) return;
  pushHistory();
  n.pinned = !n.pinned;
  render();
}

/* 屏幕坐标命中测试：取「离光标最近」的那个节点，避免多节点重叠时选错 */
function hitTest(cx, cy, excludeEl){
  let best = null, bestD = Infinity;
  Object.values(G.nodes).forEach(n => {
    if (!n.el || n.el === excludeEl) return;
    const r = n.el.getBoundingClientRect();
    if (cx < r.left - 10 || cx > r.right + 10 || cy < r.top - 10 || cy > r.bottom + 10) return;
    const d = Math.hypot(cx - (r.left + r.right) / 2, cy - (r.top + r.bottom) / 2);
    if (d < bestD){ bestD = d; best = n.el; }
  });
  return best;
}

function toWorld(cx, cy){
  const r = stage.getBoundingClientRect();
  return { x: (cx - r.left - view.x) / view.k, y: (cy - r.top - view.y) / view.k };
}
function applyView(){
  world.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.k + ")";
}

/* ============ 镜头：自动平移 ============
   只平移、不缩放（不替玩家改缩放级别）；缓动期间玩家一拖节点 / 一平移 / 一滚轮即打断。 */
let viewAnim = null;
/* 最近一次自动聚焦的「决定」（调试 + 无头验证用：镜头位移在无头环境里量不到，只能量决定） */
let lastFocus = null;
const __now = () => (typeof performance !== "undefined" ? performance.now() : Date.now());
/* 用 setTimeout 逐帧推进（不用 rAF）：无头 stub 里 setTimeout 是 no-op，既不动画也不会递归爆炸；
   浏览器里 16ms 一帧足以平滑 240ms 的位移。 */
const __schedule = cb => setTimeout(() => cb(__now()), 16);
function cancelViewAnim(){ if (viewAnim != null){ try{ clearTimeout(viewAnim); }catch(_){} viewAnim = null; } }
function animateViewTo(tx, ty, ms){
  cancelViewAnim();
  const sx = view.x, sy = view.y, t0 = __now();
  ms = ms || 240;
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const step = () => {
    const t = Math.min(1, (__now() - t0) / ms);
    view.x = sx + (tx - sx) * ease(t);
    view.y = sy + (ty - sy) * ease(t);
    applyView();
    if (t < 1) viewAnim = __schedule(step); else viewAnim = null;
  };
  viewAnim = __schedule(step);
}
function nodeBox(n){
  return { x0: n.x, y0: n.y, x1: n.x + (NODE_W[n.kind] || 130), y1: n.y + (NODE_H[n.kind] || 46) };
}
/* 把一组节点整体平移到视野中央（只平移，不改 view.k）。 */
function focusOn(keys, ms){
  const list = (keys || []).map(k => G.nodes[k]).filter(n => n && !n.hidden && !n.stored);
  if (tgReveal && !tgReveal.checked){ lastFocus = { on:false, why:"toggle-off", keys:[] }; return false; }
  if (!list.length){ lastFocus = { on:false, why:"nothing-visible", keys:[] }; return false; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  list.forEach(n => {
    const b = nodeBox(n);
    x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0);
    x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1);
  });
  const names = [];
  list.forEach(n => { if (names.indexOf(n.key) < 0) names.push(n.key); });   /* 去重：调用方给的集合可能有交集 */
  const r = stage.getBoundingClientRect();
  if (!r || !r.width || !r.height){                  /* 无头/隐藏环境：量不到视口，不动镜头 */
    lastFocus = { on:false, why:"no-viewport", keys:names };
    return false;
  }
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const tx = r.width / 2 - cx * view.k, ty = r.height / 2 - cy * view.k;
  lastFocus = { on:true, why:"centered", keys:names, cx:cx, cy:cy, tx:tx, ty:ty };
  animateViewTo(tx, ty, ms || 260);
  return true;
}

/* ---- 新节点产出后的自动聚焦 ----
   「哪条路径长了新节点，它就该被看到」——把这个规则收成一处，所有产出路径共用同一套收尾。
   谁算「新」？ensureNode 新建的节点都带 n.fresh = true，而 render() 会把它擦掉，
   所以取"新节点"必须抢在 render() 之前——settle() 内部已经按这个顺序摆好了。

   为什么不沿用「已在视野内就不动镜头」的做法：缩到最小时（适应窗口 k≈0.42）整张图都在
   视野内，那个短路会让聚焦永不触发，等于没做。聚焦的意思是「看这里」，不是「勉强可见」。

   两个收尾动作按"这次要不要重排图"来选：
     settle()           —— 图结构变了（长 / 删了节点）：重排 → 渲染 → 聚焦；无新节点则只重排
     focusFresh(news)   —— 图没重排（开关灯 / 纯重绘）：只把已有结论送去聚焦
   镜头只认「新节点」这一个集合：锚点（谁产出了它）不参与框选，理由见 focusFresh 的注释。 */
function freshKeys(){
  return Object.keys(G.nodes).filter(k => {
    const n = G.nodes[k];
    return n && n.fresh && !n.hidden && !n.stored;
  });
}
/* 聚焦到「本次新长出来的节点」，把它们整体带到视野中央。
   为什么只框新节点、不把"产出它的那个锚点"也框进来：合成会消耗参与者，还活着的那个
   锚点可能在几百像素之外（实测手电筒 ↔ 尸体相距 264~763px），一起框等于把新节点推到
   舞台角落（实测最坏偏离中心 285px）——看着就是"没聚焦"。锚点本身就在玩家眼皮底下，
   不需要镜头带过去；新节点才是要找的那个。 */
function focusFresh(news){
  const live = (news || []).filter(k => { const n = G.nodes[k]; return n && !n.hidden && !n.stored; });
  if (!live.length){ lastFocus = { on:false, why:"no-new-node", keys:[] }; return false; }
  return focusOn(live);
}
/* 标准收尾：重排 → 渲染 → 把新节点带进视野。没有新节点（纯消耗 / 纯提示）时退回原来的
   「重排 + 渲染」，镜头一动不动。顶栏「新节点自动居中」关掉 → focusOn 直接返回 false。
   返回本次新节点的 key 列表，供调用方决定"该选中谁"。 */
function settle(){
  const news = freshKeys();     /* 必须抢在 render() 清掉 fresh 之前读 */
  layout();
  render();
  focusFresh(news);
  return news;
}
/* 收尾后选中"该看的东西"：原目标若在这一步被消耗掉了（合成常吃掉参与者），
   就改选这次新长出来的节点 —— 否则详情窗会弹出「节点已不存在」。
   返回实际选中的 key（无可选则 null）。 */
function settleSelect(news, preferKey){
  const keep = G.nodes[preferKey] ? preferKey : ((news || []).find(k => G.nodes[k]) || null);
  if (keep) selectNode(keep);
  return keep;
}

/* 双击物品 / 线索的主行为 */
function runPrimary(n){
  if (n.kind === "clue"){
    if (G.captured.has(n.id)){ log("线索「" + esc(n.label) + "」已经捕获过了", "warn"); return; }
    pushHistory(); G.captured.add(n.id);
    log("已捕获线索「" + esc(n.label) + "」", "cap");
    render(); selectNode(n.key);
    return;
  }
  if (n.kind === "char"){
    const ch = CHARS[n.id] || {};
    if (!charTalkQueue(n).length){ toast("<b>" + esc(ch.name || n.id) + "</b><br>（暂无对话文本）"); return; }
    showCharLine(n);            /* 双击节点 = 说下一句；点气泡 = 同一件事 */
    return;
  }
  /* 物品：有命令就跑第一条；无命令的没有主动作，双击 = 选中（描述统一在详情窗里读） */
  const it = ITEMS[n.id] || {};
  const cmds = it.commands || [];
  if (!cmds.length){ selectNode(n.key); return; }
  runCommand(n, cmds[0]);
}

/* ============ 物品命令 ============ */
function runCommand(n, cmd){
  const it = ITEMS[n.id] || {};
  const t = cmd.type;

  /* 光照门（可选）：requiresLit = true（任意环境光源）/ "ITEM_x"（指定的那一盏）的命令，
     必须先点亮才执行得下去。暗着双击 = 只给一行提示，不生成任何节点、不进撤销栈。 */
  if (cmd.requiresLit && !lightOn(cmd.requiresLit)){
    const dark = plain(cmd.failMessage || "光线太暗，什么也看不清。");
    log("「" + esc(n.label) + "」：" + esc(dark), "warn");
    noteSeen(cmd.failMessage || "");
    toast("<b>" + esc(n.label) + "</b><br>" + esc(dark), true);
    return;
  }

  if (t === "text"){
    const news = freshKeys();          /* 抢在 render() 清掉 fresh 之前 */
    gotClues(plain(cmd.value || ""));
    noteSeen(cmd.value || cmd.message || "");
    log("「" + esc(n.label) + "」：" + esc(plain(cmd.value || "")), "sys");
    if (isToggleLight(n.id)){
      pushHistory();
      n.lit = !n.lit;
      const flavor = n.lit ? (it.litOnMessage || "亮了起来") : (it.litOffMessage || "熄灭了");
      log("「" + esc(n.label) + "」" + esc(plain(flavor)), n.lit ? "act" : "sys");
    } else if (!news.length){
      return;                      /* 纯文本、也没长出节点：维持原来的"不动画面" */
    }
    /* 开关灯只重绘（重排会让灯自己跳位置）；正文里真带出 [clue:] 时才重排并聚焦过去 */
    if (news.length) layout();
    render();
    focusFresh(news);
    return;
  }
  if (t === "choice"){ spawnChoiceNodes(n, cmd); return; }
  if (t === "password"){ openPasswordPop(n); return; }
  if (t === "useItem"){
    const need = cmd.requiredItem;
    const needLabel = labelOf("item", need) || need;
    const have = nodeByKey("item", need);
    if (!have){
      log("「" + esc(n.label) + "」需要「" + esc(needLabel) + "」，但画布上还没有这个节点", "warn");
      noteSeen(cmd.failMessage || "");
      return;
    }
    /* 前置零件（可选）：requires 里列的东西必须**已经装在本节点上** ——
       由带 installs:true 的 useItem 命令成功时写进 n.installed。
       例：唱机得先装上唱针，才放得出黑胶（数据写在唱机的「放入黑胶」命令上）。 */
    const lack = (cmd.requires || []).find(pid => !(n.installed || {})[pid]);
    if (lack){
      const why = plain(cmd.failMessage || ("还缺「" + (labelOf("item", lack) || lack) + "」没装上，现在做不了这件事。"));
      log("「" + esc(n.label) + "」：" + esc(why), "warn");
      noteSeen(cmd.failMessage || "");
      return;
    }
    /* 工具本身要发光却没点亮（手电筒）：先拦下 */
    if (litToolBlocked(have)) return;
    pushHistory();
    log("「" + esc(n.label) + "」使用「" + esc(needLabel) + "」：" + esc(plain(cmd.successMessage || "")), "act");
    gotClues(cmd.successMessage || "");
    noteSeen(cmd.successMessage || "");
    /* 装上的零件：记在节点上（进快照，撤销 / 续档跟着走），后续命令用 requires 认它 */
    if (cmd.installs){ n.installed = Object.assign({}, n.installed); n.installed[need] = true; refreshMusicIcon(); }
    if (cmd.onSuccess) applyPayload(cmd.onSuccess, n.key);
    if (tgConsume.checked && REUSABLE_TOOLS.indexOf(need) < 0) deleteNode("item:" + need);
    settleSelect(settle(), n.key);
    return;
  }
  if (t === "conditional"){
    const conds = cmd.conditions || [];
    const missing = conds.filter(c => !G.captured.has(c.clue));
    if (missing.length){
      const m = missing[0];
      log("「" + esc(n.label) + "」条件不足，缺线索：" + esc(labelOf("clue", m.clue) || m.clue), "warn");
      noteSeen(m.failMessage || "");
      return;
    }
    pushHistory();
    log("「" + esc(n.label) + "」：" + esc(plain(cmd.successMessage || "")), "act");
    noteSeen(cmd.successMessage || "");
    if (cmd.onSuccess) applyPayload(cmd.onSuccess, n.key);
    settleSelect(settle(), n.key);
    return;
  }
  if (t === "reveal"){
    /* 揭示：接触本节点后，把「下一层级」的节点摆到它旁边，并连上实体边
       （区别于场景展开：不产生新的场景节点，只在原地长出一层内容物） */
    pushHistory();
    const text = cmd.successMessage || cmd.value || "";
    log("「" + esc(n.label) + "」：" + esc(plain(text)), "act");
    gotClues(text);
    noteSeen(text);
    const kids = cmd.items || [];
    if (kids.length){
      spawnItems(kids, n.key);
      kids.forEach(iid => link(n.key, "item:" + iid, "entity"));
    }
    settleSelect(settle(), n.key);
    return;
  }
  log("「" + esc(n.label) + "」的命令类型 " + esc(t) + " 暂不支持", "warn");
}

function applyPayload(payload, nearKey){
  if (!payload) return;
  if (payload.items) spawnItems(payload.items, nearKey);
  if (payload.scene && SCENES[payload.scene]){
    const sn = ensureNode("loc", payload.scene, { label: SCENES[payload.scene].title });
    markFresh(sn);
  }
  gotClues(payload.message || payload.text || "");
  noteSeen(payload.message || payload.text || "");
}
function gotClues(text){
  parseTags(text).forEach(t => {
    if (t.kind === "clue" && CLUES[t.id]){
      if (!nodeByKey("clue", t.id)){ const cn = ensureNode("clue", t.id, {}); markFresh(cn); }
      G.captured.add(t.id);
    }
  });
}

/* ============ 光源光晕 ============ */
function paintGlow(){
  const g = document.getElementById("glow");
  if (!g) return;
  const lamp = Object.values(G.nodes).filter(n => n.lit)[0];
  if (!lamp || !lamp.el){ g.style.display = "none"; return; }
  const c = center(lamp.el);
  g.style.display = "block";
  g.style.left = (c.x - 280) + "px";
  g.style.top  = (c.y - 280) + "px";
}

/* ============ 节点上的密码弹窗 ============ */
let pwPop = null, pwTarget = null;
function closePwPop(){ if (pwPop){ pwPop.remove(); pwPop = null; pwTarget = null; } }
function openPasswordPop(n){
  closePwPop();
  const cmd = (ITEMS[n.id].commands || []).find(c => c.type === "password");
  if (!cmd) return;
  const w = makeWindow("LOCK // " + n.label, closePwPop);
  const pop = w.el;
  pop.className = "pw-pop syswin";
  const hint = document.createElement("div");
  hint.className = "pw-title";
  hint.textContent = (cmd.label || "输入密码") + "（四位数字）";
  const row = document.createElement("div");
  row.className = "pw-row";
  const input = document.createElement("input");
  input.id = "pw-in";
  input.maxLength = 4;
  input.placeholder = "····";
  input.setAttribute("inputmode", "numeric");
  const ok = document.createElement("button");
  ok.className = "primary";
  ok.id = "pw-ok";
  ok.textContent = "确定";
  row.appendChild(input); row.appendChild(ok);
  w.body.appendChild(hint); w.body.appendChild(row);
  pop.style.left = (n.x + NODE_W[n.kind] / 2 - 95) + "px";
  pop.style.top  = (n.y + NODE_H[n.kind] + 10) + "px";
  pop.addEventListener("pointerdown", e => e.stopPropagation());
  makeFloatDraggable(pop, true);
  world.appendChild(pop);
  pwPop = pop; pwTarget = n.id;
  ok.addEventListener("click", () => window.__pw(n.id));
  input.addEventListener("keydown", e => { if (e.key === "Enter") window.__pw(n.id); });
  if (input.focus) input.focus();
  selectNode(n.key);
}

/* ============ 选项命令：把选项弹成画布上的节点 ============ */
function spawnChoiceNodes(n, cmd){
  const opts = cmd.options || [];
  if (!opts.length) return;
  pushHistory();
  const added = [];
  opts.forEach((o, i) => {
    if (o.message){ log(esc(plain(o.message)), "sys"); noteSeen(o.message); }
    const r = o.results || {};
    if (r.scene && SCENES[r.scene]){
      const existed = !!nodeByKey("loc", r.scene);
      const sn = ensureNode("loc", r.scene, { label: SCENES[r.scene].title });
      if (!existed){
        sn.x = n.x + (i - (opts.length - 1) / 2) * 190;
        sn.y = n.y + 110;
        markFresh(sn);
        added.push("「" + sn.label + "」");
      }
      link(n.key, sn.key, "cond");
    } else {
      applyPayload(r, n.key);
    }
  });
  log("「" + esc(n.label) + "」" + esc(cmd.label || "选项") + "：" + (added.length ? "出现 " + esc(added.join("、")) : "选项节点已在画布上"), "act");
  settleSelect(settle(), n.key);
}

/* ============ 统一系统窗口：标题栏（拖动把手）+ × 关闭 + 内容区 ============ */
function makeWindow(titleText, onClose, onMin){
  const el = document.createElement("div");
  el.className = "syswin";
  const bar = document.createElement("div");
  bar.className = "syswin-bar";
  const rule1 = document.createElement("span");
  rule1.className = "syswin-rule";
  const title = document.createElement("span");
  title.className = "syswin-title";
  title.textContent = titleText;
  const rule2 = document.createElement("span");
  rule2.className = "syswin-rule";
  const x = document.createElement("span");
  x.className = "syswin-x";
  x.textContent = "×";
  x.title = "关闭";
  x.addEventListener("pointerdown", e => { if (e) e.stopPropagation(); });
  x.addEventListener("click", e => { if (e) e.stopPropagation(); onClose(); });
  bar.appendChild(rule1); bar.appendChild(title); bar.appendChild(rule2);
  /* 最小化键（可选）：只有传了 onMin 的窗口才有（如 TEC 对话窗），位置排在 × 左边 */
  if (onMin){
    const mn = document.createElement("span");
    mn.className = "syswin-min";
    mn.textContent = "–";
    mn.title = "最小化";
    mn.addEventListener("pointerdown", e => { if (e) e.stopPropagation(); });
    mn.addEventListener("click", e => { if (e) e.stopPropagation(); onMin(); });
    bar.appendChild(mn);
  }
  bar.appendChild(x);
  const body = document.createElement("div");
  body.className = "syswin-body";
  el.appendChild(bar); el.appendChild(body);
  return { el, bar, body };
}

/* ============ 浮层通用拖动（元素自身 pointer 捕获模式，可指定把手） ============ */
function makeFloatDraggable(el, inWorld, handle){
  const h = handle || el;
  let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
  h.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    /* 「本次手势拖过没」在这里就复位 —— **必须在下面那张排除表之前**：从被排除的子元素
       （TEC 头像 / 清单项 / × 关窗键）上起手时，下面会提前 return，若复位写在后面，_dragged
       会一直留着上一次拖窗口的 true，那些元素自己的"点击"就被误吞了（真机才有；DOM stub 的
       closest() 恒返回 null，排除表在 stub 里等于不存在，所以这条测不出来）。 */
    el._dragged = false;
    /* 交互子元素（按钮/输入框/清单项/× 关窗键/阵列执行者与线索 chip/花园叙事框）不启动拖动——否则
       setPointerCapture 会把 pointerup 与 click 一起重定向到窗口自身，行内可点的东西永远收不到 click。
       新增可点清单项时记得往这里加。花园叙事框是「整框点一下 = 看下一段」，必须在此列（真机才暴露：
       合成 click 直接投递给元素，绕过了这层重定向，探针会假通过）。 */
    if (e.target && e.target.closest && e.target.closest("button,input,.bag-item,.map-card,.goto-item,.syswin-x,.syswin-min,.tec-avatar,.mx-exec,.mx-chip,.music-row,.gd-narr")) return;
    /* CSS 定位的浮窗（right/bottom/margin 居中），首次拖动时换算成 left/top，并清掉 margin 防止跳位 */
    if (el.style.left === "" || el.style.left == null){
      const r = el.getBoundingClientRect(), sr = desktopEl.getBoundingClientRect();
      el.style.left = (r.left - sr.left) + "px"; el.style.top = (r.top - sr.top) + "px";
      el.style.right = "auto"; el.style.bottom = "auto"; el.style.margin = "0";
    }
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY;
    /* _dragged（本次手势拖过没）已在函数开头复位：点击推进靠它区分「点一下」和「按住挪一下」（阈值 5px） */
    ox = parseFloat(el.style.left) || 0; oy = parseFloat(el.style.top) || 0;
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    e.stopPropagation();
  });
  h.addEventListener("pointermove", e => {
    if (!dragging) return;
    const k = inWorld ? view.k : 1;
    if (!moved && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) < 5) return;
    moved = true; el._dragged = true;
    /* 弹窗的 pop 缩放动画未结束时拖动会让光标对不上，开始拖动即定格到最终形态 */
    if (el.style.animation !== "none") el.style.animation = "none";
    el.style.left = (ox + (e.clientX - sx) / k) + "px";
    el.style.top  = (oy + (e.clientY - sy) / k) + "px";
  });
  h.addEventListener("pointerup", () => { dragging = false; });
}

/* ============ 角色对话队列 + 锚定气泡 ============ */
function charTalkQueue(n){
  const ch = CHARS[n.id] || {};
  const norm = arr => (arr || []).map(o => typeof o === "string" ? o : (o && o.text) || "").filter(Boolean);
  const base = norm((ch.talkQueue && ch.talkQueue.length) ? ch.talkQueue :
                    ((ch.defaultTalks && ch.defaultTalks.length) ? ch.defaultTalks : ch.lines));
  const scene = norm((ch.sceneTalks || {})[n.homeScene]);
  return base.concat(scene);
}
let bubbleEl = null;
function closeBubble(){
  if (bubbleEl){
    const bd = bubbleEl.querySelector && bubbleEl.querySelector(".syswin-body");
    if (bd) cancelType(bd);
    bubbleEl.remove(); bubbleEl = null;
  }
}
/* 气泡：opts.adv 传了才支持「点框内任意位置推进」（捕获结果那种一次性提示不带推进）。
   拖动仍是整框可拖，靠 _dragged 区分点/拖。 */
function showBubble(n, titleText, text, opts){
  closeBubble();
  const w = makeWindow(titleText, closeBubble);
  const b = w.el;
  b.className = "bubble syswin";
  const adv = (opts && opts.adv) || null;
  w.body.textContent = text;                 /* 先放全文 → 按整框实测高度定位 */
  makeFloatDraggable(b, true);
  world.appendChild(b);
  const bubTop = clampFloatY(n.y - b.offsetHeight - 12, b.offsetHeight);
  b.style.top = bubTop + "px";
  b.style.left = avoidHint(clampFloatX(n.x + NODE_W[n.kind] / 2 - b.offsetWidth / 2, b.offsetWidth), bubTop) + "px";
  if (adv){
    b.title = "单击任意位置继续，按住可拖动";
    b._typing = true;
    b.addEventListener("click", () => {
      if (b._dragged) return;                       /* 刚拖过 -> 那一下不算点击 */
      if (b._typing){                               /* 先补全本句，再点才推进 */
        cancelType(w.body); w.body.textContent = text; b._typing = false;
        return;
      }
      adv();
    });
    w.body.style.minHeight = (w.body.offsetHeight || 0) + "px";   /* 预占高度，打字时框不跳 */
    typeInto(w.body, text, { done: () => { b._typing = false; } });
  }
  bubbleEl = b;
}
/* 对话专用的线索入口：**台词本身不进案卷**（气泡与 TEC 窗里逐字都在），
   只把「这一句给出了线索」这个结果留档 —— 否则玩家回头查不到线索到手的时刻。
   对话是本案唯一「说了话才拿到线索」的通道：陆珩松 7月4日 那句带 [clue:CLUES_zhpt]，
   朱穗密室那句带 [clue:CLUES_qsan]，都不能因为不记台词而连线索一起丢。 */
function talkClues(text, who){
  const before = new Set(G.captured);
  gotClues(text);
  const fresh = [...G.captured].filter(id => !before.has(id));
  if (fresh.length)
    log("「" + esc(who) + "」的话里提到了线索：" + esc(fresh.map(id => (CLUES[id] && CLUES[id].label) || id).join("、")), "cap");
}
/* 角色说下一句：双击节点 / 点名册行 / 点对话窗 共用这一条路径。
   呈现统一按 TEC 对话窗的布局（用户定稿）：头像列 + 文字历史逐条追加，不再用锚定气泡；
   但**落位仍按旧气泡的规矩**（用户定稿）：窗体锚定在人物节点上方（挂 #world、JS 写内联
   top/left），上方放不下退到下方 —— TEC 自己的助手窗才留在桌面右下角。
   台词不循环：队列说完（prog >= queue.length）就停止推进 —— 点了也不再有新句。 */
let dlgWinEl = null;                 /* 当前对话窗（单例：换角色 = 关旧开新；同角色 = 追加） */
function closeDlgWin(){
  if (dlgWinEl){ dlgWinEl.remove(); dlgWinEl = null; }
}
function openDlgWin(n, ch, lineText){
  const name = ch.name || n.id;
  const sameChar = dlgWinEl && dlgWinEl._charKey === n.key;
  if (!sameChar) closeDlgWin();
  if (!dlgWinEl){
    const w = makeWindow("DIALOG // " + name, closeDlgWin);
    const b = w.el;
    /* 复用 TEC 对话窗的布局语言：CSS 用 .tec-win,.dlg-win 并列选择器（窗本体不挂 tec-win，
       否则 verify 的 tecWinNode() 会把对话窗误认成 TEC 窗） */
    b.className = "dlg-win syswin";
    const body = document.createElement("div");
    body.className = "tec-body";
    const avCol = document.createElement("div");
    avCol.className = "tec-avatar-col";
    const av = document.createElement("div");
    av.className = "tec-avatar";
    const art = rosterAvatar(n.id);
    if (art){
      const im = document.createElement("img");
      im.src = art; im.alt = name; im.draggable = false;
      av.appendChild(im);
    } else {
      const ini = document.createElement("span");
      ini.className = "dlg-ini"; ini.textContent = name.slice(0, 1);
      av.appendChild(ini);
    }
    const avLabel = document.createElement("div");
    avLabel.className = "tec-avatar-label"; avLabel.textContent = name;
    avCol.appendChild(av); avCol.appendChild(avLabel);
    const main = document.createElement("div");
    main.className = "tec-main";
    const lines = document.createElement("div");
    lines.className = "tec-lines dlg-lines";
    main.appendChild(lines);
    const hint = document.createElement("div");
    hint.className = "tec-hint";
    hint.textContent = "点框内任意位置继续对话";
    main.appendChild(hint);
    body.appendChild(avCol); body.appendChild(main);
    w.body.appendChild(body);
    /* 点窗内任意位置 = 说下一句（与 TEC 窗同一套口径：拖过不算，挂窗根） */
    b.addEventListener("click", () => {
      if (b._dragged) return;
      showCharLine(b._talkNode);
    });
    world.appendChild(b);                 /* 挂世界层：跟着画布坐标走，锚在人物节点上 */
    makeFloatDraggable(b, true);          /* inWorld：拖动位移按视图缩放换算（同气泡 / 叙事卡） */
    dlgWinEl = b;
  }
  dlgWinEl._charKey = n.key;
  dlgWinEl._talkNode = n;
  dlgWinEl.querySelector(".syswin-title").textContent = "DIALOG // " + name;
  const lines = dlgWinEl.querySelector(".dlg-lines");
  const d = document.createElement("div");
  d.className = "tec-line";
  d.textContent = lineText;
  lines.appendChild(d);
  lines.scrollTop = lines.scrollHeight;
  /* 仅首次为该角色开窗时锚定一次（旧气泡规矩：底边压在人物上方 12px，上方放不下退下方）。
     同角色后续台词只追加不重锚定 —— 否则玩家拖动对话框后，一点「继续对话」就会弹回原位。
     首次开窗后位置交还玩家自由拖动，刷新/换角色重开时仍会重新锚定。 */
  if (!sameChar) anchorAboveOrBelow(dlgWinEl, n, 12);
  return dlgWinEl;
}
function showCharLine(n){
  const ch = CHARS[n.id] || {};
  const queue = charTalkQueue(n);
  if (!queue.length) return false;
  const prog = G.talkProg[n.key] || 0;
  if (prog >= queue.length) return false;      /* 台词说完：停止推进，点了也不再有新句 */
  const line = queue[prog];
  pushHistory();
  G.talkProg[n.key] = prog + 1;
  talkClues(line, ch.name || n.id);
  openDlgWin(n, ch, plain(line));
  render();
  selectNode(n.key);
  return true;
}

/* 浮窗初始位置避开左上角操作提示区 */
function avoidHint(x, y){
  const hint = document.getElementById("hint");
  if (!hint) return x;
  const hr = hint.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const hintRight = (hr.right - sr.left - view.x) / view.k;
  const hintBottom = (hr.bottom - sr.top - view.y) / view.k;
  if (y < hintBottom && x < hintRight) return hintRight + 12;
  return x;
}

/* 浮窗初始位置收拢到当前可视范围内（世界坐标），避免标题栏被裁掉 */
function clampFloatX(x, w){
  const stageW = stage.getBoundingClientRect().width || 1200;
  const minX = (8 - view.x) / view.k, maxX = (stageW - 8 - view.x) / view.k - (w || 200);
  return Math.max(minX, Math.min(Math.max(minX, maxX), x));
}
function clampFloatY(y, h){
  const stageH = stage.getBoundingClientRect().height || 700;
  const minY = (8 - view.y) / view.k, maxY = (stageH - 8 - view.y) / view.k - (h || 100);
  return Math.max(minY, Math.min(Math.max(minY, maxY), y));
}
/* 浮窗锚定在节点上方；上方放不下（节点太靠顶 / 被视图上沿裁掉）时退到节点下方，保证不盖住节点。
   c 已在 world 内（offsetHeight 为未缩放的布局高），n 为节点模型（世界坐标）。gap 为与节点的间距。 */
function anchorAboveOrBelow(c, n, gap){
  const h = c.offsetHeight || 120, w = c.offsetWidth || 200;
  const nH = (NODE_H[n.kind] || 46);
  const above = n.y - h - gap;            /* 世界坐标：卡底 = n.y - gap */
  const below = n.y + nH + gap;           /* 世界坐标：卡顶 = n.y + nH + gap */
  let top = above;
  if (clampFloatY(above, h) !== above) top = below;   /* 上方被视图上沿裁掉 → 放到下方 */
  top = clampFloatY(top, h);
  c.style.top = top + "px";
  c.style.left = avoidHint(clampFloatX(n.x + NODE_W[n.kind] / 2 - w / 2, w), top) + "px";
}

/* ============ 场景首次展开叙事卡 ============ */
function narrText(html){
  return String(html || "")
    .replace(/\[(item|loc|char|clue):(.+?)\]/g, (m, k, id) => labelOf(k, id) || id)
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<[^>]+>/g, "").trim();
}
let narrEl = null;
/* 打字机：逐字写入用 setTimeout 轮询——无头 stub 里 setTimeout 返回 0（回调永不执行），
   于是走「同步写全文」分支，既不会挂死也保证断言读到完整文本。
   计时器记在**元素自己身上**（el._twTimer）：叙事卡 / 记忆放映卡 / 对话气泡可以同时在屏幕上，
   共用一根全局 timer 会让后开的那个把先开的打字中途掐断（记忆放映卡还是**每行一个 div**）。 */
function cancelType(el){
  if (el && el._twTimer){ clearTimeout(el._twTimer); el._twTimer = null; }
}
function typeInto(el, text, opts){
  const full = String(text == null ? "" : text);
  const speed = (opts && opts.speed) || 45;      /* ms / 字（约每秒 22 字，逐字看得清、不赶） */
  const done = (opts && opts.done) || null;
  cancelType(el);
  let i = 0;
  const step = () => {
    i += 1;
    el.textContent = full.slice(0, i);
    if (i >= full.length){ el._twTimer = null; if (done) done(); return; }
    const t = setTimeout(step, speed);
    if (!t){ el.textContent = full; el._twTimer = null; if (done) done(); }   /* stub：无定时能力 → 直接满字 */
    else el._twTimer = t;
  };
  step();
}
function closeNarr(){
  if (narrEl){
    const nb = narrEl.querySelector && narrEl.querySelector(".syswin-body");
    if (nb) cancelType(nb);
    narrEl.remove(); narrEl = null;
  }
  if (memoryPlay && memoryPlay.cur) cancelType(memoryPlay.cur);
  if (memoryPlay && memoryPlay.timer) clearTimeout(memoryPlay.timer);
  memoryPlay = null;
}
function showNarrCard(n, s){
  closeNarr();
  const text = narrText(s.content || s.desc || "");
  if (!text) return;
  /* 卡头按 kind 取名：书桌 / 垃圾桶是物品，别把它们的叙事卡标成「 SCENE_FEED 」 */
  const w = makeWindow((n.kind === "loc" ? "SCENE_FEED" : "OBJECT_FEED") + " // " + (s.title || s.label || n.id), closeNarr);
  const c = w.el;
  c.className = "narr-card syswin";
  w.body.textContent = text;                 /* 先放全文 → 按整卡实测高度定位 */
  makeFloatDraggable(c, true);
  world.appendChild(c);
  anchorAboveOrBelow(c, n, 14);            /* 锚在节点上方，上方放不下则退到下方，不盖节点 */
  /* 预占整卡高度：打字时卡片不塌缩、位置不跳，字符逐字「长」在既有卡框里 */
  w.body.style.minHeight = (w.body.offsetHeight || 0) + "px";
  narrEl = c;
  typeInto(w.body, text);                    /* 清空重放为打字机 */
  /* 全文只留在卡片里：正文不进日志，也不再单记一条「叙事卡已放映」（放映是过程，不是结果） */
}

/* 重看场景叙事（详情窗按钮与测试钩子共用同一入口） */
function renarrScene(sid){
  const node = G.nodes[containerKey(sid)];
  if (!node) return;
  const s = containerData(sid) || {};
  if (SCENE_MEMORY.indexOf(sid) >= 0) showMemoryCard(node, s); else showNarrCard(node, s);
}

/* ============ TEC 对话窗口（桌面图标应用） ============ */
const tecHistory = [];   /* 页面会话级，不进 G/快照 */
let tecWinEl = null;
let tecMin = false;      /* 「– 收起」把窗口缩成桌面右下角那块带头像的助手卡片（#tec-chip） */
let tecDot = false;      /* 分析完成、玩家还没看过 -> 卡片角上点一个小圆点 */
let tecTask = null;      /* 分析中的任务：{ key, label, ms, endAt }，空闲为 null */
let tecChipBarKey = null;/* 进度条已按哪一个任务起播（防止每次 render 都把进度钉回 0%） */
function closeTecWin(){
  if (tecWinEl){ tecWinEl.remove(); tecWinEl = null; }

/* TEC 是常驻助手：只有「换案」和「重置」才清空它；同案回访（– 收起 / × 关闭后再展开）
   必须保留窗口与对话内容，否则会被 boot() 顺带收掉、再打开就只剩空壳。 */
function resetTec(){
  closeTecWin();
  tecHistory.length = 0;
  tecTask = null; tecDot = false; tecChipBarKey = null;
  showTecChip(false);
  updateTecBadge();
}
function tecSay(text){
  tecHistory.push(text);

     （7月4日那组闪回档案一次就有八条长句）。要留档的是结果，不是台词。 */
  if (tecWinEl){

    }

}
/* 素材占位符本身就代表一个完整可用的 src（index 成品 = assets/ 外链，standalone = data: 内联） */
const TEC_AVATAR = "assets/tec-avatar.png";

function toggleTecWin(){
  if (tecMin){                                /* 收在右下角卡片上 -> 点图标 = 还原，不是关闭 */
    openTecWin();                             /* 先把窗口建回 DOM，才量得到放大动画的终点 */
    tecMotionPlayIn();                        /* 从卡片位置放大回来 */
    return;
  }
  if (tecWinEl){ closeTecWin(); return; }     /* 开着 -> 点图标 = 关闭（原语义） */
  openTecWin();
}
function openTecWin(){

  avImg.alt = "TEC"; avImg.draggable = false;

  avLabel.className = "tec-avatar-label"; avLabel.textContent = "TEC";
  avCol.appendChild(av); avCol.appendChild(avLabel);
  /* 右：对话 + 操作 */

  main.className = "tec-main";
  const lines = document.createElement("div");
  lines.className = "tec-lines";
  tecHistory.forEach(t => {
    const d = document.createElement("div");
    d.className = "tec-line"; d.textContent = t;
    lines.appendChild(d);
  });
  main.appendChild(lines);
  const hint = document.createElement("div");
  hint.className = "tec-hint";
  hint.textContent = "拖节点到我身上分析 · 点框内任意位置闲聊";
  main.appendChild(hint);
  body.appendChild(avCol); body.appendChild(main);
  w.body.appendChild(body);
  /* 点窗内任意位置 = 交谈推进（与角色对话气泡 / 记忆放映卡同一套口径）：拖过的那一下不算点击
     （_dragged，所以整窗仍可拖动）。**必须挂在窗口根 `w.el` 上、不能挂在正文上** ——
     makeFloatDraggable 在 pointerdown 里对窗口根做了 setPointerCapture，随后的 click 会被
     **重定向到窗口根**（事件路径不再经过 .syswin-body），挂正文上的话点历史/提示行都不会触发；
     只有头像例外（它在拖动排除表里，起手时提前 return、没设捕获，click 才照常从它冒泡上来）。
     标题栏的 − / × 各自的 click 处理器里有 stopPropagation，落不到这里，语义不变。 */
  w.el.addEventListener("click", () => {
    if (w.el._dragged) return;
    tecTalk();
  });
  desktopEl.appendChild(w.el);
  makeFloatDraggable(w.el, false);
  tecWinEl = w.el;
  tecMin = false;
  showTecChip(false);                             /* 卡片熄掉（保留布局盒，展开动画还要量它） */
  tecDot = false;                                 /* 看过即已读 */
  if (tecTask){                                   /* 收起期间发起的分析还在跑 -> 补一根按剩余时间续播的进度条 */
    const live = G.nodes[tecTask.key];
    if (live) tecShowAnalyzing(live, tecTaskLeft());
  }
  updateTecBadge();
  if (lines) lines.scrollTop = lines.scrollHeight;   /* 打开时就停在最新一条 */
}
/* 收起 / 展开的位移与缩放：把 TEC 窗和右下角助手卡片的中心对上。
   卡片只用 visibility 隐藏、保留布局盒，所以熄掉之后也量得到（与案件卡片同一套做法）。 */
function tecChipMotion(){
  const w = tecWinEl, c = document.getElementById("tec-chip");
  if (!w || !c || typeof w.getBoundingClientRect !== "function") return null;
  if (typeof c.getBoundingClientRect !== "function") return null;
  const a = w.getBoundingClientRect(), b = c.getBoundingClientRect();
  if (!a.width || !a.height || !b.width || !b.height) return null;
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
  const dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  const s  = Math.max(.05, Math.min(b.width / a.width, b.height / a.height));
  return "translate(" + dx + "px," + dy + "px) scale(" + s + ")";
}
function tecMotionReset(){
  const w = tecWinEl;
  if (!w || !w.style) return;
  w.style.transition = ""; w.style.transform = ""; w.style.transformOrigin = ""; w.style.opacity = "";
}
function tecMotionApply(tf){
  const w = tecWinEl;
  if (!w || !w.style) return;
  w.style.transition = "transform .26s cubic-bezier(.4,0,.2,1), opacity .26s ease";
  w.style.transformOrigin = "50% 50%";
  w.style.transform = tf; w.style.opacity = "0";
}
/* 展开：从卡片位置放大回原位（窗口必须已经在 DOM 里，才量得到起点） */
function tecMotionPlayIn(){
  const tf = tecChipMotion();
  const w = tecWinEl;
  if (!w || !w.style || !tf) return;
  w.style.transition = "none";
  w.style.transformOrigin = "50% 50%";
  w.style.transform = tf; w.style.opacity = "0";
  if (typeof w.getBoundingClientRect === "function") w.getBoundingClientRect();   /* 强制回流，让起始态生效 */
  w.style.transition = "transform .26s cubic-bezier(.4,0,.2,1), opacity .26s ease";
  w.style.transform = "none"; w.style.opacity = "1";
  const t = setTimeout(tecMotionReset, 300);
  if (!t) tecMotionReset();
}
/* – 收起：窗口带位移与缩放地缩进右下角那块助手卡片（与案件卡片同一套语言）。
   分析进行中时，卡片上的进度条接着播（按剩余时间）。 */
function minTecWin(){
  if (!tecWinEl) return false;
  const w0 = tecWinEl;                       /* 记住这一块窗：110ms 内被还原/换掉时别摘错 */
  const tf = tecChipMotion();
  const land = () => {
    if (w0 && w0.parentNode) w0.remove();
    if (tecWinEl === w0){ tecWinEl = null; updateTecBadge(); }
  };
  /* 落点**先亮出来当靶子**，窗口再缩过去（与案件卡片 caseParkPoint 同一套做法）：
     卡片先淡入、窗口在它上面缩着淡出，两者交叠 —— 否则窗口先缩没、卡片才淡入，
     中间会"闪一下"再出现（用户反馈"不够顺滑"）。 */
  tecMin = true;                             /* 先置真：窗口不在屏幕上，但助手驻留在右下角卡片上 */
  tecChipBarKey = null;                      /* 让进度条按剩余时间重新起播 */
  showTecChip(true);
  updateTecChip();
  if (tf){
    tecMotionApply(tf);
    const t = setTimeout(land, 280);
    if (!t) land();                          /* 无头 stub：setTimeout 返回 0，同步收尾 */
  } else land();
  return true;
}

/* ============ TEC 分析：拖节点入 TEC -> 约 5~8s 分析 -> 提取线索 / 无线索提示 ============ */
const TEC_ANALYZE_MIN = 5000, TEC_ANALYZE_MAX = 8000;
let tecBusy = false;
/* ---- 右下角助手卡片（#tec-chip）：收起态的可视化 ----
   还剩多少毫秒：收起 / 还原之间要接着播同一根进度 */
function tecTaskLeft(){ return tecTask ? Math.max(400, tecTask.endAt - Date.now()) : 0; }
let tecChipOn = false;
/* 卡片的文案 / 进度条 / 完成圆点都在这里刷新（updateTecBadge 每次 render 都会调它） */
function updateTecChip(){
  const chip = document.getElementById("tec-chip");
  if (!chip) return;
  const st = document.getElementById("tc-status");
  if (st) st.textContent = tecTask ? ("分析中 · " + tecTask.label)
                       : (tecDot ? "分析完成 · 点此展开" : "助手已收起 · 点此展开");
  if (chip.classList) chip.classList.toggle("busy", !!tecTask);
  /* 进度条只在本轮任务的**第一次**刷新时起播：updateTecChip 会被 render 反复调到，
     每次都重启动画会把进度条永远钉在 0%。key 里带 endAt，换任务自然重播；
     minTecWin 把 key 清空，所以"分析途中才收起"也会按剩余时间重新起播。 */
  const key = tecTask ? (tecTask.key + "@" + tecTask.endAt) : null;
  const fill = document.getElementById("tc-bar-fill");
  if (fill && fill.style){
    if (!key){
      /* 空闲：把进度条停回 0。这里不能只写 `key !== tecChipBarKey` —— 两边都可能是 null，
         判不出来，进度条会一直停在"分析完成"的那一刻（踩过）。 */
      tecChipBarKey = null;
      if (fill.style.animationDuration !== "") fill.style.animationDuration = "";
    } else if (key !== tecChipBarKey){
      tecChipBarKey = key;
      fill.style.animationDuration = Math.round(tecTaskLeft()) + "ms";
      /* 重启动画只能用 animationName 长写：animation 是**简写**，写 "none" 会把 inline 的
         animation-duration 一起清零，动画退化成 0s 瞬间跑完（真机实测踩到；DOM stub 的
         style 不展开简写，所以 verify.js 查不出来）。 */
      fill.style.animationName = "none";
      void chip.offsetWidth;               /* 强制回流，让动画从头播 */
      fill.style.animationName = "";
    }
  }
  /* 完成圆点：压在卡片右上角，打开 TEC 窗口即清除 */
  let d = chip.querySelector ? chip.querySelector(".tc-dot") : null;
  if (tecDot){
    if (!d && chip.appendChild){ d = document.createElement("span"); d.className = "tc-dot"; chip.appendChild(d); }
  } else if (d) d.remove();
}
function showTecChip(v){
  tecChipOn = !!v;
  const c = document.getElementById("tec-chip");
  if (!c || !c.classList) return;
  if (v) updateTecChip();
  c.classList.toggle("on", !!v);
}
/* 卡片与「案件卡片 #case-dock」是两个独立落点：本卡片排在上方（bottom:84px vs 14px），不叠在一起 */
function initTecChip(){
  const img = document.getElementById("tc-av-img");
  if (img) img.src = TEC_AVATAR;
  attachDock(document.getElementById("tec-chip"), openTecWin);   /* 单击展开；拖完那一次不误展开 */
  showTecChip(false);
}
/* 节点可以拖到哪几个"外挂落点"上（悬停高亮 + 松手命中共用一份清单）。
   收起态才把右下角助手卡片加进来：卡片即使熄着也保留布局盒，不加这道门，
   窗口开着时拖节点划过卡片所在位置会被误判成"拖到了 TEC"。 */
/* 顺序即命中优先级。两扇收纳窗（证物袋 / 线索册）排在最前：它们在图标层之上
   （.bag-win / .clue-win z-index:25 > #icons z-index:24），窗口开着时会盖住左侧图标栏，
   按「看得见的最上面那个算数」的口径，被盖住的区域应判给窗口，而不是底下那张看不见的图标
   （否则拖物品到窗口上会莫名其妙落进被遮住的推演器 / 档案）。
   代价：窗口盖住的图标在窗口开着时点不到 —— 窗口可以拖走，这是可接受的取舍。 */
function nodeDropTargets(){
  const list = [];
  if (bagWinEl) list.push("bag-win");                                    /* 只在证物袋窗口开着时才是落点 */
  if (clueWinEl) list.push("clue-win");                                  /* 同上：线索册窗口开着才算落点 */
  list.push("bag-dock","clue-icon","tec-dock","infer-icon","goto-icon","tec-avatar");
  if (tecChipOn) list.push("tec-chip");
  return list;
}
/* 落点元素解析：两扇收纳窗是每次开窗临时建的，没有稳定的 DOM 查询入口，直接引用变量（关窗即置 null）；
   其余都是静态图标 / 头像，按 id 取即可。 */
function dropTargetEl(id){
  if (id === "bag-win") return bagWinEl;
  if (id === "clue-win") return clueWinEl;
  return document.getElementById(id);
}
function tecAnalyzingEl(){ return tecWinEl ? tecWinEl.querySelector(".tec-analyzing") : null; }
function tecClearAnalyzing(){ const e = tecAnalyzingEl(); if (e) e.remove(); }
function tecShowAnalyzing(n, ms){
  if (!tecWinEl) return;
  const main = tecWinEl.querySelector(".tec-main");
  if (!main) return;
  tecClearAnalyzing();
  const box = document.createElement("div");
  box.className = "tec-analyzing";

  head.className = "ta-head";
  const nm = document.createElement("span"); nm.className = "ta-name"; nm.textContent = "分析中 · " + n.label;
  head.appendChild(nm);

  bar.appendChild(fill);

}
function tecAnalyzeStart(key, ms){
  const n = G.nodes[key];
  if (!n) return false;
  if (n.kind === "clue"){ toast("线索节点不需要再让 TEC 分析", true); return false; }
  if (tecBusy){ toast("TEC 正在分析中，请稍候…", true); return false; }
  if (!tecWinEl && !tecMin) openTecWin();      /* 收起着就不弹窗：进度改画到右下角卡片上 */
  pushHistory();
  tecBusy = true;
  const dur = (typeof ms === "number" && ms > 0) ? ms
            : TEC_ANALYZE_MIN + Math.random() * (TEC_ANALYZE_MAX - TEC_ANALYZE_MIN);
  tecTask = { key: key, label: plain(n.label), ms: dur, endAt: Date.now() + dur };
  tecShowAnalyzing(n, dur);
  updateTecBadge();                            /* 收在卡片上 -> 卡片状态行 / 进度条同步起播 */
  tecSay("（接收「" + plain(n.label) + "」，开始分析…）");
  return true;
}
function tecAnalyzeFinish(key){
  const n = G.nodes[key];
  tecBusy = false;
  tecTask = null;              /* 进度条的收尾交给 updateTecChip（key 变 null 时会把动画停掉） */
  tecClearAnalyzing();
  if (!n) return false;
  /* 场景节点：评述由「档案解读」承担（见下），不走通用反应表（场景在表里没有条目，只会落兜底噪音） */
  if (n.kind !== "loc") tecReaction(key);      /* TEC 对该节点的评述（沿用原有反应表） */
  const talks = n.kind === "loc" ? (((CHARS["CHARS_TEC"] || {}).sceneTalks || {})[n.id] || []) : null;
  const unread = talks ? talks.length - (G.tecProg[n.id] || 0) : 0;
  {
    const fresh = capturableClues(n).filter(id => !G.captured.has(id));
    if (fresh.length){
      const src = nodeData(n);
      const hc = (src && src.hiddenClue) || {};
      fresh.forEach(id => {
        const cn = ensureNode("clue", id, {});
        markFresh(cn);
        link(key, cn.key, "entity");
        G.captured.add(id);
      });
      const names = fresh.map(id => (CLUES[id] && CLUES[id].label) || id).join("、");
      tecSay("分析完成：「" + plain(n.label) + "」中提取到线索 —— " + names + "。（已落到画布上，可自由拖动）");
      const text = plain(hc.text || "");
      if (text) tecSay(text);
      log("TEC 捕获「" + esc(n.label) + "」的隐藏线索：" + esc(names), "cap");
      settle();   /* 分析完把新线索带到视野中央（TEC 窗收在右下角，不挡画面） */
    } else if (!unread){
      tecSay("分析完成：「" + plain(n.label) + "」中没有可以捕获的线索。");
      log("TEC 分析「" + esc(n.label) + "」：无可捕获线索", "warn");
    }
  }
  /* 场景档案：每次分析解读一条（提示的唯一来源就是分析；进度记 tecProg，进存档/撤销） */
  if (talks && unread > 0){
    const prog = G.tecProg[n.id] || 0;
    G.tecProg[n.id] = prog + 1;
    tecSay(plain(talks[prog].text || ""));
    talkClues(talks[prog].text || "", "TEC");
    log("TEC 解读了「" + esc(n.label) + "」的档案（" + (prog + 1) + "/" + talks.length + "）", "sys");
  } else if (talks && !unread){
    tecSay("「" + plain(n.label) + "」的档案已经全部解读完毕。");
  }
  /* 窗口收在右下角卡片上：分析完成后在卡片角上点一个小圆点，打开 TEC 窗口即清除 */
  if (tecMin && !tecWinEl) tecDot = true;
  updateTecBadge();
  return true;
}
function tecAnalyze(key){
  const ms = TEC_ANALYZE_MIN + Math.random() * (TEC_ANALYZE_MAX - TEC_ANALYZE_MIN);
  if (!tecAnalyzeStart(key, ms)) return false;
  const t = setTimeout(() => tecAnalyzeFinish(key), ms);
  if (!t) tecAnalyzeFinish(key);               /* 无头 stub：setTimeout 返回 0，同步收尾 */
  return true;
}

function tecTalk(){
  /* 点击 = 闲聊（defaultTalks 逐条推进，不循环：说完就停，点了也不再有新句）。
     不给实质提示：提示的唯一来源是「拖节点 → 分析」。不进撤销栈——一句闲聊没有可撤销的状态。 */
  const tec = CHARS["CHARS_TEC"] || {};
  const def = (tec.defaultTalks && tec.defaultTalks.length) ? tec.defaultTalks : (tec.talkQueue || []);
  if (!def.length){ if (!tecWinEl) toggleTecWin(); tecSay("（把节点拖到我身上，我来分析）"); return; }
  const idx = G.tecProg._def || 0;
  if (idx >= def.length) return;              /* 台词说完：停止推进 */
  G.tecProg._def = idx + 1;
  const line = plain(def[idx].text || "");
  if (!tecWinEl) toggleTecWin();
  tecSay(line);
  updateTecBadge();
}

/* TEC 对某个节点的「评述」：不含开窗/历史副作用，供 tecConsult 与 tecAnalyze 复用 */
function tecReaction(toolKey){
  const tool = G.nodes[toolKey];
  if (!tool) return false;
  const hit = lookupReaction("char", "CHARS_TEC", tool.id);
  if (hit){
    const text = plain(hit.react.text || hit.react.message || "");
    tecSay("（分析 " + tool.label + "）" + text);
    talkClues(hit.react.text || hit.react.message || "", "TEC");
    noteSeen(hit.react.text || hit.react.message || "");
  } else {
    tecSay("关于「" + plain(tool.label) + "」，我暂时没有更多线索。试试把它和别的节点组合。");
    log("TEC 对「" + esc(tool.label) + "」没有特别的反应", "warn");
    G.tried.add(toolKey + ">tec-dock");
  }
  return !!hit;
}
/* 立即咨询（保底 API：window.__tec 走这里；不改延迟语义） */
function tecConsult(toolKey){
  const tool = G.nodes[toolKey];
  if (!tool) return false;
  pushHistory();
  if (!tecWinEl) toggleTecWin();
  return tecReaction(toolKey);
}

function updateTecBadge(){
  /* 提示没有"未读数"了：提示只在分析后产出，图标不再挂「提示 N」角标（免费频道的广告位一并拆掉） */
  const dock = document.getElementById("tec-dock");
  if (dock){
    const b = dock.querySelector(".badge.talk");
    if (b) b.remove();
    dock.classList.remove("pulse");
  }
  /* 驻留态（– 收起）= 右下角那块助手卡片，不落在图标上（用户明确要求"收进右下角带头像的一块"） */
  showTecChip(tecMin);
  updateTecChip();
}

/* ============ 选中聚焦（dim 非邻居） ============ */
function applyFocus(){
  const on = tgFocus.checked && sel && G.nodes[sel];
  const keep = {};
  if (on){
    keep[sel] = 1;
    G.edges.forEach(e => {
      if (e.a === sel) keep[e.b] = 1;
      if (e.b === sel) keep[e.a] = 1;
    });
  }
  G._dimKeys = [];
  Object.values(G.nodes).forEach(n => {
    if (!n.el) return;
    const dim = on && !keep[n.key];
    n.el.classList.toggle("dim", dim);
    if (dim) G._dimKeys.push(n.key);
  });
  paintEdges();
}
function clearSelection(){
  sel = null;
  nodeLayer.querySelectorAll(".node.sel").forEach(e => e.classList.remove("sel"));
  document.querySelectorAll(".desk-icon.sel").forEach(x => x.classList.remove("sel"));
  detailPlaceholder();
  setDetailWin(false);
  applyFocus();
}

/* ============ GOTO // 前往：听说过的场景索引 ============ */
/* seenTexts 不进 snapshot：已经"听说过"的知识不随撤销丢失 */
function noteSeen(text){
  if (!text) return;
  G.seenTexts.push(String(text));
  if (G.seenTexts.length > 200) G.seenTexts.shift();
}
function heardScenes(){
  const known = new Set(G.explored);
  Object.keys(G.nodes).forEach(k => { if (k.startsWith("loc:")) known.add(k.slice(4)); });
  G.explored.forEach(sid => sceneLocs(sid).forEach(t => known.add(t)));
  G.seenTexts.forEach(txt => {
    parseTags(txt).forEach(t => { if (t.kind === "loc" && SCENES[t.id]) known.add(t.id); });
    for (const id in SCENES){
      const t = SCENES[id].title;
      if (t && t.length >= 2 && txt.indexOf(t) >= 0) known.add(id);
    }
  });
  return [...known].filter(id => SCENES[id]);
}
function gotoScene(sid){
  if (!SCENES[sid]) return;                 /* 档案里只有场景；容器物品（书桌 / 垃圾桶）不在此列 */
  const isNew = !nodeByKey("loc", sid);
  if (isNew) pushHistory();
  const sn = ensureNode("loc", sid, { label: SCENES[sid].title });
  if (isNew){ markFresh(sn); layout(); }
  render();
  const r = stage.getBoundingClientRect();
  view.x = r.width / 2 - (sn.x + 76) * view.k;
  view.y = r.height / 2 - (sn.y + 27) * view.k;
  applyView();
  selectNode(sn.key);
  log("前往「" + esc(SCENES[sid].title || sid) + "」", "act");
}
let gotoWinEl = null;
function closeGotoWin(){ if (gotoWinEl){ gotoWinEl.remove(); gotoWinEl = null; } }
function toggleGotoWin(){
  if (gotoWinEl){ closeGotoWin(); return; }
  const w = makeWindow("ARCHIVE // 档案", closeGotoWin);
  w.el.classList.add("goto-win");
  desktopEl.appendChild(w.el);
  makeFloatDraggable(w.el, false);
  gotoWinEl = w.el;
  refreshGotoWin();
}
function refreshGotoWin(){
  if (!gotoWinEl) return;
  const body = gotoWinEl.querySelector(".syswin-body");
  if (!body) return;
  body.innerHTML = "";
  const list = heardScenes();
  if (!list.length){
    const d = document.createElement("div");
    d.className = "bag-empty";
    d.textContent = "（还没有听说任何场景）";
    body.appendChild(d);
    return;
  }
  list.forEach(sid => {
    const d = document.createElement("div");
    d.className = "goto-item";
    const label = document.createElement("span"); label.textContent = SCENES[sid].title || sid;
    const st = document.createElement("span"); st.className = "st";
    st.textContent = (G.explored.has(sid) ? "已探索" : "未探索") + " · " + (nodeByKey("loc", sid) ? "在画布" : "未在画布");
    d.appendChild(label); d.appendChild(st);
    d.addEventListener("click", () => { gotoScene(sid); closeGotoWin(); });
    body.appendChild(d);
  });
}

/* ============ CLUE LEDGER // 线索册：收纳盒 ============
   线索捕获后先落在画布上，要做的是「把它拖进线索册」（拖到窗口里或左侧图标上）——收进来即离开画布。
   册子里只有已收纳的线索：一条一行，感官直接标在行尾，整表按五感顺序自动排序（同感自然相邻），
   不再分组、不再标归位状态，也不给未捕获 / 未收纳的线索留位——册子就是盒子，装什么显示什么。
   点一行 = 取回画布（回到线索册图标旁并选中，详情窗顺势展开全文）；
   按住一行拖到推演桌布（或推演器图标）上松手 = 直接归位，不必先点回画布再拖一遍。 */
let clueWinEl = null;
function closeClueWin(){ if (clueWinEl){ clueWinEl.remove(); clueWinEl = null; } }
function toggleClueWin(){
  if (clueWinEl){ closeClueWin(); return; }
  const w = makeWindow("CLUE LEDGER // 线索册", closeClueWin);
  w.el.classList.add("clue-win");
  desktopEl.appendChild(w.el);
  makeFloatDraggable(w.el, false);
  clueWinEl = w.el;
  refreshClueWin();
}
/* 册中条目（与证物袋共用 stored 机制：收纳 = 离开画布，只留一条清单记录） */
function ledgerItems(){
  return Object.values(G.nodes).filter(n => n.stored && n.storedIn === "LEDGER");
}
function ledgerStore(key){
  const n = G.nodes[key];
  if (!n || n.stored) return false;
  if (n.kind !== "clue"){ toast("只有线索能收进线索册", true); return false; }
  pushHistory();
  n.stored = true; n.storedIn = "LEDGER"; n.pinned = false;
  recomputeHidden(); layout(); render(); refreshClueWin();
  return true;
}
function ledgerTake(key){
  const n = G.nodes[key];
  if (!n || n.storedIn !== "LEDGER") return false;
  /* 案件窗关着时不能取：取出是放回画布的操作，不能对看不见的画布施展 */
  if (!requireCase()) return false;
  pushHistory();
  n.stored = false; n.storedIn = null; n.hidden = false; markFresh(n);
  /* 取回到线索册图标附近的画布位置（屏幕坐标换算成世界坐标） */
  const icon = document.getElementById("clue-icon");
  if (icon){
    const r = icon.getBoundingClientRect();
    const wpt = toWorld(r.left + r.width / 2, r.top - 40);
    n.x = wpt.x; n.y = wpt.y;
  }
  layout(); render(); refreshClueWin();
  return true;
}
/* 排序键 = 五感顺序（SENSES 的键序）* 1000 + 线索在数据里的书写顺序，等价于「先按感官、再按原序」 */
function ledgerRank(id){
  const order = Object.keys(SENSES), ti = order.indexOf((CLUES[id] || {}).type);
  return (ti < 0 ? order.length : ti) * 1000 + Object.keys(CLUES).indexOf(id);
}
function ledgerList(){
  return ledgerItems().sort((a, b) => ledgerRank(a.id) - ledgerRank(b.id));
}
/* 把镜头拉到某个节点上（档案的 gotoScene 同款算法，按节点宽度取心） */
function centerOnNode(n){
  const r = stage.getBoundingClientRect();
  view.x = r.width / 2 - (n.x + (NODE_W[n.kind] || 152) / 2) * view.k;
  view.y = r.height / 2 - (n.y + 27) * view.k;
  applyView();
}
function refreshClueWin(){
  if (!clueWinEl) return;
  const body = clueWinEl.querySelector(".syswin-body");
  if (!body) return;
  body.innerHTML = "";
  const items = ledgerList();
  if (!items.length){
    const d = document.createElement("div");
    d.className = "bag-empty";
    d.textContent = "（空）把画布上的线索拖到这里收纳";
    body.appendChild(d);
    return;
  }
  items.forEach(n => {
    const c = CLUES[n.id] || {};
    const d = document.createElement("div");
    d.className = "goto-item";
    const box = document.createElement("span"); box.className = "nm";
    const lb = document.createElement("span"); lb.className = "lb"; lb.textContent = c.label || n.label;
    box.appendChild(lb);
    if (c.desc){
      const ds = document.createElement("span"); ds.className = "ds"; ds.textContent = c.desc;
      box.appendChild(ds);
    }
    const st = document.createElement("span"); st.className = "st sense";
    st.textContent = SENSES[c.type] || "";
    d.appendChild(box); d.appendChild(st);
    makeLedgerRowDraggable(d, n.key);
    body.appendChild(d);
  });
}
/* 点一行 = 取回画布：放回图标旁、镜头拉到它身上并选中 */
function takeFromLedger(key){
  if (!requireCase()) return false;
  const n = G.nodes[key];
  if (!n || !ledgerTake(key)) return false;
  centerOnNode(n); selectNode(n.key);
  return true;
}

/* ---- 册中一行直拖推演器：按住行拖到桌布（或推演器图标）上松手 = 归位 ----
   落点判定与画布拖拽同源（桌布 + infer-icon）；拖动中给落点打 over 高亮。
   纯点击仍是取回画布 —— 拖过的那一下吞掉紧跟的 click，两个动作不连发。 */
function overMatrixDrop(cx, cy){
  const bd = inferWinEl ? inferWinEl.querySelector(".mx-board") : null;
  if (bd){
    const r = bd.getBoundingClientRect();
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) return true;
  }
  const ic = document.getElementById("infer-icon");
  if (ic){
    const r = ic.getBoundingClientRect();
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) return true;
  }
  return false;
}
/* ---- 反向：桌布上的 chip 拖回线索册（与「册 → 桌布」对称的那一半）----
   落点 = 线索册窗（开着时）或线索册图标；两个都没命中才退回「拖出桌布 = 取回画布」。 */
function overLedgerDrop(cx, cy){
  if (clueWinEl && clueWinEl.style.display !== "none"){
    const r = clueWinEl.getBoundingClientRect();
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) return true;
  }
  const ic = document.getElementById("clue-icon");
  if (ic){
    const r = ic.getBoundingClientRect();
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) return true;
  }
  return false;
}
/* 桌布 → 册：把归位的线索**改写收纳位置**（storedIn MATRIX → LEDGER），并从阵列里摘掉。
   不能复用 ledgerStore —— 它对 `n.stored` 的节点直接 return false，而归位的线索正是 stored 状态。
   与 assignClue / boardTake 同款：只重画、**不跑 layout()**（归位一个线索不该顺手重排玩家的摆位）。 */
function boardToLedger(cid, sense){
  const n = nodeByKey("clue", cid);
  if (!n) return false;
  if (!requireCase()){ refreshInferWin(); return false; }
  pushHistory();
  G.matrix[sense] = (G.matrix[sense] || []).filter(x => x !== cid);
  n.stored = true; n.storedIn = "LEDGER"; n.pinned = false;
  render(); refreshInferWin(); refreshClueWin();
  return true;
}
/* 归位 = 直接从册子搬上桌布（复用 assignClue：它认 G.nodes 里任何线索，不管现在收在哪儿；
   storedIn 从 LEDGER 改写成 MATRIX，撤销栈照记，render() 顺手把册窗清单刷成少一行）。 */
function ledgerToMatrix(key){
  const n = G.nodes[key];
  if (!n || n.storedIn !== "LEDGER") return false;
  const sense = (CLUES[n.id] || {}).type;
  if (!sense){ toast("这条线索没有感官类型，上不了桌布", true); return false; }
  if (!requireCase()) return false;
  return assignClue(key, sense);
}
/* 行上的指针拖拽：镜像**不克隆行** —— 一旦拖离册子就以「节点块」现身
   （mx-chip.node，与桌布上的归位 chip 同款观感），居中跟手（#drag-layer）；
   松手在落点外 = 弹回册中（无动作）。 */
function makeLedgerRowDraggable(row, key){
  let dragging = false, moved = false, wasMoved = false, sx = 0, sy = 0,
      mirror = null, mw = 0, mh = 0, sr = null;
  const clearOver = () => {
    const bd = inferWinEl ? inferWinEl.querySelector(".mx-board") : null;
    if (bd) bd.classList.remove("over");
    const ic = document.getElementById("infer-icon");
    if (ic && ic.classList) ic.classList.remove("over");
  };
  /* 被 render() 打断时的收尾（见 07-render.js 的登记表）：摘镜像、把行放回来 */
  const abortRowDrag = () => {
    if (!dragging) return;
    dragging = false;
    if (mirror){ mirror.remove(); mirror = null; }
    row.style.visibility = "";
    clearOver();
  };
  row.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    dragging = true; moved = false; wasMoved = false; sx = e.clientX; sy = e.clientY;
    sr = desktopEl.getBoundingClientRect();
    registerDrag(abortRowDrag);
    try { row.setPointerCapture(e.pointerId); } catch(_){}
  });
  row.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    moved = true;
    if (!mirror){
      const layer = document.getElementById("drag-layer");
      const n = G.nodes[key], c = CLUES[n.id] || {};
      mirror = document.createElement("div");
      mirror.className = "mx-chip node ent-node ent-clue drag-mirror";
      mirror.innerHTML = "<div class='n-title'>" + esc(c.label || n.label) + "</div><div class='n-sub'>线索</div>";
      mirror.style.position = "absolute";
      mirror.style.width = "140px";
      layer.appendChild(mirror);
      mw = mirror.offsetWidth || 140; mh = mirror.offsetHeight || 40;
      row.style.visibility = "hidden";
    }
    mirror.style.left = (e.clientX - sr.left - mw / 2) + "px";
    mirror.style.top  = (e.clientY - sr.top  - mh / 2) + "px";
    const bd = inferWinEl ? inferWinEl.querySelector(".mx-board") : null;
    if (bd){
      const r = bd.getBoundingClientRect();
      bd.classList.toggle("over", e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom);
    }
  });
  const finish = e => {
    if (!dragging) return;
    dragging = false;
    unregisterDrag(abortRowDrag);
    if (mirror){ mirror.remove(); mirror = null; }
    row.style.visibility = "";
    clearOver();
    if (moved) wasMoved = true;
    if (!moved || !e) return;
    if (overMatrixDrop(e.clientX, e.clientY)) ledgerToMatrix(key);
  };
  row.addEventListener("pointerup", finish);
  row.addEventListener("pointercancel", () => { unregisterDrag(abortRowDrag); abortRowDrag(); });
  /* 点击 = 取回画布；刚拖完的那一下（wasMoved）不算点击 */
  row.addEventListener("click", () => {
    if (wasMoved){ wasMoved = false; return; }
    takeFromLedger(key);
  });
}

/* ============ ROSTER // 人物：名册 ============
   两部分：
   · **常驻成员**（TEC / 执行者）—— 一进游戏就在册，不靠「已结识」判定。他们不是「遇到的人」，
     而是随时可用的两个角色；也没有画布节点，所以点一行 = **打开各自的窗**（助手窗 / 逻辑阵列）。
   · **遇到的人** —— 已结识 = 画布上有节点 ∪ 文本里点过名 ∪ 在已探索的场景里说过话；
     点一行 = 把人叫到画面中央、选中，并接着说下一句（没有节点就补一个）。
   每行左侧一个小头像：有美术稿用像素图，没有的用「首字方块」占位（2026-10-14 用户决定）。 */
let peopleWinEl = null;
function closePeopleWin(){ if (peopleWinEl){ peopleWinEl.remove(); peopleWinEl = null; } }
function togglePeopleWin(){
  if (peopleWinEl){ closePeopleWin(); return; }
  const w = makeWindow("ROSTER // 人物", closePeopleWin);
  w.el.classList.add("people-win");
  desktopEl.appendChild(w.el);
  makeFloatDraggable(w.el, false);
  peopleWinEl = w.el;
  refreshPeopleWin();
}
/* 常驻成员：一进游戏就在名册里。id 就是名册里的键 —— 执行者没有 CHARS 条目也没关系，
   name / desc 就地写死；TEC 则从数据里取（保持可编辑）。
   open = 点这一行做什么（两者都没有画布节点，所以是「开窗」而不是「叫到画布上」）。
   toggleTecWin / toggleInferWin 都是函数声明，同处一个 <script>，提升后可直接引用。 */
const ROSTER_PINNED = [
  { id: "CHARS_TEC",  tag: "助手窗",   open: toggleTecWin },
  { id: "CHARS_EXEC", tag: "逻辑阵列", open: toggleInferWin,
    name: "执行者", desc: "逻辑阵列中央的执行者，长按 2.5 秒激活归因。" }
];
/* 小头像：TEC / 执行者复用各自窗里的那一张（同一份素材）。rosterAvatar 返回的是
   「完整可用的 src」（构建时由素材占位符换成 assets/ 外链或 data: 内联）。
   剧情角色暂无美术稿 ⇒ 返回 null，名册改用「首字方块」占位。
   拿到图后：把图放进 src/assets/，在下面按 id 补一行素材占位符（写法与 11-dialog.js 里
   `TEC_AVATAR` 那行完全一样）即可。
   ⚠ 两条坑：① 本函数必须**惰性读取**常量 —— 所有切片拼进同一个 <script>，而
   `EXECUTOR_AVATAR` 定义在 13-matrix.js（本文件之后），顶层直接引用会踩 TDZ。
   ② 任何**注释里也不要写素材占位符的字面量**：build.js 是对整段源码做替换的，
   注释同样会被扫到，守卫会以「素材名不合法」直接中止构建。 */
function rosterAvatar(id){
  if (id === "CHARS_TEC")  return TEC_AVATAR;
  if (id === "CHARS_EXEC") return EXECUTOR_AVATAR;
  return null;
}
/* 常驻在前、遇到的在后；CHARS_TEC 已在常驻里，从「遇到的人」里排除，免得排两遍 */
function metChars(){
  const ids = new Set();
  Object.keys(G.nodes).forEach(k => { if (k.indexOf("char:") === 0) ids.add(k.slice(5)); });
  G.seenTexts.forEach(txt => parseTags(txt).forEach(t => { if (t.kind === "char" && CHARS[t.id]) ids.add(t.id); }));
  G.explored.forEach(sid => Object.keys(CHARS).forEach(id => {
    if ((CHARS[id].sceneTalks || {})[sid]) ids.add(id);
  }));
  return ROSTER_PINNED.map(p => p.id)
    .concat(Object.keys(CHARS).filter(id => id !== "CHARS_TEC" && ids.has(id)));
}
/* 对话进度：有节点就按真实队列算（含场景对白），没节点时退回基础队列 */
function charProgress(id){
  const n = nodeByKey("char", id);
  if (n) return { prog: G.talkProg[n.key] || 0, total: charTalkQueue(n).length };
  const base = ((CHARS[id] || {}).talkQueue) || [];
  return { prog: 0, total: base.filter(Boolean).length };
}
function refreshPeopleWin(){
  if (!peopleWinEl) return;

  body.innerHTML = "";

    body.appendChild(d);
    return;
  }
  list.forEach(id => {
    const pin = ROSTER_PINNED.find(p => p.id === id);
    const ch = CHARS[id] || {};
    const name = (pin && pin.name) || ch.name || id;
    const pr = pin ? null : charProgress(id);   /* 常驻成员不走对话进度（他们的词在各自的窗里） */
    const d = document.createElement("div");
    d.className = "goto-item" + ((pr && pr.total && pr.prog >= pr.total) ? " done" : "");
    /* 小头像：有美术稿用像素图，没有的用「首字方块」占位 */
    const av = document.createElement("span"); av.className = "av";
    const art = rosterAvatar(id);
    if (art){

    } else {
