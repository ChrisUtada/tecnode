      av.appendChild(ini);
    }
    const box = document.createElement("span"); box.className = "nm";
    const lb = document.createElement("span"); lb.className = "lb"; lb.textContent = name;
    box.appendChild(lb);
    const ds = document.createElement("span"); ds.className = "ds"; ds.textContent = (pin && pin.desc) || ch.desc || "";
    box.appendChild(ds);
    const st = document.createElement("span"); st.className = "st";
    /* 对话状态只给状态词不给条数（用户要求 UI 上不出现 x/y 计数） */
    st.textContent = pin ? pin.tag
      : (pr.total ? (pr.prog >= pr.total ? "已聊完" : (pr.prog ? "可继续" : "未交谈")) : "无对话文本");
    d.appendChild(av); d.appendChild(box); d.appendChild(st);
    d.addEventListener("click", () => { if (pin) pin.open(); else gotoChar(id); });
    body.appendChild(d);
  });
}
/* 点一行 = 把角色叫到画面中央、选中，然后接着说下一句 */
function gotoChar(id){
  if (!requireCase()) return;
  const ch = CHARS[id] || {};
  let n = nodeByKey("char", id);
  if (!n){
    pushHistory();
    n = ensureNode("char", id, { label: ch.name || id });
    if (!n.homeScene) n.homeScene = G.lastScene || null;
    layout(); render();
  }
  if (n.stored) bagTake(n.key);
  centerOnNode(n); selectNode(n.key);
  if (!charTalkQueue(n).length){ toast("<b>" + esc(ch.name || id) + "</b><br>（暂无对话文本）"); return; }
  showCharLine(n);
}

/* ============ INFERENCE_MATRIX // 逻辑阵列 ============ */
/* ============ 逻辑阵列：桌布式推演窗 ============
   桌布几何与 CSS .mx-board 的尺寸对应（DOM stub 里 offsetWidth 是常量，量不出真尺寸时退回这两个值）。
   560×420：去掉文字标签后窗体收边，但**五芒星绝对大小不变**——顶点间距与 640×460 版一致，
   仅整体平移（水平 -40px、垂直 -20px）重新居中：五芒星**形心与桌布中心重合**，
   这样中央头像正好坐在星的中枢上（五芒星横跨 332px、纵跨 316px，是窗体缩小的物理下限）。 */
const MX_W = 560, MX_H = 420;
/* 星阵外圆半径：五感顶点外接圆(≈175) + 20 缓冲，圆心 = 桌布中心 = 五芒星形心。
   外圆与五芒星合成一条路径（先圆后星），常显框与长按描线共用。 */
const MX_CIRCLE_R = 195;
/* 五感锚点：环绕中央执行者的方位（桌布宽高的分数）。数值按 560×420 反推：
   顶点（卡中心）= (MX_ANCHORS.xy × 桌布) + 27px 卡占位，换算后与原 640×460 版的顶点绝对坐标一致。 */
/* 五感锚点：以「卡片中心」近似正五边形（桌布坐标下半径≈137px，绕板心 72° 均布）摆放，
   这样证据（卡片中心）正好是五芒星的五个顶点。锚点 top 已减去卡片占位（≈27px）：
   去掉文字标签后 chip 从锚点顶起，margin4 + 半卡高23 即中心偏移。 */
const MX_ANCHORS = { vision:[.5000,.0192], hearing:[.7971,.3073], touch:[.6840,.7727], smell:[.3160,.7727], taste:[.2029,.3073] };
/* 执行者头像：暂借 TEC 的（同风格同尺寸），新头像做好只改这一行 */
const EXECUTOR_AVATAR = "assets/executor-avatar.png";
/* 执行者表情：配方不匹配时在头像上方弹出（心碎，16×16 像素，含气泡框） */
const EXEC_EMOTE_HEARTBROKEN = "assets/emote-heartbroken.png";

let inferWinEl = null;
function closeInferWin(){ if (inferWinEl){ inferWinEl.remove(); inferWinEl = null; } }
function toggleInferWin(){
  if (inferWinEl){ closeInferWin(); return; }
  const w = makeWindow("INFERENCE // 逻辑阵列", closeInferWin);
  w.el.classList.add("infer-win");
  desktopEl.appendChild(w.el);
  makeFloatDraggable(w.el, false);
  inferWinEl = w.el;
  refreshInferWin();
}
/* 阵列内的线索卡：**拖出桌布 = 取回画布**（与外部「拖进拖出」一致，卡上不放 ×）。
   桌布 overflow:hidden，所以拖动时把卡片克隆到全局 #drag-layer 跟随指针，松手落在桌布外即取回。 */
function makeMatrixNodeDraggable(card, cid, sense){
  let dragging = false, moved = false, sx = 0, sy = 0, mirror = null, offx = 0, offy = 0, sr = null;
  /* 拖出桌布的方向：**线索册（窗 / 图标）也是落点** —— 与「册 → 桌布」对称的那一半 */
  const clearDropOver = () => {
    if (clueWinEl && clueWinEl.classList) clueWinEl.classList.remove("over");
    const ic = document.getElementById("clue-icon");
    if (ic && ic.classList) ic.classList.remove("over");
  };
  /* 被 render() 打断时的收尾（见 07-render.js 的登记表）：摘镜像、把卡片放回来 */
  const abortCardDrag = () => {
    if (!dragging) return;
    dragging = false;
    card.classList.remove("dragging");
    if (mirror){ mirror.remove(); mirror = null; }
    card.style.visibility = "";
    clearDropOver();
  };
  card.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY;
    sr = desktopEl.getBoundingClientRect();
    registerDrag(abortCardDrag);
    try { card.setPointerCapture(e.pointerId); } catch(_){}
    e.stopPropagation();
  });
  card.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    moved = true;
    card.classList.add("dragging");
    if (!mirror){
      const layer = document.getElementById("drag-layer");
      const r = card.getBoundingClientRect();
      offx = e.clientX - r.left; offy = e.clientY - r.top;
      mirror = card.cloneNode(true);
      mirror.classList.add("drag-mirror");
      mirror.classList.remove("dragging");
      mirror.style.position = "absolute";
      mirror.style.transform = "none";
      mirror.style.width = r.width + "px"; mirror.style.height = r.height + "px";
      mirror.style.left = (r.left - sr.left) + "px";
      mirror.style.top  = (r.top  - sr.top ) + "px";
      mirror.style.visibility = "hidden";
      layer.appendChild(mirror);
      card.style.visibility = "hidden";
      void mirror.offsetWidth;             /* 强制布局，显示即正确位置 */
      mirror.style.visibility = "visible";
    }
    mirror.style.left = (e.clientX - offx - sr.left) + "px";
    mirror.style.top  = (e.clientY - offy - sr.top ) + "px";
    /* 线索册落点高亮（窗开着 / 图标常驻，谁被压中就亮谁） */
    const lw = clueWinEl;
    if (lw && lw.classList){
      const r = lw.getBoundingClientRect();
      lw.classList.toggle("over", e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom);
    }
    const lic = document.getElementById("clue-icon");
    if (lic && lic.classList){
      const r = lic.getBoundingClientRect();
      lic.classList.toggle("over", e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom);
    }
  });
  const finish = e => {
    if (!dragging) return;
    dragging = false;
    unregisterDrag(abortCardDrag);
    card.classList.remove("dragging");
    if (mirror){ mirror.remove(); mirror = null; }
    card.style.visibility = "";
    clearDropOver();
    if (!moved) return;                    /* 纯点击，不移除 */
    /* 落在线索册上 → 改归册子（回头路有两条：回画布 / 回册子） */
    if (overLedgerDrop(e.clientX, e.clientY)){ boardToLedger(cid, sense); return; }
    const bd = inferWinEl && inferWinEl.querySelector(".mx-board");
    if (bd){
      const r = bd.getBoundingClientRect();
      const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      if (!inside){                        /* 拖出桌布 → 取回画布 */
        boardTake(cid, sense, e.clientX, e.clientY);
        return;
      }
    }
    refreshInferWin();                     /* 仍在桌布内：复位 */
  };
  card.addEventListener("pointerup", finish);
  card.addEventListener("pointercancel", () => { unregisterDrag(abortCardDrag); abortCardDrag(); });
}
function refreshInferWin(){
  if (!inferWinEl) return;
  const body = inferWinEl.querySelector(".syswin-body");
  if (!body) return;
  body.innerHTML = "";

  const board = document.createElement("div");
  board.className = "mx-board";
  body.appendChild(board);
  const bw = board.offsetWidth || MX_W, bh = board.offsetHeight || MX_H;
  const cx = bw / 2, cy = bh / 2;

  /* 连线层铺在最底：放五芒星描线（faint 框常显，长按时描出亮线） */
  const links = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  links.setAttribute("class", "mx-links");
  links.setAttribute("width", bw); links.setAttribute("height", bh);
  board.appendChild(links);

  /* 五感锚点 + 归位线索 chip（同感官按序向下叠；连线终点用解析坐标，不量 DOM） */
  const verts = {};   /* 五感星形顶点（board 坐标）：证据落在哪，五芒星就连到哪 */
  Object.keys(SENSES).forEach(sense => {
    const a = MX_ANCHORS[sense];
    const ax = a[0] * bw, ay = a[1] * bh;
    const anchor = document.createElement("div");
    anchor.className = "mx-anchor";
    anchor.style.left = ax + "px"; anchor.style.top = ay + "px";
    anchor.title = SENSES[sense];   /* 无文字标签：感官名只进 tooltip，不进排布 */
    const list = G.matrix[sense];
    let child = null;
    if (list.length){
      list.forEach((cid, i) => {
        const chip = document.createElement("div");
        let cls = "mx-chip node ent-node ent-clue";
        if (G.captured.has(cid)) cls += " got";
        chip.className = cls;
        chip.title = "拖出桌布 = 取回画布；拖到线索册 = 收进册子";   /* 回头路两条：回画布 / 回册子 */
        /* 归位 = 线索搬到了桌布上（画布上那份已经收走），所以这里说「已归位」，
           与画布上那枚「线索 · 已捕获」分开说 —— 两者是两个地方的两个状态 */
        const sub = G.captured.has(cid) ? "线索 · 已归位" : "线索";
        chip.innerHTML = "<div class='n-title'>" + esc((CLUES[cid] || {}).label || cid) + "</div>" +
                        "<div class='n-sub'>" + esc(sub) + "</div>";
        anchor.appendChild(chip);
        if (i === 0) child = chip;   /* 顶点取该感官第一条线索的中心 */
        makeMatrixNodeDraggable(chip, cid, sense);
      });
    }
    board.appendChild(anchor);
    /* 记录该感官的星形顶点：用卡片实测中心；stub 量不出时退回解析坐标（锚点+27） */
    const cr = child ? child.getBoundingClientRect() : null;
    const br = board.getBoundingClientRect();
    verts[sense] = (cr && cr.width) ? { x: cr.left + cr.width / 2 - br.left, y: cr.top + cr.height / 2 - br.top }
                                    : { x: ax, y: ay + 27 };
  });

  /* 星阵 = 外圆 + 五芒星，合成一条路径：常显虚线框与长按描线都包含它。
     蓄力时按路径顺序描绘——先描外圆（划定法阵），再描五芒星（建立逻辑归因）。
     外圆半径 = 五感顶点外接圆(≈175) + 20 缓冲；圆心 = 桌布中心 = 五芒星形心。 */
  const STAR_ORDER = ["vision","touch","taste","hearing","smell"];   /* 顺时针 视觉→触觉→味觉→听觉→嗅觉 */
  const pts = STAR_ORDER.map(s => verts[s]).filter(Boolean);
  if (pts.length === 5){
    let d = "M" + (cx - MX_CIRCLE_R) + " " + cy +
            " a" + MX_CIRCLE_R + "," + MX_CIRCLE_R + " 0 1,1 " + (MX_CIRCLE_R * 2) + ",0" +
            " a" + MX_CIRCLE_R + "," + MX_CIRCLE_R + " 0 1,1 " + (-MX_CIRCLE_R * 2) + ",0";
    d += " M" + pts[0].x + " " + pts[0].y;
    for (let i = 1; i < pts.length; i++) d += " L" + pts[i].x + " " + pts[i].y;
    d += " Z";
    const frame = document.createElementNS("http://www.w3.org/2000/svg", "path");
    frame.setAttribute("class", "mx-star-frame");
    frame.setAttribute("d", d);
    links.appendChild(frame);
    const draw = document.createElementNS("http://www.w3.org/2000/svg", "path");
    draw.setAttribute("class", "mx-star-draw");
    draw.setAttribute("d", d);
    draw.setAttribute("pathLength", "100");   /* 归一化长度 → dasharray:100 即整条线 */
    links.appendChild(draw);
  }

  /* 中央执行者：长按激活归因 */
  const exec = document.createElement("div");
  exec.className = "mx-exec";
  exec.title = "长按 2.5 秒激活归因";
  const av = document.createElement("div"); av.className = "mx-avatar";
  const img = document.createElement("img");
  img.src = EXECUTOR_AVATAR;
  img.alt = "执行者"; img.draggable = false;
  av.appendChild(img);
  exec.appendChild(av);   /* 执行者只留头像：头像即五芒星中枢，标签/提示已移除 */
  exec.addEventListener("pointerdown", riteStart);
  board.appendChild(exec);

  /* 「确认捕获」之后的余韵：执行者头顶挂一枚没种下的种子（对话框）。
     显隐只看 G.garden.seed —— 窗重开 / 每次重绘都从这里重建，不是一次性 DOM：
     种子没被拖进花园之前，关掉推理窗再打开，对话框还在。 */
  if (G.garden && G.garden.seed) exec.appendChild(buildSeedPop());
}

/* ============ 种子对话框（「确认捕获」落定 → 花园的前奏） ============
   位置与心碎表情同款（.mx-exec 上方），但不自动消失：种子拖进花园才收走。
   气泡里**只有一张种子图**，没有任何文字 —— 要说的都由画面说了。
   **拖拽把手 = 种子图本身**（用户口径）：按在图上才算搬运，气泡白卡的空白处拖不动。
   指针捕获与监听必须下在**同一个元素**（下面 handle）—— 捕获会把 pointermove / up
   重定向到捕获元素，挂在别人身上就收不到移动。落进花园窗 / 花园图标 = 下种
   （gardenPlant，16-cases.js），落在别处 = 弹回原位。 */
function buildSeedPop(){
  const pop = document.createElement("div");
  pop.className = "mx-seedpop";
  pop.title = "拖动种子，种进花园";
  const im = document.createElement("img");
  im.src = GARDEN_IMG.seed;
  im.alt = "花魄的种子"; im.draggable = false;
  im.title = "拖到花园里种下";
  pop.appendChild(im);
  makeSeedDraggable(pop, im);
  return pop;
}
function makeSeedDraggable(pop, handle){
  const h = handle || pop;                 /* 把手缺省退整块（老调用点兼容） */
  let dragging = false, moved = false, sx = 0, sy = 0, mirror = null, offx = 0, offy = 0, sr = null;
  /* 被 render() 打断时的收尾（见 07-render.js 的登记表）：摘镜像、把原气泡放回来 */
  const abortSeedDrag = () => {
    if (!dragging) return;
    dragging = false;
    pop.classList.remove("dragging");
    if (mirror){ mirror.remove(); mirror = null; }
    pop.style.visibility = "";
  };
  h.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY;
    sr = desktopEl.getBoundingClientRect();
    registerDrag(abortSeedDrag);
    try { h.setPointerCapture(e.pointerId); } catch(_){}
    e.stopPropagation();
  });
  h.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    moved = true;
    pop.classList.add("dragging");
    if (!mirror){
      const layer = document.getElementById("drag-layer");
      /* 跟手的是**种子图本身**（用户口径）——镜像只克隆那张图，不是整块白卡气泡 */
      const r = h.getBoundingClientRect();
      offx = e.clientX - r.left; offy = e.clientY - r.top;
      mirror = h.cloneNode(true);
      mirror.className = "mx-seed-mirror drag-mirror";
      mirror.style.position = "absolute"; mirror.style.transform = "none";
      /* 尺寸取**布局**尺寸（offsetWidth），不取 rect：种子气泡带着 pop 缩放动画（scale .6→1），
         动画没走完就起拖时 rect 量到的是缩放后的值（实测 32 → 19）。 */
      mirror.style.width = (h.offsetWidth || 32) + "px";
      mirror.style.height = (h.offsetHeight || 32) + "px";
      mirror.style.left = (r.left - sr.left) + "px";
      mirror.style.top  = (r.top  - sr.top ) + "px";
      mirror.style.visibility = "hidden";
      layer.appendChild(mirror);
      pop.style.visibility = "hidden";     /* 原气泡（含白卡）整体隐去，画面上只剩跟手的种子 */
      void mirror.offsetWidth;             /* 强制布局，显示即正确位置 */
      mirror.style.visibility = "visible";
    }
    mirror.style.left = (e.clientX - offx - sr.left) + "px";
    mirror.style.top  = (e.clientY - offy - sr.top ) + "px";
  });
  const finish = e => {
    if (!dragging) return;
    dragging = false;
    unregisterDrag(abortSeedDrag);
    pop.classList.remove("dragging");
    if (mirror){ mirror.remove(); mirror = null; }
    pop.style.visibility = "";
    if (!moved) return;                    /* 纯点击：不动 */
    if (overGardenDrop(e.clientX, e.clientY)){ gardenPlant(e.clientX, e.clientY); return; }
    refreshInferWin();                     /* 没拖进花园：弹回原位（对话框照旧） */
  };
  h.addEventListener("pointerup", finish);
  h.addEventListener("pointercancel", () => { unregisterDrag(abortSeedDrag); abortSeedDrag(); });
}

/* 长按蓄力：pointerdown 起 2.5s 完成 → executeInference；pointerup / pointerleave 提前 = 中断复位。
   无头环境 setTimeout 返回 0 就立即完成（与 enterCase 换档的兜底同款）。 */
let riteTimer = null;
function riteEnd(commit){
  if (riteTimer){ clearTimeout(riteTimer); riteTimer = null; }
  if (inferWinEl){
    const ex = inferWinEl.querySelector(".mx-exec");
    if (ex){
      ex.classList.remove("charging");
      if (ex._riteOff){
        ex.removeEventListener("pointerup", ex._riteOff);
        ex.removeEventListener("pointerleave", ex._riteOff);
        ex._riteOff = null;
      }
    }
    const bd = inferWinEl.querySelector(".mx-board");
    if (bd) bd.classList.remove("charging");
  }
  if (commit) executeInference();
}
function riteStart(e){
  if (e && e.button !== 0) return;
  if (!inferWinEl || riteTimer) return;
  const ex = inferWinEl.querySelector(".mx-exec");
  if (!ex) return;
  ex.classList.add("charging");
  const bd = inferWinEl.querySelector(".mx-board");
  if (bd) bd.classList.add("charging");   /* 描星与头像震颤起；窗体不抖（窗口震动只属于真名结局） */
  const t = setTimeout(() => riteEnd(true), 2500);
  if (!t){ riteEnd(true); return; }
  riteTimer = t;
  const off = () => riteEnd(false);
  ex._riteOff = off;
  ex.addEventListener("pointerup", off);
  ex.addEventListener("pointerleave", off);
}
/* 归位 = 把这枚线索**从画布收进桌布**（与证物袋 / 线索册共用 stored 机制，storedIn === "MATRIX"）。
   桌布自己就是这份线索的清单 —— 归位后画布上不该再留一份：
   「拖上台」和「拖进袋 / 册」在玩家手里是同一个动作，落下之后节点也该同样消失。
   回头路只有一条：把桌布上的 chip 拖出去（boardTake）。 */
const MATRIX_STORE = "MATRIX";
function matrixItems(){ return Object.values(G.nodes).filter(n => n.stored && n.storedIn === MATRIX_STORE); }
function assignClue(clueKey, sense){
  const n = G.nodes[clueKey];
  if (!n || n.kind !== "clue") return false;
  const c = CLUES[n.id];
  if (!c || c.type !== sense){ toast("「" + esc(n.label) + "」的感官类型不是" + SENSES[sense], true); return false; }
  if (G.matrix[sense].indexOf(n.id) >= 0) return false;
  pushHistory();
  G.matrix[sense].push(n.id);
  n.stored = true; n.storedIn = MATRIX_STORE; n.pinned = false;
  /* 只重画、**不调 layout()**：收纳入袋 / 入册那两处会顺手跑 260 轮弹簧迭代，
     把画布上**别的**节点全推走（真机实测：18 个节点全动，最大 210px、平均 64px）——
     那正是「自动布局」按钮被删掉的那个毛病。归位一个线索不该顺手重排玩家的摆位。 */
  render(); refreshInferWin();
  return true;
}
/* 拖出桌布 = 取回画布。归位时线索已经离开画布，这里是唯一的回头路。
   落在哪儿就放回哪儿（松手那一点换算成世界坐标，卡片中心对着指针），镜头不抢，只亮一次「新」。
   案件窗关着时取不回来 —— 与 bagTake / ledgerTake 同一条门（取出是往画布上放东西的动作）。 */
function boardTake(cid, sense, cx, cy){
  const n = nodeByKey("clue", cid);
  if (!n) return false;
  if (!requireCase()){ refreshInferWin(); return false; }
  pushHistory();
  G.matrix[sense] = G.matrix[sense].filter(x => x !== cid);
  n.stored = false; n.storedIn = null; n.hidden = false; n.pinned = false; markFresh(n);
  if (cx != null && cy != null){
    /* 先换成世界坐标、**再**减去半张卡 —— 卡片尺寸是世界单位，不能在屏幕坐标里先减：
       镜头缩放 k≠1 时两者差一个 k 倍（k=0.35 时落点会偏出 120 多世界像素，实测被 verify 逮住） */
    const wpt = toWorld(cx, cy);
    n.x = wpt.x - (NODE_W.clue || 130) / 2; n.y = wpt.y - (NODE_H.clue || 46) / 2;
  }
  render(); refreshInferWin();
  return true;
}
/* 配方不匹配：头像上方弹心碎表情（1.4s 自动消失；连发时先撤旧的再弹，重置动画） */
function showExecEmote(){
  if (!inferWinEl) return;
  const ex = inferWinEl.querySelector(".mx-exec");
  if (!ex) return;
  const old = ex.querySelector(".mx-emote");
  if (old) old.remove();
  const em = document.createElement("div");
  em.className = "mx-emote";
  const im = document.createElement("img");
  im.src = EXEC_EMOTE_HEARTBROKEN;
  im.alt = "心碎"; im.draggable = false;
  em.appendChild(im);
  ex.appendChild(em);
  setTimeout(() => em.remove(), 1500);
}
function executeInference(){
  const inMatrix = new Set();
  Object.keys(G.matrix).forEach(s => G.matrix[s].forEach(id => inMatrix.add(id)));
  const hit = ENDINGS.find(e => {
    const r = e.recipe || [];
    return r.length === inMatrix.size && r.every(id => inMatrix.has(id));
  });
  if (hit){ refreshInferWin(); triggerEnding(hit); }
  else { showExecEmote(); log("推演失败：当前阵列不匹配任何结局配方", "warn"); }
}

/* ============ 结局演出（步进状态机：setTimeout 自动推进 / 点击跳过 / 钩子手动推进） ============ */
let endingState = null;
function triggerEnding(ending){
  G.endings.add(ending.id);
  /* 只有捕获「真名」（真结局）才点亮下一案的地址。
     种子**不在这里发**：它要等玩家在结局遮罩上亲手点下「确认捕获」才发（15-desktop.js 的
     遮罩点击分支）—— 演出还没谢幕就先掉奖励，等于把结局的余韵抢在观众离场前倒掉了。 */
  if (ending.isTrueCapture){ unlockNextCase(CASE_ID); }
  log("<b>结局达成：" + esc(ending.name) + "</b>", "cap");
  /* 真名结局：先让推演器整窗冲击震动一拍，再落下结局遮罩 */
  const shock = !!(ending.isTrueCapture && inferWinEl);
  if (shock){
    /* 拖过推演窗的手势会在窗口上留下内联 `animation:none`（makeFloatDraggable 防「pop 动画
       没走完就拖动会错位」那句），而内联样式优先于 .shock 的类动画 —— 只要玩家挪过窗口，
       真名震动就永远不会出现。加震之前先把这条内联清掉，并强制一次 reflow 让动画从 0 起跑。 */
    inferWinEl.style.animation = "";
    void inferWinEl.offsetWidth;
    inferWinEl.classList.add("shock");
    setTimeout(() => { if (inferWinEl) inferWinEl.classList.remove("shock"); }, 1000);
  }
  endingState = { ending, step: 0, stages: buildStages(ending) };
  const t = shock ? setTimeout(playEndingStage, 900) : 0;
  if (!t) playEndingStage();
}
function buildStages(e){
  const st = [];
  (e.lines || []).forEach(l => st.push({ html: esc(l.text), delay: l.delay || 1200 }));
  if (e.isTrueCapture && e.truename) st.push({ html: "<div class='truename'>真名已识别<br>『" + esc(e.truename) + "』</div>", delay: 2000 });
  /* 真名结局的大段「真名形成说明」不放进遮罩播 —— 改为开花后点花、用花园里的叙事框承载
     （16-cases.js 的 openGardenNarr）。其余结局的 message 仍是遮罩主内容，照旧显示。 */
  if (!e.isTrueCapture && e.message) st.push({ html: esc(e.message || ""), delay: 1600 });
  st.push({ html: "<div style='text-align:center'><span class='ebtn'>" + (e.isTrueCapture ? "确认捕获" : "收下这份记录") + "</span></div>", final: true });
  return st;
}
function playEndingStage(){
  const st = endingState; if (!st) return;
  const overlay = document.getElementById("ending-overlay");
  if (st.step >= st.stages.length){ closeEnding(); return; }
  const stage = st.stages[st.step];
  const eol = overlay.querySelector(".eol") || (function(){ const d = document.createElement("div"); d.className = "eol"; overlay.appendChild(d); return d; })();
  const div = document.createElement("div");
  div.innerHTML = stage.html;
  eol.appendChild(div);
  overlay.style.display = "block";
  st.step++;
  if (!stage.final) st.timer = setTimeout(playEndingStage, stage.delay);
}
function closeEnding(){
  const overlay = document.getElementById("ending-overlay");
  overlay.style.display = "none";
  overlay.innerHTML = "";
  endingState = null;
  updateCrumbs();
}

/* ============ 记忆场景放映卡（A-001 日期闪回） ============ */
let memoryPlay = null;
function showMemoryCard(n, s){
  closeNarr();
  const w = makeWindow("MEMORY // " + (s.title || n.id), closeNarr);
  const c = w.el;
  c.className = "narr-card memory syswin";
  c.title = "单击任意位置推进下一行，按住可拖动";
  makeFloatDraggable(c, true);                       /* 整卡可拖（与对话气泡一致），点/拖靠 _dragged 区分 */
  c.addEventListener("click", () => { if (!c._dragged) advanceMemory(); });
  world.appendChild(c);
  anchorAboveOrBelow(c, n, 14);            /* 锚在节点上方，上方放不下则退到下方，不盖节点 */
  narrEl = c;
  const lines = narrText(s.content || s.desc || "").split("\n").map(t => t.trim()).filter(Boolean);
  sceneTags(n.id).forEach(t => {
    if (t.kind !== "char") return;
    const ch = CHARS[t.id];
    const st = ch && (ch.sceneTalks || {})[n.id];
    (st || []).forEach(l => lines.push("——" + (ch.name || t.id) + "：" + plain(l.text || "")));
  });
  memoryPlay = { el: c, body: w.body, lines: lines, idx: 0, typing: false, cur: null, curText: "" };
  playMemoryLine();
}
function playMemoryLine(){
  const mp = memoryPlay;
  if (!mp || !narrEl || mp.el !== narrEl){ memoryPlay = null; return; }
  if (mp.idx >= mp.lines.length){ memoryPlay = null; return; }
  const txt = mp.lines[mp.idx];
  const d = document.createElement("div");
  d.className = txt.startsWith("——") ? "mem-line talk" : "mem-line";
  mp.body.appendChild(d);
  mp.idx++;
  /* 每行也走打字机；打完就停在那儿等玩家点 —— 不再 700ms 自动换行（改成点击推进） */
  mp.typing = true; mp.cur = d; mp.curText = txt;
  typeInto(d, txt, { done: () => { mp.typing = false; } });
}
/* 单次推进：本行还在打字 -> 先补全本句；已打完 -> 换下一行（视觉小说通行做法） */
function advanceMemory(){
  const mp = memoryPlay;
  if (!mp) return false;
  if (mp.typing){
    cancelType(mp.cur);
    if (mp.cur) mp.cur.textContent = mp.curText;
    mp.typing = false;
    return true;
  }
  playMemoryLine();
  return true;
}

/* ============ 详情面板 ============ */
/* 占位内容（清空选中 / 重置）。顺手把签名对上，免得下一次 paintDetail 误判「内容没变」而跳过重绘。 */
function detailPlaceholder(msg){
  const html = "<div class='empty'>" + (msg || "点选任意节点查看信息。") + "</div>";
  detailBody.__sig = html;
  detailBody.innerHTML = html;
}

/* 把「当前选中节点」的实时状态写进 #detail-body。selectNode 会调它，render() 末尾也会调它 ——
   所以点亮台灯 / 捕获线索 / 展开场景 / 推进对话之后，详情窗里那一行「状态」自己就变了，
   不必重新点一下节点（旧版只在点选那一刻渲染一次，所以台灯点亮后详情窗还写着「未点亮」）。
   内容与上次逐字相同就直接跳过，不重建 DOM —— 免得打断 hover、把滚动位置弹回顶部。

   **详情窗只有三种内容：简介（ddesc）/ 状态（drow）/ 来源（drow）。**（2026-10-14 收口）
   刻意不列「容器里装着什么」「谁的正文指向它」「它跟谁有反应」——那是玩家该自己动手
   （展开 / 组合 / 拖给 TEC 分析）试出来的东西，写在详情窗里等于直接递答案。
   唯一例外是「状态」里的**使用条件**（要光 / 要零件 / 开关与否）：那是防瞎试的前馈，不是答案。 */
function paintDetail(){
  const n = sel ? G.nodes[sel] : null;
  if (!n){ detailPlaceholder(sel ? "节点已不存在。" : null); return; }

  let html = "<div class='dt'>" + esc(n.label) + "</div>";
  html += "<div class='dmeta'>" + kindName(n.kind) + "</div>";

  if (isContainerNode(n)){
    /* 用「已探索 / 未探索」，与画布节点副标题（07-render.js）统一 —— 展开是动作，探索才是状态。 */
    html += "<div class='drow'>状态：" + (G.explored.has(n.id) ? "已探索" : "未探索") + "</div>";
    /* 正文只在叙事卡里出现一次；详情窗只给回看入口（去重） */
    if (G.explored.has(n.id))
      html += "<div class='drow'><button id='dt-renarr'>[ " + (n.kind === "loc" ? "重看场景叙事" : "重看叙事") + " ]</button></div>";
  } else if (n.kind === "clue"){
    const c = CLUES[n.id] || {};
    html += "<div class='ddesc'>" + esc(plain(c.desc || "（无描述）")) + "</div>";
    html += "<div class='drow'>状态：" + (G.captured.has(n.id) ? "已捕获" : "未捕获") +
      " · " + (SENSES[c.type] || c.type || "未知") + "</div>";
  } else if (n.kind === "char"){
    const c = CHARS[n.id] || {};
    html += "<div class='ddesc'>" + esc(plain(c.desc || "（无描述）")) + "</div>";
    html += "<div class='drow'>状态：" + ((G.talkProg[n.key] || 0) >= charTalkQueue(n).length ? "已聊完" : "可对话") + "</div>";
  } else {
    /* 物品 */
    const it = ITEMS[n.id] || {};
    /* 物品描述统一由详情窗承载（不论有没有命令）：无命令物品的双击只是选中，
       描述就在详情窗里读 —— 不再靠顶部提示条闪一下。
       文本物（纸条 / 笔记这类）的正文里，被 excerpts 点名的词渲染成可点下划线：点一下就在图上长边。 */
    html += "<div class='ddesc'>" + excerptHtml(plain(it.desc || "（无描述）"), excerptsOf(n.id)) + "</div>";
    /* 「状态」= 使用条件（要光 / 要零件 / 开关与否），合成一行。
       不写「它跟谁有反应」：那正是玩家要自己试的东西。 */
    const st = [];
    const litCmd = (it.commands || []).find(c => c.requiresLit);
    if (litCmd) st.push(lightOn(litCmd.requiresLit) ? "光线充足" : "光线不足，需先点亮光源");
    /* 自己能发光的物品（台灯 / 手电筒）：开关状态；手电筒这类再附一句「要先点亮才能用」 */
    if (isToggleLight(n.id)){
      st.push(n.lit ? "已点亮" : "未点亮");
      if (it.needsLitToUse) st.push(n.lit ? "可照亮黑暗里的东西" : "先点亮它，才能照亮黑暗里的东西");
    }
    /* 装上的零件：命令上的 requires 门要靠它兑现（唱机得先装上唱针，才放得出黑胶） */
    const fitted = Object.keys(n.installed || {}).map(id => labelOf("item", id) || id);
    if (fitted.length) st.push("已装上 " + fitted.join("、"));
    const needFit = [];
    (it.commands || []).forEach(c => (c.requires || []).forEach(pid => {
      if (!(n.installed || {})[pid]) needFit.push(labelOf("item", pid) || pid);
    }));
    if (needFit.length) st.push("待装上 " + [...new Set(needFit)].join("、"));
    if (st.length) html += "<div class='drow'>状态：" + esc(st.join(" · ")) + "</div>";
    /* 唱机装上唱针后：详情里直接给一个播放按钮（音乐随游戏内置，base64 内联） */
    if (n.id === "ITEMS_changji" && n.installed && n.installed["ITEMS_cz"])
      html += "<div class='drow'><button id='dt-play-music'>" + iconSvg("play", 12) + " 播放音乐</button></div>";
  }

  /* 来源：物品 / 容器物品 / 线索 / 人物都可能记着「从哪来」（在哪展开、在哪遇见）。
     **场景不给**：场景之间是叙事链接，不是「谁装下了谁」——而且 homeScene 会被
     最后一次展开的宿主覆盖（实测「植物学家的花园」的来源变成过「尸体」），
     写出来是随机的、纯误导。详情窗自此只剩「简介 / 状态 / 来源」三种内容。 */
  if (n.kind !== "loc" && n.homeScene && containerData(n.homeScene))
    html += "<div class='drow'>来源：" + esc(containerTitle(n.homeScene)) + "</div>";

  if (detailBody.__sig === html) return;     /* 状态没变：原样留着，不动 DOM */
  detailBody.__sig = html;
  detailBody.innerHTML = html;
  const rb = document.getElementById("dt-renarr");
  if (rb) rb.addEventListener("click", () => renarrScene(n.id));
}

/* ============ 摘录：文本物正文里可点的一小段 → 图上长出「目标节点 + 一条连回这张纸的边」 ============
   数据写在 items 那一条上（正文 desc 保持干净、不掺标签，可读性不受影响）：
     "excerpts": [ { "text": "7月4日", "to": "loc:SCENES_0704" }, { "text": "槿杉", "to": "char:CHARS_JS" } ]
   重点是「长出边」而不是「长出节点」：纸上的信息原本只活在玩家脑子里（读完是死胡同），
   现在「读到」这个动作本身把那条边画了出来 —— 于是它进了快照、可撤销、也被枢纽统计认。 */
function excerptsOf(id){
  const list = (ITEMS[id] || {}).excerpts;
  return Array.isArray(list) ? list.filter(e => e && e.text && e.to) : [];
}
/* 按摘录表把命中的词包成可点按钮，其余部分照常转义。
   从左到右扫一遍，重叠的命中以「先出现的、且更长的」为准。 */
function excerptHtml(text, list){
  const t = String(text == null ? "" : text);
  if (!list.length) return esc(t);
  const hits = [];
  list.forEach((ex, i) => {
    const w = String(ex.text);
    for (let at = t.indexOf(w); at >= 0; at = t.indexOf(w, at + w.length)) hits.push({ at, len:w.length, i });
  });
  if (!hits.length) return esc(t);
  hits.sort((a, b) => (a.at - b.at) || (b.len - a.len));
  let out = "", cur = 0;
  hits.forEach(h => {
    if (h.at < cur) return;                                  /* 与已输出的片段重叠：跳过 */
    const key = String(list[h.i].to);
    out += esc(t.slice(cur, h.at));
    out += "<button class='ex" + (G.nodes[key] ? " got" : "") + "' data-ex=\"" + esc(key) + "\">" +
           esc(t.slice(h.at, h.at + h.len)) + "</button>";
    cur = h.at + h.len;
  });
  return out + esc(t.slice(cur));
}
/* 点下划线 = 读到了它：ensureNode（已有就复用）+ 一条 cond 边（连回那张纸）+ noteSeen + 镜头带过去。
   已经摘过的（节点与边都在）不重复长、不记历史 —— 免得连着点几下刷出一堆撤销步。
   **详情窗留在原来那张纸上**：玩家是在文档里读的，连着摘几个词不该被反复踢走
   （目标节点靠「新」角标 + 镜头自动居中告诉他东西长出来了）。 */
function takeExcerpt(target, srcKey){
  if (!requireCase()) return;
  const src = G.nodes[srcKey];
  const i = String(target || "").indexOf(":");
  if (!src || i < 0) return;
  const kind = target.slice(0, i), id = target.slice(i + 1);
  const nm = labelOf(kind, id);
  if (!nm) return;
  const key = kind + ":" + id;
  const isNew = !G.nodes[key];
  const newEdge = !edgeBetween(srcKey, key, "cond");
  if (isNew || newEdge){
    pushHistory();
    const n = ensureNode(kind, id, { label: nm });
    if (isNew) markFresh(n);
    link(srcKey, key, "cond");
    noteSeen(nm);
    settle();
    log("摘录：从「" + esc(src.label) + "」上读到「" + esc(nm) + "」", "act");
  }
  if (sel !== srcKey) selectNode(key);     /* 已经在这张纸上读：留住他，别把详情窗踢走 */
}
/* 委托挂在 #detail-body 上（innerHTML 每次重绘都会换掉子节点，绑定按钮本身会漏）。
   按钮天然在 makeFloatDraggable 的排除表里（表里有 button），所以浮窗的 setPointerCapture
   不会把这次 click 重定向到窗口根 —— 这正是 details 窗内其它按钮一直在用的那条通路。 */
detailBody.addEventListener("click", e => {
  const b = (e.target && e.target.closest) ? e.target.closest("button.ex") : null;
  if (b) takeExcerpt(b.getAttribute("data-ex"), sel);
  /* 唱机详情里的「播放音乐」按钮：直接播放内置曲目（无手势被拦时静默） */
  const pm = (e.target && e.target.closest) ? e.target.closest("#dt-play-music") : null;
  if (pm) playMusic("Air_Bach");

/* 「新」角标**只有玩家点过这个节点才会摘**：这里把 DOM 上那枚角标摘掉，同时清 n.unread

   只在角标**已经画在屏上**时才动手（n.el 为空说明还没重绘出来，留着让 render 正常亮一下）。

/* ============ 画布平移 / 缩放 ============ */
(function(){
  let panning = false, sx = 0, sy = 0, ox = 0, oy = 0;
  stage.addEventListener("pointerdown", e => {
    /* 窗口/浮层/图标上不触发平移与清除选中（操作不穿透） */
    if (e.target.closest(".node") || e.target.closest(".syswin, #toast, #verdict, .desk-icon")) return;
    cancelViewAnim();   /* 玩家开始平移 → 接管镜头，打断自动居中 */
    /* 点空白不再收浮窗（文本框用 × 关闭），只清除选中/聚焦 */
    clearSelection();
    panning = true; sx = e.clientX; sy = e.clientY; ox = view.x; oy = view.y;
    stage.classList.add("grabbing");
  });
  stage.addEventListener("pointermove", e => {
    if (!panning) return;
    view.x = ox + (e.clientX - sx); view.y = oy + (e.clientY - sy); applyView();
  });
  window.addEventListener("pointerup", () => { panning = false; stage.classList.remove("grabbing"); });
  stage.addEventListener("wheel", e => {
    /* 光标在窗口/浮层上时滚轮交给窗口自己的滚动条，不触发画布缩放 */
    const t = e.target;
    if (t && t.closest && t.closest(".syswin, #toast, #verdict")) return;
    cancelViewAnim();   /* 玩家缩放 → 接管镜头 */
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const k2 = Math.max(.35, Math.min(1.8, view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    view.x = mx - (mx - view.x) * (k2 / view.k);
    view.y = my - (my - view.y) * (k2 / view.k);
    view.k = k2; applyView();
  }, { passive: false });
})();

function fit(){
  const keys = Object.keys(G.nodes).filter(k => !G.nodes[k].hidden && !G.nodes[k].stored);
  if (!keys.length) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  keys.forEach(k => {
    const n = G.nodes[k];
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x + NODE_W[n.kind]); y1 = Math.max(y1, n.y + NODE_H[n.kind]);
  });
  const r = stage.getBoundingClientRect();
  const pad = 60;
  const k = Math.max(.35, Math.min(1.3, Math.min((r.width - pad * 2) / (x1 - x0), (r.height - pad * 2) / (y1 - y0))));
  view.k = k;
  view.x = (r.width - (x1 - x0) * k) / 2 - x0 * k;
  view.y = (r.height - (y1 - y0) * k) / 2 - y0 * k;
  applyView();
  /* 「适应窗口」也是自动动镜头（开场只有一个场景节点时的展开就走这条路），一并记账 */
  lastFocus = { on:true, why:"fit", keys:keys.slice() };
}

/* attachIcon(el, app, onQuick)：onQuick 提供时「单击 = 选中并直接打开」
   （播放器图标用，用户要求单击即开）；不提供时保持全桌一致的双击打开。 */
function attachIcon(el, app, onQuick){
  app = app || el.dataset.app;
  let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(el.style.left) || 0; oy = parseFloat(el.style.top) || 0;
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    e.stopPropagation();
  });
  el.addEventListener("pointermove", e => {
    if (!dragging) return;
    if (!moved && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) < 5) return;
    moved = true;
    const r = desktopEl.getBoundingClientRect();
    el.style.left = Math.max(0, Math.min((r.width || 1200) - 64, ox + e.clientX - sx)) + "px";
    el.style.top  = Math.max(0, Math.min((r.height || 800) - 64, oy + e.clientY - sy)) + "px";
  });
  el.addEventListener("pointerup", e => {
    if (!dragging) return;
    dragging = false;
    if (!moved){
      selectIcon(el);
      if (onQuick) onQuick();
    }
  });
  if (!onQuick) el.addEventListener("dblclick", () => openApp(app));
}

    else if (isHere){ state.className = "map-state on"; state.textContent = caseOpen ? "当前" : "进入"; }
    else if (!loadable){ state.className = "map-state pend"; state.textContent = "待接入"; }
    else { state.className = "map-state"; state.textContent = "可进入"; }
    row.appendChild(glyph); row.appendChild(meta); row.appendChild(state);
    row.dataset.case = c.id;
    if (c.id === lastEnteredCase) row.classList.add("ignite");
    /* 已经开着的本案不用再点；有地址的行都能进 */
    if (unlocked && !(isHere && caseOpen)){
      row.classList.add("clickable");
      row.addEventListener("click", () => enterCase(c.id));
    }
    w.body.appendChild(row);
  });
  desktopEl.appendChild(w.el);
  makeFloatDraggable(w.el, false);
  mapWinEl = w.el;
}

/* ==== 案件存档（各存各档）与切换 ====
   每个案件一份独立存档：tec_case_<id> = snapshot()（与撤销栈同构）。
   切换 = 存当前案 -> 载目标案数据 -> 清会话态 -> 重建（有档续档，无档全新开局）。 */
const CASE_STORE_PREFIX = "tec_case_";
let lastEnteredCase = null;
let switchingCase = false;
/* 案件窗是否开着：关掉 = 回到案件地图，进度存进本案的档 */
let caseOpen = true;
function caseStoreKey(id){ return CASE_STORE_PREFIX + id; }
function saveCaseState(id){
  try {
    if (!store) return;
    /* 在快照基础上额外记住镜头位置，回访时原位恢复（老存档没有 __view 就退回 fit） */
    const snap = JSON.parse(snapshot());
    snap.__view = { x: view.x, y: view.y, k: view.k };
    store.setItem(caseStoreKey(id), JSON.stringify(snap));
  } catch(_){}
}
function loadCaseState(id){
  try { if (store){ const raw = store.getItem(caseStoreKey(id)); if (raw) return raw; } } catch(_){}
  return null;
}
function clearCaseState(id){
  try { if (store) store.removeItem(caseStoreKey(id)); } catch(_){}
}
function hasCaseSave(id){
  try { if (store) return store.getItem(caseStoreKey(id)) != null; } catch(_){}
  return false;
}
function setCaseWinVisible(v){
  const cw = document.getElementById("case-win");
  if (cw && cw.style) cw.style.display = v ? "" : "none";
  caseOpen = !!v;
}
/* 案件窗关着的时候，画布上的操作全部拦下 —— 否则是在操作一个看不见的画布 */
function requireCase(){
  if (caseOpen) return true;
  toast("当前不在案件中，请先把它展开（右下角的案件卡片，或案件地图里的本案那行）");
  return false;
}

/* ==== 案件窗离屏后的两个落点（互斥）====
   – 收起（最小化）：缩成桌面右下角的案件卡片 #case-dock，可拖动，点卡片展开
   × 关闭：缩进桌面左侧的「案件地图」图标 #map-icon，图标打「已关闭」角标，进案件地图展开
   案件窗在屏幕上时两者都为 false。 */
let caseHeld = false;     /* 挂在「案件地图」图标上（× 关闭） */
let caseDockOn = false;   /* 停在右下角卡片上（– 收起） */

/* ---- 落点 A：右下角案件卡片 ---- */
function updateCaseDock(){
  const c = caseById(CASE_ID);
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  set("cd-code", c ? c.code : CASE_ID);
  set("cd-title", caseTitleOf(CASE_ID));
  set("cd-sub", hasCaseSave(CASE_ID) ? "进度已保存 · 点此展开" : "点此展开");
}
function showCaseDock(v){
  caseDockOn = !!v;
  const d = document.getElementById("case-dock");
  if (!d || !d.classList) return;
  if (v) updateCaseDock();
  d.classList.toggle("on", !!v);
}
/* 右下角卡片可拖动：按住拖动 = 挪位置（拖动过的那一次不展开），原地单击 = 展开案件。
   它原来是靠 right/bottom 定位的，首次按下时换算成 left/top。
   注意 moved 要在 pointerdown 复位 —— 这样"拖完紧跟的 click"被吞掉，下一次正常单击又能用。 */
function attachDock(el, onPick){
  if (!el || !el.addEventListener) return;
  let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    /* 卡片内控制键（播放器最小化卡片的播放/暂停、停止）不启动拖动，也不吃掉它们自己的 click */
    if (e.target && e.target.closest && e.target.closest("button")) return;
    if (el.style.left === "" || el.style.left == null){
      const r = el.getBoundingClientRect(), sr = desktopEl.getBoundingClientRect();
      el.style.left = (r.left - sr.left) + "px";
      el.style.top  = (r.top  - sr.top ) + "px";
      el.style.right = "auto"; el.style.bottom = "auto";
    }
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(el.style.left) || 0; oy = parseFloat(el.style.top) || 0;
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    if (e.stopPropagation) e.stopPropagation();
  });
  el.addEventListener("pointermove", e => {
    if (!dragging) return;
    if (!moved && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) < 5) return;
    moved = true;
    const r = desktopEl.getBoundingClientRect();
    const w = el.offsetWidth || 170, h = el.offsetHeight || 56;
    el.style.left = Math.max(0, Math.min((r.width  || 1200) - w, ox + e.clientX - sx)) + "px";
    el.style.top  = Math.max(0, Math.min((r.height ||  800) - h, oy + e.clientY - sy)) + "px";
  });
  el.addEventListener("pointerup", () => { dragging = false; });
  /* 落点默认展开案件；TEC 助手卡片传了 onPick，就展开 TEC 对话窗。
     点的是卡片内控制键时不唤回（键自己的 click 已处理）。 */
  el.addEventListener("click", e => {
    if (moved) return;
    if (e && e.target && e.target.closest && e.target.closest("button")) return;
    if (onPick) onPick(); else enterCase(CASE_ID);
  });
}
/* 收缩 / 展开的位移与缩放：把案件窗和右下角卡片的中心对上。
   卡片只用 visibility 隐藏、保留布局盒，所以隐藏时也量得到（这是选它当落点的一个原因）。 */
function caseDockMotion(){
  const cw = document.getElementById("case-win"), d = document.getElementById("case-dock");
  if (!cw || !d || typeof cw.getBoundingClientRect !== "function") return null;
  if (typeof d.getBoundingClientRect !== "function") return null;
  const w = cw.getBoundingClientRect(), r = d.getBoundingClientRect();
  if (!w.width || !w.height || !r.width || !r.height) return null;
  const dx = (r.left + r.width / 2) - (w.left + w.width / 2);
  const dy = (r.top + r.height / 2) - (w.top + w.height / 2);
  const s  = Math.max(.05, Math.min(r.width / w.width, r.height / w.height));
  return { s: s, tf: "translate(" + dx + "px," + dy + "px) scale(" + s + ")" };
}

/* ---- 落点 B：「案件地图」图标 ---- */
function updateMapBadge(){
  const icon = document.getElementById("map-icon");
  if (!icon || !icon.querySelector) return;
  let b = icon.querySelector(".badge");
  if (caseHeld){
    if (!b){ b = document.createElement("span"); b.className = "badge cnt"; icon.appendChild(b); }
    b.textContent = "已关闭";
  } else if (b) b.remove();
}
function setCaseHeld(v){
  caseHeld = !!v;

}
/* 把案件窗和「案件地图」图标的图形（.icon-glyph，不含下面的文字标签）中心对上。
   无头 stub 不解析 HTML、取不到 .icon-glyph，就退回整个图标元素（它有 offsetWidth/Height，照样解得出来）。 */
function caseIconMotion(){
  const cw = document.getElementById("case-win");
  const icon = document.getElementById("map-icon");
  if (!cw || !icon || typeof cw.getBoundingClientRect !== "function") return null;
  const anchor = (icon.querySelector && icon.querySelector(".icon-glyph")) || icon;
  if (typeof anchor.getBoundingClientRect !== "function") return null;
  const w = cw.getBoundingClientRect(), r = anchor.getBoundingClientRect();
  if (!w.width || !w.height || !r.width || !r.height) return null;
  const dx = (r.left + r.width / 2) - (w.left + w.width / 2);
  const dy = (r.top + r.height / 2) - (w.top + w.height / 2);
  const s  = Math.max(.05, Math.min(r.width / w.width, r.height / w.height));
  return { s: s, tf: "translate(" + dx + "px," + dy + "px) scale(" + s + ")" };
}

/* ---- 两个落点的统一开关 ---- */
function caseParkPoint(p){
  if (p === "dock"){ setCaseHeld(false); showCaseDock(true); }
  else { showCaseDock(false); setCaseHeld(true); }
}
function caseParkMotion(p){ return (p === "dock") ? caseDockMotion() : caseIconMotion(); }
/* 当前案件落在哪（案件窗开着时返回 null） */
function caseParkedAt(){ return caseOpen ? null : (caseDockOn ? "dock" : (caseHeld ? "icon" : null)); }
function caseMotionReset(){
  const cw = document.getElementById("case-win");
  if (!cw) return;
  if (cw.style){
    cw.style.transition = ""; cw.style.transform = ""; cw.style.transformOrigin = ""; cw.style.opacity = "";
  }
  if (cw.classList) cw.classList.remove("case-switching");
}
/* 离屏：从当前位置缩到寄存落点上（目标点由 caseParkMotion 给） */
function caseMotionApply(tf){
  const cw = document.getElementById("case-win");
  if (!cw || !cw.style) return;
  cw.style.transition = "transform .26s cubic-bezier(.4,0,.2,1), opacity .26s ease";
  cw.style.transformOrigin = "50% 50%";
  cw.style.transform = tf;
  cw.style.opacity = "0";
}
/* 展开：从寄存落点放大回原位（窗口要已经显示出来，才量得到目标位置）。p = "dock" | "icon" */
function caseMotionPlayIn(p){
  const cw = document.getElementById("case-win");
  if (!cw || !cw.style) return;
  const m = caseParkMotion(p);
  if (!m) return;
  cw.style.transition = "none";
  cw.style.transformOrigin = "50% 50%";
  cw.style.transform = m.tf;
  cw.style.opacity = "0";
  if (typeof cw.getBoundingClientRect === "function") cw.getBoundingClientRect();   /* 强制回流，让起始态生效 */
  cw.style.transition = "transform .26s cubic-bezier(.4,0,.2,1), opacity .26s ease";
  cw.style.transform = "none";
  cw.style.opacity = "1";
  const t = setTimeout(caseMotionReset, 300);
  if (!t) caseMotionReset();
}
/* 案件标题：优先用案件数据自己声明的 config.caseTitle，否则退回案件库里的占位名 */
function caseTitleOf(id){
  const c = caseById(id);
  if (!c) return id;
  const d = CASE_DATA[id];
  return (d && d.config && d.config.caseTitle) || c.title || "？？？？？？";
}
/* 案件副标题：未解锁时用案件库里的加密提示，解锁后用数据自带说明（或通用文案） */
function caseNoteOf(id){
  const c = caseById(id);
  if (!c) return "";
  if (!caseUnlocked(id)) return c.note;
  const d = CASE_DATA[id];
  if (!d) return "地址已解锁 · 案件数据待装载";
  const base = (d.config && d.config.caseNote) || "异动区域 · 已解锁";
  return hasCaseSave(id) ? base + " · 有存档" : base;
}
/* 外壳上的案件标识（案件窗标题栏 + 顶栏副标题） */
function updateCaseChrome(){
  const c = caseById(CASE_ID);
  if (!c) return;
  const title = document.getElementById("case-title");
  if (title) title.textContent = c.code + " // " + caseTitleOf(CASE_ID);
  const sub = (typeof document.querySelector === "function") ? document.querySelector(".brand small") : null;
  if (sub) sub.textContent = "节点原型 v2 · 案件 " + c.code.replace(/^CASE\s+/, "");
}
/* 从案件地图进入案件：
   已经开着本案 -> 空操作；开着别的案 -> 存旧案 + 换档；本来关着 -> 不存，直接续档。 */
function enterCase(id){
  if (switchingCase) return false;
  if (caseOpen && id === CASE_ID) return false;
  const c = caseById(id);
  if (!c) return false;
  if (!caseUnlocked(id)){ toast("该案件地址尚未解密"); return false; }
  if (!CASE_DATA[id]){ toast("案件 <b>" + esc(c.code) + "</b> 的数据尚未装载"); return false; }
  const cw = document.getElementById("case-win");
  /* 本来已经离屏：从它当时落下的地方（右下角卡片 / 案件地图图标）放大展开回来 */
  if (!caseOpen){
    const p = caseParkedAt() || "icon";
    doEnterCase(id, null);
    caseMotionPlayIn(p);
    return true;
  }
  const from = CASE_ID;
  const swap = () => {
    switchingCase = false;
    if (cw && cw.classList) cw.classList.remove("case-switching");
    doEnterCase(id, from);
  };
  /* 屏上有案就先淡出再换档。无定时器的环境（无头驱动）立即同步换档。 */
  if (cw && cw.classList){
    cw.classList.remove("case-switching");
    cw.classList.add("case-switching");
    switchingCase = true;
    const t = setTimeout(swap, 180);
    if (!t) swap();
  } else swap();
  return true;
}
function doEnterCase(id, from){
  const c = caseById(id);
  const snap = loadCaseState(id);    /* 先把目标案的档读出来，再存旧案，免得两边撞在一起 */
  if (from){ saveCaseState(from); resetTec(); closeDlgWin(); closeBagWin(); closeClueWin(); }   /* 只有换案才清 TEC、对话窗与两扇收纳窗；同案回访保留 */
  applyCaseData(CASE_DATA[id]);      /* 2. 载目标案数据 */
  CASE_ID = id;
  progress.last = id; saveProgress();
  /* 3. 清会话态：撤销栈 / 图标位置 */
  history = [];
  resetIconPositions();
  closeMapWin();
  lastEnteredCase = id;
  /* 4. 清掉两个寄存落点、打开案件窗、重建：有档续档，无档全新开局 */
  showCaseDock(false);
  setCaseHeld(false);
  caseMotionReset();
  setCaseWinVisible(true);
  boot({ fromSnapshot: snap });
  log("已进入案件 <b>" + esc(c.code) + " // " + esc(caseTitleOf(id)) + "</b>", "sys");
}
/* 案件窗离屏：p = "dock"（– 收起 → 右下角卡片）/ "icon"（× 关闭 → 「案件地图」图标）。
   两条路都先存盘、都不弹案件地图，只是落点不同。 */
function parkCase(p){
  if (!caseOpen || switchingCase) return false;
  const cw = document.getElementById("case-win");
  const finish = () => {
    switchingCase = false;
    caseMotionReset();
    saveCaseState(CASE_ID);          /* 离开现场，先把进度存进本案的档 */
    setCaseWinVisible(false);
    caseParkPoint(p);
    history = [];
    /* 浮层都锚在画布上，画布一藏就没意义了，一起收掉
       （TEC 是独立助手窗、证物袋 / 线索册是随身收纳，三扇常驻窗都保留） */
    closeBubble(); closeNarr(); closePwPop();
    clearSelection();
    setDetailWin(false);
  };
  /* – 收起：带收缩动画缩到右下角卡片（落点先亮出来当靶子，案件窗再缩过去）。
     × 关闭：不做收缩动画，直接离屏 —— 用户反馈"缩进图标"那下不舒服。
     展开回来时仍走 caseMotionPlayIn，从落点放大（保留）。 */
  const m = (p === "dock") ? caseParkMotion(p) : null;
  if (cw && cw.style && m){
    caseParkPoint(p);
    caseMotionApply(m.tf);
    switchingCase = true;
    const t = setTimeout(finish, 280);
    if (!t) finish();
  } else finish();
  return true;
}
/* – 收起：缩成右下角的案件卡片 */
function stowCase(){ return parkCase("dock"); }
/* × 关闭：直接离屏，落到「案件地图」图标（不做收缩动画） */
function closeCase(){ return parkCase("icon"); }

  const qt = document.createElement("div");
  qt.className = "quiz-q";
  qt.textContent = q.q;
  body.appendChild(qt);
  q.opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "quiz-opt";
    b.textContent = o[1];
    b.addEventListener("click", () => answerQuestion(i));
    body.appendChild(b);
  });
}
function setIntroName(v){
  if (!introState) return;
  introState.name = v;
  if (introState.nameInput) introState.nameInput.value = v;
}
function beginQuiz(){
  if (!introState) return;
  const v = String((introState.nameInput && introState.nameInput.value) || introState.name || "").trim();
  if (!v){
    if (introWinEl){ introWinEl.classList.remove("shake"); void introWinEl.offsetWidth; introWinEl.classList.add("shake"); }
    return;
  }
  introState.name = v;
  introState.step = 0;
  renderIntro();
}
function answerQuestion(i){
  if (!introState || typeof introState.step !== "number") return;
  const q = QUIZ[introState.step];
  const opt = q && q.opts[i];
  if (!opt) return;
  introState.answers.push(opt[0]);
  if (introState.step < QUIZ.length - 1){ introState.step++; renderIntro(); }
  else finishQuiz();
}
function finishQuiz(){
  const counts = {};
  let best = null, bestN = 0;
  introState.answers.forEach(s => {   /* 平局取先达到的（按答题顺序） */
    counts[s] = (counts[s] || 0) + 1;
    if (counts[s] > bestN){ bestN = counts[s]; best = s; }
  });
  introState.card = { name: introState.name, id: genInvId(), sense: best,
    date: new Date().toISOString().slice(0, 10), avatarId: introState.avatarId || AVATAR_DEFAULT_ID };
  introState.step = "avatar";   /* 答完三问先挑头像，再领证 */
  setIntroTitle("AVATAR // 选择头像");
  renderIntro();
}
/* 选头像步骤：点一格 = 记下并就地重画（不动步进） */
function pickIntroAvatar(id){
  if (!introState || introState.step !== "avatar") return;
  introState.avatarId = id;
  if (introState.card) introState.card.avatarId = id;
  renderIntro();
}
/* 头像 → 领证（证件照照选中的那张画） */
function confirmAvatarStep(){
  if (!introState || introState.step !== "avatar") return;
  if (introState.card) introState.card.avatarId = introState.avatarId;
  introState.step = "card";
  setIntroTitle("INVESTIGATOR // 调查员证");
  renderIntro();
}
/* 领证前反悔：退回选头像那一步 */
function backToAvatarStep(){
  if (!introState || introState.step !== "card") return;
  introState.step = "avatar";
  setIntroTitle("AVATAR // 选择头像");
  renderIntro();
}
function confirmCard(){
  if (!introState || !introState.card) return;
  /* 老调用路径（直接 confirm 跳过选头像）不拦：拿默认头像补上，免得证件照空着 */
  if (introState.avatarId) introState.card.avatarId = introState.avatarId;
  investigator = introState.card;
  try { if (store) store.setItem("tec_investigator", JSON.stringify(investigator)); } catch(_){}
  if (introWinEl) introWinEl.classList.add("shrink");
  setTimeout(finishIntro, 420);   /* stub 的 setTimeout 是 noop：测试用 __intro.finish() 收尾 */
}
function finishIntro(){
  if (!introState) return;
  closeIntroLight();
  mountInvChip();
  /* 不在这里放起始场景的叙事卡：开局只留一个「未探索」的花园节点，
     等玩家双击展开时才出叙事卡（见 boot / revealScene）。 */
  log("调查员 <b>" + esc(investigator.name) + "</b>（" + esc(investigator.id) + "）已接入 T.E.C-OS", "sys");
}

/* 由编号确定性生成的 5×5 镜像像素识别图（div 网格，不用 canvas；cell 为每格边长 px） */
function genAvatar(id, cell){
  const px = cell || 18;
  let h = 0;
  const s = String(id || "");
  for (let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  const grid = [];
  for (let y = 0; y < 5; y++){
    for (let x = 0; x < 3; x++){
      h = (h * 1103515245 + 12345) >>> 0;
      grid[y * 5 + x] = grid[y * 5 + (4 - x)] = (h >>> 16) & 1;
    }
  }
  const box = document.createElement("div");
  box.className = "cert-photo";
  box.style.gridTemplateColumns = "repeat(5, " + px + "px)";
  box.style.gridTemplateRows = "repeat(5, " + px + "px)";
  grid.forEach(on => {
    const d = document.createElement("div");
    d.className = "px" + (on ? " on" : "");
    d.style.width = px + "px"; d.style.height = px + "px";
    box.appendChild(d);
  });
  return box;
}

/* ============ AVATAR // 头像库（测试末尾选，领证后也能换）============
   可选 = 常驻两人（执行者 / TEC，一开局就在）+ 已结识的人 —— 判据直接沿用名册的 `metChars()`。
   池子是**现算**的 ⇒「每遇到一个新人物就解锁一张」不需要任何写盘逻辑；
   未解锁的只画一个虚线「？」占位，**不显示名字**（免得剧透还没出场的人）。
   选中的 id 记在 `investigator.avatarId`；没记（本轮之前的老存档）就照旧用 cert-avatar.png。 */
const AVATAR_INITIAL    = ["CHARS_EXEC", "CHARS_TEC"];   /* 初始可选，顺序 = 并排先后 */
const AVATAR_DEFAULT_ID = "CHARS_EXEC";                  /* 测试流程里默认选中的那张 */
const AVATAR_TIP = "挑一张头像印在证件上。每结识一位新人物，就会多出一张可选的头像。";
function avatarNameOf(id){
  const p = ROSTER_PINNED.find(x => x.id === id);        /* 执行者的名字写在这里，CHARS 里没有它 */
  if (p && p.name) return p.name;
  return (CHARS[id] || {}).name || id;
}
/* 已解锁的 id（有序：常驻在前，其余沿用名册顺序） */
function avatarUnlocked(){
  const ids = AVATAR_INITIAL.slice();
  metChars().forEach(id => { if (ids.indexOf(id) < 0) ids.push(id); });
  return ids;
}
/* 还没解锁的候选张数（只报数、不报是谁） */
function avatarLockedCount(){
  const have = avatarUnlocked();
  return Object.keys(CHARS).filter(id => have.indexOf(id) < 0).length;
}
/* 一格头像框（有美术稿用像素图，没有的用首字方块）—— 与名册共用同一套 `.av` 写法 */
function buildAvatarFace(id){
  const box = document.createElement("span");
  box.className = "av";
  const art = rosterAvatar(id);
  if (art){
    const im = document.createElement("img");
    im.src = art;
    im.alt = ""; im.draggable = false;
    box.appendChild(im);
  } else {
    const ini = document.createElement("span");
    ini.className = "ini"; ini.textContent = avatarNameOf(id).slice(0, 1);
    box.appendChild(ini);
  }
  return box;
}
/* 选头像的格子阵列：values = 已解锁（有序）/ sel = 当前选中 / locked = 未解锁占位数 */
function buildAvatarPicker(values, sel, locked, onPick){
  const grid = document.createElement("div");
  grid.className = "avatar-grid";
  values.forEach(id => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "avatar-pick" + (id === sel ? " sel" : "");
    b.dataset.id = id;
    b.appendChild(buildAvatarFace(id));
    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = avatarNameOf(id);
    b.appendChild(nm);
    b.addEventListener("click", () => onPick(id));
    grid.appendChild(b);
  });
  for (let i = 0; i < (locked || 0); i++){
    const d = document.createElement("div");
    d.className = "avatar-pick locked";
    const av = document.createElement("span");
    av.className = "av"; av.textContent = "?";
    d.appendChild(av);
    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = "未解锁";
    d.appendChild(nm);
    grid.appendChild(d);
  }
  return grid;
}
/* 解锁计数行：「已解锁 n / m」（m = 可选 + 未解锁 = 常驻 2 + CHARS 全体） */
function avatarCounterNode(){
  const d = document.createElement("div");
  d.className = "avatar-count";
  const got = avatarUnlocked().length, lock = avatarLockedCount();
  d.textContent = "已解锁 " + got + " / " + (got + lock);

}
/* 证件照内容：选了头像就照那个画（像素图 / 首字方块）；
   没选（老存档）或该 id 取不到图 ⇒ 退回固定的调查员照片 */
function fillCertPhoto(box, c){
  const id = c && c.avatarId;

/* ============ 内置音乐库 + 播放器 ============
   歌曲源文件放 src/assets/，源码里用素材占位符引用 —— 占位符本身就代表一个
   「完整可用的 src」：index 成品里是 assets/ 外链（可缓存、可流式），
   standalone 单文件里是 data: 内联（离线自包含）。以后要加更多曲子，
   只往 MUSIC_LIB 里再塞一条即可。
   入口：唱针装入唱机后，桌面图标列出现「播放器」图标（单击开窗）；
   窗体可 – 最小化成桌面右下角的播放器卡片 #music-dock，点卡片唤回。 */
const MUSIC_LIB = [
  { id: "Air_Bach", title: "Air (Bach)", src: "assets/Air_Bach.ogg" }
];
let musicAudio = null, musicCurrent = null;
function fmtTime(s){
  if (!isFinite(s) || s < 0) return "--:--";
  s = Math.round(s);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
/* 进度 / 时间：窗口开着就刷窗内进度条与时间行；最小化卡片上的迷你进度条与时间**始终**刷
   （用户要求最小化时也要能看到进度）。 */
function renderMusicProgress(){
  const cur = musicAudio ? musicAudio.currentTime : 0;
  const dur = musicAudio && musicAudio.duration && isFinite(musicAudio.duration) ? musicAudio.duration : 0;
  const pct = dur ? Math.min(100, cur / dur * 100) : 0;
  if (musicWinEl && !musicMin){
    const fill = musicWinEl.querySelector(".music-prog i");
    const time = musicWinEl.querySelector(".music-time");
    if (fill) fill.style.width = pct + "%";
    if (time) time.textContent = fmtTime(cur) + " / " + fmtTime(dur);
  }
  const dfill = document.getElementById("md-prog-fill");
  if (dfill) dfill.style.width = pct + "%";
  const dsub = document.getElementById("md-sub");
  if (dsub) dsub.textContent = musicCurrent ? (fmtTime(cur) + " / " + fmtTime(dur)) : "已停止 · 点此展开";
}
/* 播放/暂停切换后的联动：窗开着刷整窗（换键面图标），最小化卡片换键面 */
function syncMusicPlayState(){
  if (musicWinEl && !musicMin) renderMusicWin();
  renderMusicDock();
}
function renderMusicDock(){
  const pp = document.getElementById("md-pp");
  if (pp) pp.innerHTML = iconSvg((musicCurrent && musicAudio && !musicAudio.paused) ? "pause" : "play", 13);
  /* 卡片首行显示当前曲名（不放「播放器」字样）；没在播时退回应用名 */
  const nm = document.getElementById("md-name");
  if (nm){
    const t = musicCurrent ? MUSIC_LIB.find(m => m.id === musicCurrent) : null;
    nm.textContent = t ? t.title : "MUSIC // 播放器";
  }
  renderMusicProgress();
}
/* 最小化卡片上的控制键（播放/暂停、停止）：建卡时接线一次 */
function initMusicDock(){
  const pp = document.getElementById("md-pp"), st = document.getElementById("md-stop");
  if (!pp || !st || !pp.addEventListener) return;
  pp.addEventListener("click", e => {
    if (e && e.stopPropagation) e.stopPropagation();
    if (musicCurrent) playMusic(musicCurrent);
  });
  st.addEventListener("click", e => {
    if (e && e.stopPropagation) e.stopPropagation();
    stopMusic();
  });
}
function playMusic(id){
  const t = MUSIC_LIB.find(m => m.id === id);
  if (!t || typeof Audio === "undefined") return false;
  if (!musicAudio){
    musicAudio = new Audio();
    musicAudio.addEventListener("timeupdate", renderMusicProgress);
    musicAudio.addEventListener("loadedmetadata", renderMusicProgress);
    musicAudio.addEventListener("play", syncMusicPlayState);
    musicAudio.addEventListener("pause", syncMusicPlayState);
  }
  if (musicCurrent === id && !musicAudio.paused){ musicAudio.pause(); return false; }   /* 再点一次 = 暂停 */
  if (musicCurrent === id){                    /* 续播：不动 src，接着上次的进度，绝不能重设 src（会归零） */
    const p = musicAudio.play();
    if (p && p.catch) p.catch(() => {});
    return true;
  }
  musicAudio.loop = true;                 /* 唱机循环，贴合叙事 */
  musicAudio.src = t.src;
  const p = musicAudio.play();
  if (p && p.catch) p.catch(() => {});    /* 无手势被拦时静默 */
  musicCurrent = id;
  if (musicWinEl) renderMusicWin();
  renderMusicDock();                      /* 最小化卡片首行的曲名同步 */
  return true;
}
function stopMusic(){
  if (musicAudio) musicAudio.pause();
  musicCurrent = null;
  if (musicWinEl) renderMusicWin();
  renderMusicDock();
}

/* 播放器桌面图标：唱机装上唱针后解锁（installed 已进存档，刷新即还原）。
   与其他 desk-icon 同栏同站位（ICON_LAYOUT 动态追加一条，重排后不留洞）。 */
let musicWinEl = null, musicMin = false, musicIconEl = null;
function changjiNeedleFitted(){
  const c = nodeByKey("item", "ITEMS_changji");
  return !!(c && c.installed && c.installed["ITEMS_cz"]);
}
function refreshMusicIcon(){
  const on = changjiNeedleFitted();
  if (on && !musicIconEl){
    const el = document.createElement("div");
    el.className = "desk-icon";
    el.id = "music-icon";
    el.dataset.app = "music";
    el.innerHTML = '<div class="icon-glyph">' + iconSvg("music", 24) + '</div><div class="icon-label">播放器</div>';
    document.getElementById("icons").appendChild(el);
    attachIcon(el, "music", toggleMusicWin);   /* 用户要求单击即开（其他图标是双击开） */
    musicIconEl = el;
    if (!ICON_LAYOUT.some(r => r[0] === "music-icon")) ICON_LAYOUT.push(["music-icon", "music"]);
    resetIconPositions();
  } else if (!on && musicIconEl){
    if (musicWinEl) closeMusicWin();           /* 针没了（重置/换案），窗与最小化卡片一并收 */
    musicIconEl.remove();
    musicIconEl = null;
    const i = ICON_LAYOUT.findIndex(r => r[0] === "music-icon");
    if (i >= 0){ ICON_LAYOUT.splice(i, 1); resetIconPositions(); }
  }
}
/* 窗体三态：开着（musicWinEl 有、musicMin=false）/ 最小化（musicWinEl 有、musicMin=true，
   窗体藏起、右下角 #music-dock 亮出）/ 关着（musicWinEl 无）。 */
function updateMusicDock(){
  const d = document.getElementById("music-dock");
  if (d) d.classList.toggle("on", !!(musicWinEl && musicMin));
}
function closeMusicWin(){
  if (musicWinEl){ musicWinEl.remove(); musicWinEl = null; }
  musicMin = false;
  updateMusicDock();
}
function minMusicWin(){
  if (!musicWinEl || musicMin) return;
  musicMin = true;
  musicWinEl.style.display = "none";
  updateMusicDock();
}
function restoreMusicWin(){
  if (!musicWinEl) return openMusicWin();
  musicMin = false;
  musicWinEl.style.display = "";
  renderMusicWin();          /* 最小化期间播放状态可能变过，唤回时按当前状态重绘 */
  updateMusicDock();
}
function toggleMusicWin(){
  if (musicWinEl){ if (musicMin) restoreMusicWin(); else closeMusicWin(); return; }
  openMusicWin();
}
function openMusicWin(){
  closeMusicWin();
  const w = makeWindow("MUSIC // 播放器", closeMusicWin, minMusicWin);
  w.el.classList.add("music-win");
  musicWinEl = w.el;
  renderMusicWin();
  desktopEl.appendChild(w.el);
  makeFloatDraggable(w.el, false);
  return true;
}
function renderMusicWin(){
  if (!musicWinEl) return;
  const body = musicWinEl.querySelector(".syswin-body");
  if (!body) return;
  body.innerHTML = "";
  const head = document.createElement("div");
  head.className = "music-head";
  head.textContent = "内置音乐 · " + MUSIC_LIB.length + " 首";
  body.appendChild(head);
  const list = document.createElement("div");
  list.className = "music-list";
  MUSIC_LIB.forEach(t => {
    /* 曲目行只负责选曲（点行播放/暂停当前曲），不放播放键 —— 播放/暂停收拢在底部控制区，全窗只有一个 */
    const row = document.createElement("div");
    row.className = "music-row" + (musicCurrent === t.id ? " cur" : "");
    row.title = musicCurrent === t.id ? "播放中 · 点击暂停" : "播放这首";
    const name = document.createElement("span");
    name.className = "music-name";
    name.textContent = t.title;
    row.appendChild(name);
    row.addEventListener("click", () => playMusic(t.id));
    list.appendChild(row);
  });
  body.appendChild(list);
  if (musicCurrent){
    /* 底部播放区：进度条（可点跳转）+ 时间 + 图标控制键（播放/暂停、停止） */
    const player = document.createElement("div");
    player.className = "music-player";
    const prog = document.createElement("div");
    prog.className = "music-prog";
    prog.title = "播放进度 · 点击跳转";
    const fill = document.createElement("i");
    prog.appendChild(fill);
    prog.addEventListener("click", e => {
      if (!musicAudio || !musicAudio.duration || !isFinite(musicAudio.duration)) return;
      const r = prog.getBoundingClientRect();
      const k = Math.min(1, Math.max(0, (e.clientX - r.left) / Math.max(1, r.width)));
      musicAudio.currentTime = k * musicAudio.duration;
      renderMusicProgress();
    });
    const time = document.createElement("div");
    time.className = "music-time";
    const ctrl = document.createElement("div");
    ctrl.className = "music-ctrl";
    const pp = document.createElement("button");
    pp.className = "music-ibtn";
    pp.title = (musicAudio && !musicAudio.paused) ? "暂停" : "播放";
    pp.innerHTML = iconSvg((musicAudio && !musicAudio.paused) ? "pause" : "play", 13);
    pp.addEventListener("click", () => playMusic(musicCurrent));
    const stop = document.createElement("button");
    stop.className = "music-ibtn";
    stop.title = "停止";
    stop.innerHTML = iconSvg("stop", 13);
    stop.addEventListener("click", stopMusic);
    ctrl.appendChild(pp); ctrl.appendChild(stop);
    player.appendChild(prog); player.appendChild(time); player.appendChild(ctrl);
    body.appendChild(player);
    renderMusicProgress();
  }
}

function closeInvReview(){ if (invReviewEl){ invReviewEl.remove(); invReviewEl = null; } }

/* ---- 换头像（领证之后）：证件窗里的「更换头像」开这扇独立窗 ----
   池子同样是现算的 ⇒ 之后结识的人会立刻出现在里面，不需要刷新任何东西。 */
let avatarWinEl = null, avatarPickId = null;
function closeAvatarWin(){ if (avatarWinEl){ avatarWinEl.remove(); avatarWinEl = null; } }
function openAvatarWin(){
  if (!investigator) return false;
  closeAvatarWin();
  avatarPickId = investigator.avatarId || AVATAR_DEFAULT_ID;
  const w = makeWindow("AVATAR // 选择头像", closeAvatarWin);
  w.el.classList.add("avatar-win");
  avatarWinEl = w.el;
  renderAvatarWin();
  desktopEl.appendChild(w.el);
  makeFloatDraggable(w.el, false);
  return true;
}
function renderAvatarWin(){
  if (!avatarWinEl) return;
  const body = avatarWinEl.querySelector(".syswin-body");
  if (!body) return;
  body.innerHTML = "";
  const tip = document.createElement("div");
  tip.className = "avatar-tip";
  tip.textContent = AVATAR_TIP;
  body.appendChild(tip);
  body.appendChild(buildAvatarPicker(avatarUnlocked(), avatarPickId, avatarLockedCount(), id => {
    avatarPickId = id; renderAvatarWin();
  }));

  btn.className = "primary";
  btn.textContent = "[ 换上这张 ]";
  btn.addEventListener("click", confirmAvatarPick);
  body.appendChild(btn);
