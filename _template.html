function confirmAvatarPick(){
  if (!investigator || !avatarPickId) return false;
  investigator.avatarId = avatarPickId;
  try { if (store) store.setItem("tec_investigator", JSON.stringify(investigator)); } catch(_){}
  log("调查员头像更换为 <b>" + esc(avatarNameOf(avatarPickId)) + "</b>", "sys");
  closeAvatarWin();
  /* 证件窗开着就整扇重开一次，照片立刻换过来（窗位固定，看不见跳动） */
  const hadCert = !!invReviewEl;
  closeInvReview();
  if (hadCert) openCardReview();
  return true;
}

function openCardReview(){
  if (!investigator) return;
  closeInvReview();
  const w = makeWindow("INVESTIGATOR // 调查员证", closeInvReview);
  w.el.classList.add("cert-win");
  w.body.appendChild(buildCert(investigator));
  const btnAv = document.createElement("button");
  btnAv.textContent = "[ 更换头像 ]";
  btnAv.addEventListener("click", openAvatarWin);
  const btn = document.createElement("button");
  btn.textContent = "[ 重新测试 ]";
  btn.addEventListener("click", () => {
    try { if (store) store.removeItem("tec_investigator"); } catch(_){}
    investigator = null;
    if (invChipEl){ invChipEl.remove(); invChipEl = null; }
    closeInvReview();
    openIntro();
  });
  const actions = document.createElement("div");
  actions.className = "cert-actions";
  actions.appendChild(btnAv);
  actions.appendChild(btn);
  w.body.appendChild(actions);
  desktopEl.appendChild(w.el);
  makeFloatDraggable(w.el, false);
  invReviewEl = w.el;
}

/* ============ 花园：真名结局的后续温柔 ============
   「确认捕获」点下后，执行者头顶会挂一枚种子（13-matrix.js 的 .mx-seedpop 对话框）；
   把它拖进花园（本窗或本图标）落在哪儿就种在哪儿 —— **没有固定坛位**，
   种下之后花草还能在园子里随意拖动摆放。真实时间约三分钟长成白花。
   生长走真实时钟（株上只记 at = 下种时刻），存档随行 —— 关游戏再回来，花不会倒退；
   株下的计时用进度条表示（不用倒计时文字），窗关着期间照常生长，重开按真实进度出条。 */
const GARDEN_IMG = {
  seed:   "assets/flower/plant_seed.png",
  sprout: "assets/flower/plant_sprout.png",
  leaf1:  "assets/flower/plant_leaf_stage_1.png",
  leaf2:  "assets/flower/plant_leaf_stage_2.png",
  bloom:  "assets/flower/plant_flower.png"
};
const GARDEN_STAGE_IMG = ["seed", "sprout", "leaf1", "leaf2", "bloom"];
const GARDEN_STAGE_NAME = ["种子", "嫩芽", "展叶", "舒叶", "开花"];
/* 生长档位（毫秒）：45s 嫩芽 → 90s 展叶 → 135s 舒叶 → 180s 开花（约三分钟） */
const GARDEN_STAGES = [0, 45000, 90000, 135000, 180000];
/* 株的位置记成花圃地面的百分比（x/y ∈ 8..92 / 30..85），不跟窗体像素走 —— 换机器、缩放都不歪 */
const GARDEN_X = [8, 92], GARDEN_Y = [30, 85];
let gardenWinEl = null, gardenIconEl = null, gardenTimer = null, gardenDragLive = false, gardenNarrEl = null;
/* 叙事框当前是对着哪一株开的（株对象本身，来自 G.garden.plots，身份稳定）。
   单独记一份是因为每秒一次的 gardenTick 会重绘整窗 —— 只靠 DOM 引用会在重绘后失联。
   gardenNarrShown = 已浮现到第几段（逐段旁白的进度）；重绘要连进度一起装回去，否则每秒钟被打回第一段。 */
let gardenNarrPlot = null;
let gardenNarrShown = 0;

function gardenOK(){ return !!G.garden; }
/* 真名结局的大段「真名形成说明」：从案件数据里取（用于开花后点花呈现）；旧档里已有株却缺
   narr 字段时回填，保证换机器 / 续档也能点花看到说明。 */
function trueEndingMessage(){
  const e = (typeof ENDINGS !== "undefined") && ENDINGS.find(x => x.isTrueCapture);
  return e ? (e.message || "") : "";
}
/* 花圃清单：老档归一化 —— 旧「槽位时代」的存档里数组带 null 占位、株上没有坐标，
   在这里过滤 + 补一个散开的默认位置；正常路径只是原样返回。 */
function gardenPlots(){
  if (!G.garden) G.garden = { seed:false, plots:[], narr:null };
  if (!Array.isArray(G.garden.plots)) G.garden.plots = [];
  G.garden.plots = G.garden.plots.filter(Boolean);
  G.garden.plots.forEach((p, i) => {
    if (typeof p.x !== "number") p.x = 24 + (i % 4) * 18;
    if (typeof p.y !== "number") p.y = 58;
  });
  /* 旧档迁移：捕获过真名、有株、但没存 narr（早期版本没这字段）→ 补回真名说明 */
  if (G.garden.plots.some(Boolean) && !G.garden.narr) G.garden.narr = trueEndingMessage();
  return G.garden.plots;
}
/* 真结局发种子（确认捕获那一刻调，15-desktop.js，带 message）：只发一枚，种下之后（或旧档
   已有株）不再发；message 随种子一起记进 G.garden.narr，留待开花后点花用叙事框承载。 */
function grantGardenSeed(msg){
  if (!gardenOK()) G.garden = { seed:false, plots:[], narr:null };
  if (msg) G.garden.narr = msg;          /* 幂等：重发（同结局）也只是覆盖同一段说明 */
  if (G.garden.seed || G.garden.plots.some(Boolean)) return;
  G.garden.seed = true;
  refreshInferWin();          /* 执行者头顶的对话框（窗开着立刻可见；重开会按状态重建） */
  refreshGardenIcon();
}
/* 生长档位 0..4：种子 → 嫩芽 → 展叶 → 舒叶 → 开花。
   判定按**整秒**量化：档位不会因为毫秒级抖动在边界上闪跳（180000 整 = 开花，179999 = 舒叶，
   且这格判定在整整一秒内都是稳定的），倒计时行仍然显示精确到秒的余量。 */
function gardenStageOf(p){
  const el = Math.floor((Date.now() - p.at) / 1000) * 1000;
  let st = 0;
  for (let i = 1; i < GARDEN_STAGES.length; i++) if (el >= GARDEN_STAGES[i]) st = i;
  return st;
}
/* 种子的合法落点：花园窗（开着且没被最小化藏起）或花园图标 */
function overGardenDrop(cx, cy){
  if (gardenWinEl && gardenWinEl.style.display !== "none"){
    const r = gardenWinEl.getBoundingClientRect();
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) return true;
  }
  const ic = document.getElementById("garden-icon");
  if (ic){
    const r = ic.getBoundingClientRect();
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) return true;
  }
  return false;
}
/* 落点 → 花圃地面百分比（越界夹回）；窗没开 / 图标上松手 = 中间偏下 */
function gardenSpotOf(cx, cy){
  let x = 50, y = 58;
  const field = gardenWinEl && gardenWinEl.querySelector(".gd-field");
  if (cx != null && field){
    const r = field.getBoundingClientRect();
    if (r.width > 0 && r.height > 0){
      x = (cx - r.left) / r.width * 100;
      y = (cy - r.top) / r.height * 100;
    }
  }
  return { x: Math.round(Math.max(GARDEN_X[0], Math.min(GARDEN_X[1], x))),
           y: Math.round(Math.max(GARDEN_Y[0], Math.min(GARDEN_Y[1], y))) };
}
/* 下种：落在哪儿就种在哪儿（没有坛位）。与收纳同一道门：案卷得开着（下种是写进度的动作）；
   种子离身，头顶对话框收走。 */
function gardenPlant(cx, cy){
  if (!gardenOK() || !G.garden.seed) return false;
  if (!requireCase()){ refreshInferWin(); return false; }
  const spot = gardenSpotOf(cx, cy);
  pushHistory();
  G.garden.seed = false;
  gardenPlots().push({ at: Date.now(), hit: false, x: spot.x, y: spot.y });
  refreshInferWin();
  refreshGardenWin();
  refreshGardenIcon();
  toast("种子落土了。给花魄一点时间。");
  return true;
}

/* ---- 桌面图标：捕获真名（有种子或有株）才出现，照播放器图标的先例动态挂进 ICON_LAYOUT ---- */
function refreshGardenIcon(){
  const on = gardenOK() && (G.garden.seed || G.garden.plots.some(Boolean));
  if (on && !gardenIconEl){
    const el = document.createElement("div");
    el.className = "desk-icon";
    el.id = "garden-icon";
    el.dataset.app = "garden";
    el.innerHTML = '<div class="icon-glyph">' + iconSvg("flower", 24) + '</div><div class="icon-label">花园</div>';
    document.getElementById("icons").appendChild(el);
    attachIcon(el, "garden");                 /* 与全桌一致：双击开（单击选中） */
    gardenIconEl = el;
    if (!ICON_LAYOUT.some(r => r[0] === "garden-icon")) ICON_LAYOUT.push(["garden-icon", "garden"]);
    resetIconPositions();
  } else if (!on && gardenIconEl){
    if (gardenWinEl) closeGardenWin();        /* 重置 / 换案：窗与图标一并收 */
    gardenIconEl.remove();
    gardenIconEl = null;
    const i = ICON_LAYOUT.findIndex(r => r[0] === "garden-icon");
    if (i >= 0){ ICON_LAYOUT.splice(i, 1); resetIconPositions(); }
  }
  updateGardenBadge();
}
function updateGardenBadge(){
  if (!gardenIconEl) return;
  const cnt = gardenPlots().filter(Boolean).length;
  let b = gardenIconEl.querySelector(".badge");
  if (cnt > 0){
    if (!b){ b = document.createElement("span"); b.className = "badge cnt"; gardenIconEl.appendChild(b); }
    b.textContent = cnt + " 株";
  } else if (b) b.remove();
}

/* ---- 花园窗：一块自由花圃。株 = 绝对定位（left/top 百分比 = 下种落点），可拖动摆放 ---- */
function toggleGardenWin(){ if (gardenWinEl){ closeGardenWin(); return; } openGardenWin(); }
function openGardenWin(){
  if (gardenWinEl){ gardenWinEl.style.display = ""; return; }
  const w = makeWindow("GARDEN // 花园", closeGardenWin);
  w.el.classList.add("garden-win");
  desktopEl.appendChild(w.el);
  makeFloatDraggable(w.el, false);
  gardenWinEl = w.el;
  refreshGardenWin();
  startGardenTicker();
}
function closeGardenWin(){ if (gardenWinEl){ closeGardenNarr(); gardenWinEl.remove(); gardenWinEl = null; } }
function refreshGardenWin(){
  if (!gardenWinEl) return;
  const body = gardenWinEl.querySelector(".syswin-body");
  if (!body) return;
  /* 每秒一次的 tick 会走到这里重绘整窗：先把「叙事框正对着哪一株、读到第几段」记住，
     重绘末尾按同一株 + 同一进度把框装回去 —— 否则玩家刚点开的花魄说明会在 1 秒内被打回第一段。 */
  const keepNarr = gardenNarrPlot, keepShown = gardenNarrShown;
  body.innerHTML = "";
  gardenNarrEl = null; gardenNarrPlot = null;
  const field = document.createElement("div");
  field.className = "gd-field";
  gardenPlots().forEach(p => {
    const st = gardenStageOf(p);
    const plant = document.createElement("div");
    plant.className = "gd-plant";
    if (st >= 4) plant.classList.add("bloom");
    plant.style.left = p.x + "%";
    plant.style.top = p.y + "%";
    const im = document.createElement("img");
    im.src = GARDEN_IMG[GARDEN_STAGE_IMG[st]];
    im.alt = GARDEN_STAGE_NAME[st]; im.draggable = false;
    plant.appendChild(im);
    const stg = document.createElement("span");
    stg.className = "gd-stage";
    stg.textContent = st >= 4 ? "开花" : GARDEN_STAGE_NAME[st];
    plant.appendChild(stg);
    /* 生长计时 = 进度条：按真实时钟出条（窗关着也在长，重开即当前进度）。
       开花后不再出条 —— 花已开成，进度条站在那里已无意义，只留花与状态词（用户口径）。 */
    if (st < 4){
      const prog = document.createElement("div");
      prog.className = "gd-prog";
      const fill = document.createElement("i");
      fill.style.width = Math.min(100, Math.round(Math.max(0, Date.now() - p.at) / GARDEN_STAGES[4] * 100)) + "%";
      prog.appendChild(fill);
      plant.appendChild(prog);
    }
    plant.title = st >= 4 ? "花魄开的花 —— 拖着可以换位置" : "还在长 —— 关掉游戏也不会倒退，拖着可以换位置";
    makeGardenPlantDraggable(plant, p);
    field.appendChild(plant);
  });
  body.appendChild(field);
  if (keepNarr) openGardenNarr(keepNarr, keepShown || 1);     /* 重绘前开着 → 按同一株 + 同一进度装回去 */
  updateGardenBadge();
}
/* 花圃内自由拖拽：按住一株直接挪（不进撤销栈 —— 摆放是装修，不是破案进度）。
   拖动中只更新 left/top 与株上的 x/y，不重建 DOM；松手才重绘一次把档位行带上。 */
function makeGardenPlantDraggable(el, p){
  let dragging = false, moved = false, sx = 0, sy = 0;
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY;
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    e.stopPropagation();
  });
  el.addEventListener("pointermove", e => {
    if (!dragging) return;
    if (!moved && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) < 5) return;
    moved = true; gardenDragLive = true;
    const field = gardenWinEl && gardenWinEl.querySelector(".gd-field");
    if (!field) return;
    const r = field.getBoundingClientRect();
    if (!(r.width > 0 && r.height > 0)) return;
    const spot = gardenSpotOf(e.clientX, e.clientY);
    p.x = spot.x; p.y = spot.y;
    el.style.left = p.x + "%";
    el.style.top = p.y + "%";
  });
  const finish = () => {
    if (!dragging) return;
    dragging = false; gardenDragLive = false;
    if (moved) refreshGardenWin();          /* 拖完了重绘一遍（标题行等跟随新位置） */
  };
  el.addEventListener("pointerup", finish);
  el.addEventListener("pointercancel", finish);
  /* 开花后点花：在花的上/下方浮现叙事框（仅点击、拖过不算）。点同一株关闭、点别株切换。 */
  el.addEventListener("click", () => {
    if (moved) return;                                  /* 刚拖过 → 吞掉这次点击 */
    if (!el.classList.contains("bloom")) return;          /* 没开花不弹 */
    if (!G.garden || !G.garden.narr) return;             /* 没有说明文字（非真结局）不弹 */
    toggleGardenNarr(p, el);
  });
}

/* ---- 开花后点花：排在花圃下方的叙事框（承载真名结局的 message）----
   插在 .gd-field 之后、随窗一起长高 —— 不再绝对定位压在花圃上（那样会跟花草挤成一团）。
   同一时刻只开一个；点同一株关闭、点别株切换。
   呈现按用户定稿的 A+B：**逐段旁白** —— 点花先淡出一段，点框继续下一段，一段一口气，读完为止。 */

/* 真名说明分段：把一大块说明切成「一段一口气」的旁白段。
   1) 先按句末标点（。！？…）断句；2) 超长句（> 140 字）在逗号 / 顿号 / 分号处就近对半再切，
   免得像原句那样一口气念不到头；3) 贪心并句，目标约 150 字一段 —— 读起来是几段话，不是一堵字墙。 */
function narrSegments(text){
  const t = String(text || "").trim();
  if (!t) return [];
  const sents = t.match(/[^。！？…]+[。！？…]*/g) || [t];
  const clauses = [];
  sents.forEach(s => splitLongClause(s.trim(), clauses));
  const segs = [];
  let cur = "";
  clauses.filter(Boolean).forEach(c => {
    if (cur && (cur + c).length > 150){ segs.push(cur); cur = ""; }
    cur += c;
  });
  if (cur) segs.push(cur);
  return segs;
}
function splitLongClause(s, out){
  if (s.length <= 140){ out.push(s); return; }
  const parts = s.match(/[^，、；]+[，、；]?/g) || [s];
  let acc = 0, cut = 0, bestD = Infinity;
  parts.forEach((p, i) => {
    acc += p.length;
    const d = Math.abs(acc - s.length / 2);
    if (i < parts.length - 1 && d < bestD){ bestD = d; cut = i; }
  });
  splitLongClause(parts.slice(0, cut + 1).join(""), out);
  splitLongClause(parts.slice(cut + 1).join(""), out);
}
/* 把「已浮现到第 shown 段」铺进正文；animate=1 时让最新一段淡入（只在用户推进时给），
   未读完时留下「继续」提示。每秒重绘会重建整框 —— 那时 animate=0，免得最后一段每秒重播淡入。 */
function renderNarrBody(box, segs, shown, animate){
  const nb = box.querySelector(".gd-narr-body");
  if (!nb) return;
  nb.innerHTML = "";
  segs.slice(0, shown).forEach((s, i) => {
    const p = document.createElement("p");
    p.className = "gd-narr-p";
    if (animate && i === shown - 1) p.classList.add("in");   /* 只让最新一段淡入 */
    p.textContent = s;
    nb.appendChild(p);
  });
  const more = box.querySelector(".gd-narr-more");
  if (more) more.style.display = (shown < segs.length) ? "" : "none";
  /* 读完就把整框的「点一下」光标收回：再点也没下一段了，别继续给可点的暗示 */
  box.classList.toggle("done", shown >= segs.length);
}
/* 点一下框 = 浮现下一段；已读完则不动。 */
function advanceGardenNarr(){
  if (!gardenNarrEl || !gardenNarrPlot) return;
  const segs = narrSegments(G.garden && G.garden.narr);
  if (gardenNarrShown >= segs.length) return;
  gardenNarrShown++;
  renderNarrBody(gardenNarrEl, segs, gardenNarrShown, 1);
  fitGardenInView();                       /* 又长高一段 → 若顶到视口底，把窗整体上移 */
}
/* 逐段旁白会把窗撑高，整段读完时可能超出视口底边。用户口径「正文不内部滚动」——
   于是改挪窗：读的时候把窗整体上移，直到整段都看得见（只上移，不动左右）。
   只在「点花 / 点框推进」这两处用户动作时挪，每秒重绘不挪 —— 免得跟手动拖动打架。
   坐标换算：窗挂在 desktopEl 内（absolute），要把视口坐标折回相对桌面层再写 style.top。 */
function fitGardenInView(){
  if (!gardenWinEl || gardenWinEl.isConnected === false) return;
  const vh = (typeof window !== "undefined" && window.innerHeight) || 0;
  if (!vh) return;                                  /* 无头 stub 里量不到视口 → 不动 */
  const r = gardenWinEl.getBoundingClientRect();
  if (!(r.height > 0)) return;
  const over = r.bottom - (vh - 10);
  if (over <= 0) return;
  const pTop = desktopEl ? desktopEl.getBoundingClientRect().top : 0;
  gardenWinEl.style.top = Math.round(Math.max(pTop + 8, r.top - over) - pTop) + "px";
}
function closeGardenNarr(){
  if (gardenNarrEl){ gardenNarrEl.remove(); gardenNarrEl = null; }
  gardenNarrPlot = null; gardenNarrShown = 0;
}
/* shown 给了就按它铺（重绘续档），没给就是新开 → 只亮第一段。
   fit=1 时（点花 / 推进这类用户动作）读完整段若顶到视口底就上移窗；重绘不挪。 */
function openGardenNarr(p, shown, fit){
  if (!G.garden || !G.garden.narr) return;
  const body = gardenWinEl && gardenWinEl.querySelector(".syswin-body");
  if (!body) return;
  const segs = narrSegments(G.garden.narr);
  if (!segs.length) return;
  if (gardenNarrEl) gardenNarrEl.remove();      /* 换株 / 重绘：先摘掉旧的，但不动 shown */
  const n = Math.min(Math.max(1, shown | 0), segs.length);
  const box = document.createElement("div");
  box.className = "gd-narr";
  box._p = p;
  const head = document.createElement("div");
  head.className = "gd-narr-head";
  const name = document.createElement("b");
  name.className = "gd-narr-name"; name.textContent = "花魄";
  const sub = document.createElement("span");
  sub.className = "gd-narr-sub"; sub.textContent = "真名 · 形成说明";
  const x = document.createElement("span");
  x.className = "gd-narr-x"; x.textContent = "×"; x.title = "关闭";
  x.addEventListener("click", e => { e.stopPropagation(); closeGardenNarr(); });
  head.appendChild(name); head.appendChild(sub); head.appendChild(x);
  const nb = document.createElement("div");
  nb.className = "gd-narr-body";
  const more = document.createElement("div");
  more.className = "gd-narr-more"; more.textContent = "▸ 点一下 · 继续";
  box.appendChild(head); box.appendChild(nb); box.appendChild(more);
  box.addEventListener("click", () => { if (gardenNarrEl === box) advanceGardenNarr(); });
  /* 接在花圃之后（窗口随框一起变高），是正文的最后一块。 */
  body.appendChild(box);
  gardenNarrEl = box;
  gardenNarrPlot = p;
  gardenNarrShown = n;
  renderNarrBody(box, segs, n, fit ? 1 : 0);
  if (fit) fitGardenInView();
}
function toggleGardenNarr(p, plant){
  if (gardenNarrPlot === p){ closeGardenNarr(); return; }   /* 点同一株 = 收起 */
  openGardenNarr(p, 1, true);
}
/* 每秒看一眼：窗开着才动 DOM；跨过开花那一刻弹一枚 toast（每株一次，记在株上）。
   存档回来时花早已开过（超过 10 秒）就静默补记，不补弹。
   拖拽进行中不动 DOM（重建会把正被抓住的那株换掉，指针就脱手了）。 */
function gardenTick(){
  if (!gardenWinEl || !gardenOK()) return;
  gardenPlots().forEach(p => {
    if (!p || p.hit) return;
    if (gardenStageOf(p) >= 4){
      p.hit = true;
      if (Date.now() - p.at <= GARDEN_STAGES[4] + 10000) toast("「花魄」开花了。");
    }
  });
  if (!gardenDragLive) refreshGardenWin();
}
function startGardenTicker(){
  if (gardenTimer) return;
  try { gardenTimer = setInterval(gardenTick, 1000); } catch(_){ gardenTimer = null; }   /* 无头 stub 可能没有 interval */
}

/* ============ 启动 ============ */
function boot(opts){
  opts = opts || {};
  G = blankGraph();
  closePwPop();
  closeBubble();
  closeNarr();
  /* 注意：TEC 窗、证物袋窗、线索册窗都不在这里关。三扇常驻窗（独立助手 / 随身收纳 / 随身册子），
     只有换案 / 重置才清（resetTec / closeBagWin / closeClueWin 在各自调用点），
     否则「– 收起 → 展开」回访同一案件时会被顺带收掉。 */
  closeGotoWin();
  closeInferWin();
  closePeopleWin();
  closeMapWin();
  closeGardenWin();    /* 花园窗同理：开局 / 换案 / 重置都收（图标由 refreshGardenIcon 按状态重挂） */
  view = { x: 40, y: 20, k: 1 };
  applyView();
  logBox.innerHTML = "";
  setDetailWin(false);
  detailPlaceholder();
  updateCaseChrome();
  /* 续档：直接恢复目标案快照（不重放起始场景的叙事卡） */
  if (opts.fromSnapshot){
    let saved = null;
    try { saved = JSON.parse(opts.fromSnapshot).__view || null; } catch(_){}
    restore(opts.fromSnapshot);
    render();
    /* 存档里带了镜头就原位恢复，否则兜底 fit */
    if (saved && isFinite(saved.x) && isFinite(saved.y) && isFinite(saved.k)){
      view = { x: saved.x, y: saved.y, k: saved.k };
      applyView();
    } else fit();
    refreshBagWin();   /* 袋窗若开着，清单按恢复后的图刷新（G 刚重建过） */
    refreshClueWin();  /* 册窗同理（同样是常驻窗，恢复的图变了） */
    mountInvChip();
    return;
  }
  /* 开局只放一个「未探索」的起始场景节点：里面的东西和叙事卡都要等玩家双击展开时才出现，
     开场画面保持干净，第一次交互就是「双击这个节点」。 */
  ensureNode("loc", START, { label: SCENES[START].title || START, x: 1000, y: 620 });
  G.lastScene = START;   /* 交谈 / TEC 的上下文仍认起始场景，只是画面还没展开 */
  layout();
  render();
  fit();
  refreshBagWin();   /* 同上：全新开局时袋窗若开着，刷成空清单 */
  refreshClueWin();  /* 册窗同理 */
  mountInvChip();
  if (!investigator) openIntro();
  const _cc = caseById(CASE_ID);
  const _code = (_cc ? _cc.code : CASE_ID).replace(/^CASE\s+/, "");
  log("已载入案件 <b>" + esc(_code) + "</b>：双击 <b>场景节点</b> 展开里面的东西，把节点 <b>拖到另一个节点上</b> 组合使用。", "sys");
  if (CASE_ID === "A001") log("提示：先双击「植物学家的花园」展开场景，再双击「书桌」等继续展开，拖动手电筒到黑影上试试。", "sys");
}

/* 测试钩子（供 verify.js 无头驱动） */
window.__combo = (a, b) => attemptCombo(a, b);
window.__talk = key => { const n = G.nodes[key]; if (n) runPrimary(n); };
window.__tec = key => tecConsult(key);
window.__analyze = key => tecAnalyze(key);
window.__analyzeStart = (key, ms) => tecAnalyzeStart(key, ms);   /* 只起任务、不排收尾（测「分析中」态） */
window.__analyzeFinish = key => tecAnalyzeFinish(key);
window.__tecMin = () => minTecWin();
window.__tecState = () => ({ min: tecMin, dot: tecDot, busy: tecBusy, task: tecTask ? tecTask.key : null });
window.__tecTalk = () => tecTalk();
window.__collapse = sid => toggleCollapse(sid);
window.__store = (key, sid) => storeNode(key, sid);
window.__bag = key => bagStore(key);
window.__bagTake = key => bagTake(key);
window.__pin = key => { const n = G.nodes[key]; if (n) togglePin(n); };
window.__bagToggle = () => toggleBagWin();
window.__cap = key => attemptCapture(key);
window.__noteSeen = t => noteSeen(t);
window.__goto = sid => gotoScene(sid);
window.__gotoList = () => heardScenes();
window.__clueToggle = () => toggleClueWin();
window.__clueLedger = () => ledgerList().map(n => ({ key:n.key, id:n.id, label:n.label, sense:(CLUES[n.id] || {}).type }));
window.__ledgerStore = key => ledgerStore(key);
window.__ledgerTake  = key => ledgerTake(key);
window.__ledgerToMatrix = key => ledgerToMatrix(key);   /* 等价于把册中一行拖上推演桌布 */
window.__dropTargets = () => nodeDropTargets();
window.__peopleToggle = () => togglePeopleWin();
window.__roster = () => metChars().map(id => {
  const pin = ROSTER_PINNED.find(p => p.id === id);
  const p = charProgress(id);
  return { id, name:(pin && pin.name) || (CHARS[id] || {}).name || id,
           pinned:!!pin, art:!!rosterAvatar(id), prog:p.prog, total:p.total };
});
window.__mxAssign = (k, s) => assignClue(k, s);
window.__boardTake = (id, sense, cx, cy) => boardTake(id, sense, cx, cy);   /* 等价于把桌布上的 chip 拖出去 */
window.__matrixItems = () => matrixItems().map(n => n.key);
window.__infer = () => executeInference();
window.__render = () => render();   /* 验证 / 调试：手动重绘整张画布（等价于任何一次 render 调用） */
window.__inferToggle = () => toggleInferWin();
window.__ensure = (kind, id) => {
  const d = kind === "clue" ? (CLUES[id] || {}) : (ITEMS[id] || {});
  return ensureNode(kind, id, { label: d.label || id });
};
/* 花园（无头验证 / 调试）：plant(cx,cy) 等价于把种子拖进花园（无坐标 = 中部）；plantAt(ms)
   直接种一枚「ms 毫秒前」下种的种子 —— 生长走真实时钟，钩子靠倒拨 at 来测各档位，不用真等三分钟 */
window.__garden = {
  state: () => ({
    seed: gardenOK() ? G.garden.seed : null,
    plots: gardenOK() ? gardenPlots().map(p => ({ stage: gardenStageOf(p), at: p.at, hit: !!p.hit, x: p.x, y: p.y })) : null,
    icon: !!gardenIconEl, win: !!gardenWinEl
  }),
  grant: (msg) => grantGardenSeed(msg),
  narr: () => G.garden ? G.garden.narr : null,
  plant: (cx, cy) => gardenPlant(cx, cy),
  plantAt: ms => { if (!gardenOK()) return false;
    const i = gardenPlots().length;
    gardenPlots().push({ at: Date.now() - (ms || 0), hit: ms >= GARDEN_STAGES[4] + 10000,
      x: 24 + (i % 4) * 18, y: 58 });
    refreshGardenWin(); refreshGardenIcon(); return true; },
  open: () => openGardenWin(),
  close: () => closeGardenWin(),
  redraw: () => refreshGardenWin()      /* 模拟一次 tick 重绘（验证「叙事框不被重绘抹掉」） */
};
/* 真名结局的「真名形成说明」原文（开花后点花叙事框的内容来源；验证用） */
window.__trueEndingMsg = () => {
  const e = (typeof ENDINGS !== "undefined") && ENDINGS.find(x => x.isTrueCapture);
  return e ? (e.message || null) : null;
};
window.__playStep = () => { if (memoryPlay) advanceMemory(); else if (endingState) playEndingStage(); };
window.__intro = {
  step: () => introState && introState.step,
  name: v => setIntroName(v),
  begin: () => beginQuiz(),
  answer: i => answerQuestion(i),
  /* confirm 会**跳过**选头像那一步直接领证（老调用路径保留）：拿默认头像补上 */
  confirm: () => confirmCard(),
  pick: id => pickIntroAvatar(id),
  confirmPick: () => confirmAvatarStep(),
  avatar: () => introState && introState.avatarId,
  pool: () => avatarUnlocked(),
  finish: () => finishIntro()
};
/* 头像库全局态（无头环境量不到点击，量状态）：池子现算 ⇒ 遇到新人后这里立刻变长 */
window.__avatars = () => ({
  pool: avatarUnlocked(),
  locked: avatarLockedCount(),
  chosen: (investigator && investigator.avatarId) || null,
  win: !!avatarWinEl,
  pick: avatarPickId
});
window.__avatarOpen = () => openAvatarWin();
window.__avatarPick = id => { avatarPickId = id; renderAvatarWin(); };
window.__avatarConfirm = () => confirmAvatarPick();
window.__select = key => key ? selectNode(key) : clearSelection();
window.__closeFloats = () => { closeBubble(); closeDlgWin(); closeNarr(); closePwPop(); };
window.__renarr = sid => renarrScene(sid);
window.__hit   = (cx, cy) => { const e = hitTest(cx, cy, null); return e ? e.dataset.key : null; };
window.__switchCase = id => enterCase(id);
window.__closeCase = () => closeCase();
window.__registerCase = (id, data) => { CASE_DATA[id] = data; };
window.__caseDataOf = id => CASE_DATA[id];
window.__unlockCase = id => unlockCase(id);
window.__excerpt = (target, srcKey) => takeExcerpt(target, srcKey || sel);   /* 等价于点正文里的下划线 */
window.__excerpts = id => excerptsOf(id).map(e => ({ text:e.text, to:e.to }));
window.__caseInfo = () => ({
  id: CASE_ID,
  open: caseOpen,
  held: caseHeld,
  dock: caseDockOn,
  registered: Object.keys(CASE_DATA),
  lastEntered: lastEnteredCase,
  unlocked: progress.unlocked.slice(),
  title: (document.getElementById("case-title") || {}).textContent,
  start: START,
  sceneTitle: (SCENES[START] || {}).title || null
});
window.__dump  = () => ({
  nodes: Object.keys(G.nodes),
  lit: Object.keys(G.nodes).filter(k => G.nodes[k].lit),
  talk: Object.assign({}, G.talkProg),
  tec: { prog: Object.assign({}, G.tecProg), lastScene: G.lastScene },
  hidden: Object.keys(G.nodes).filter(k => G.nodes[k].hidden),
  stored: Object.keys(G.nodes).filter(k => G.nodes[k].stored),
  /* 被收走的节点去哪儿了：BAG / LEDGER / MATRIX（归位的线索离开画布后落在桌布上） */
  storedIn: (() => { const o = {}; for (const k in G.nodes){ if (G.nodes[k].stored) o[k] = G.nodes[k].storedIn; } return o; })(),
  bag: bagItems().map(n => n.key),
  ledger: ledgerItems().map(n => n.key),
  collapsed: [...G.collapsed],
  dim: G._dimKeys || [],
  sel: sel,
  floats: { bubble: !!bubbleEl, dlg: !!dlgWinEl, narr: !!narrEl, pw: !!pwPop, bag: !!bagWinEl, goto: !!gotoWinEl, matrix: !!inferWinEl, tec: !!tecWinEl, clue: !!clueWinEl, people: !!peopleWinEl, detail: detailWinOpen, logs: logWinOpen },
  matrix: JSON.parse(JSON.stringify(G.matrix)),
  endings: [...G.endings],
  garden: G.garden ? { seed: !!G.garden.seed, plots: gardenPlots().filter(Boolean).length } : null,
  gardenIcon: !!gardenIconEl,
  endingOverlay: !!endingState,
  investigator: investigator ? { name: investigator.name, id: investigator.id, sense: investigator.sense,
                                 avatarId: investigator.avatarId || null } : null,
  intro: !!introWinEl,
  edges: G.edges.map(e => e.kind + ":" + e.a + ">" + e.b),
  explored: [...G.explored], captured: [...G.captured], tried: [...G.tried],
  history: history.length,
  /* 镜头（无头环境量不到位移，但能读状态）：拖进拖出的落点换算 / 自动聚焦的对账都要它 */
  view: { x: view.x, y: view.y, k: view.k },
  pos: (() => { const o = {}; for (const k in G.nodes){
    o[k] = { x: Math.round(G.nodes[k].x), y: Math.round(G.nodes[k].y), pinned: !!G.nodes[k].pinned }; } return o; })(),
  /* 装上的零件（唱机 ← 唱针）：节点上的状态，撤销 / 续档跟着走 */
  installed: (() => { const o = {}; for (const k in G.nodes){ if (G.nodes[k].installed) o[k] = Object.keys(G.nodes[k].installed); } return o; })(),
  /* 最近一次自动聚焦的「决定」（无头环境量不到镜头位移，量决定；on=false 表示镜头没动） */
  focus: lastFocus ? { on:lastFocus.on, why:lastFocus.why, keys:(lastFocus.keys || []).slice() } : null
});

boot();
refreshMusicIcon();          /* 还原存档时若唱机已装针，桌面播放器图标要补回来 */
refreshGardenIcon();         /* 还原存档时若捕获过真名（种子未种 / 坛里有花），桌面花园图标要补回来 */

/* 无头验证 / 调试用的音乐钩子（不依赖真实音频设备：只查 DOM 与库状态） */
window.__music = {
  state: () => ({ lib: MUSIC_LIB.map(m => ({ id: m.id, title: m.title })), current: musicCurrent,
    fitted: changjiNeedleFitted(), icon: !!musicIconEl,
    win: !!musicWinEl, min: musicMin,
    time: musicAudio ? Math.round(musicAudio.currentTime * 10) / 10 : 0,
    paused: musicAudio ? musicAudio.paused : true,
    dock: (() => { const d = document.getElementById("music-dock"); return !!(d && d.classList && d.classList.contains("on")); })() }),
  fitNeedle: () => { let c = nodeByKey("item", "ITEMS_changji");
    if (!c) c = ensureNode("item", "ITEMS_changji", { label: "唱机" });
    c.installed = Object.assign({}, c.installed); c.installed["ITEMS_cz"] = true; refreshMusicIcon(); },
  open: () => { if (musicWinEl && musicMin) return restoreMusicWin(); return openMusicWin(); },
  min: () => minMusicWin(),
  restore: () => restoreMusicWin(),
  close: () => closeMusicWin()
};
</script>
